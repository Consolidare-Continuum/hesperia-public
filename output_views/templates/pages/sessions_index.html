{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>Sessions</h1>
{% if sessions %}
<ul class="sessions-list">
  {% for sid in sessions %}
  <li><a href="{% url 'session_inspector' sid %}">{{ sid }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No sessions available.</p>
{% endif %}
{% endblock %}
