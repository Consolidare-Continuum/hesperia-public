# LEVEL 1 — Структура областей TFP / Кернберг. Язык: русский.
# 12 операционных областей (индексы 0–11). Топология: икосаэдр (12 узлов).
# T1.1 Определение областей | T1.2 Цель области | T1.3 Смежность областей.
# TFP-POLES-02 (2026-08-21): A11/A12 locked names; area_neighbors = full sphere 0–11.
version: 1
domain: TFP_KERNBERG
language: ru
public_area_count: 12

areas:
  - area_id: A1
    area_index: 0
    name: Drives & Affects
    name_ru: Влечения и аффекты
    description: |
      Базовая регуляция влечений и аффектов; импульсы, эмоциональная напряжённость, аффективная толерантность.
    clinical_scope: |
      Оценка силы влечений, аффективной лабильности, толерантности к фрустрации; связь с объектными отношениями и защитами.
    activation_signals:
      - влечения
      - аффекты
      - импульс
      - эмоция
      - толерантность к фрустрации
      - либидо
      - агрессия (как влечение)
    exclusions:
      - чисто поведенческое описание без аффекта
      - когнитивное содержание без связи влечение/аффект
    area_neighbors: [1, 5, 7, 10, 11]  # full topology (degree 5)

  - area_id: A2
    area_index: 1
    name: Object Relations
    name_ru: Объектные отношения
    description: |
      Внутренние репрезентации себя и объекта; качество объектных связей, интернализованные отношения.
    clinical_scope: |
      Структура объектных отношений (Кернберг), уровень интеграции, расщепление, примитивные vs зрелые связи.
    activation_signals:
      - объектные отношения
      - репрезентация себя
      - интернализованные
      - расщепление
      - парциальный объект
      - целостный объект
    exclusions:
      - чисто межличностное поведение без внутренней репрезентации
    area_neighbors: [0, 5, 7, 8, 9]

  - area_id: A3
    area_index: 2
    name: Defensive Operations
    name_ru: Защитные операции
    description: |
      Защитные механизмы; примитивные и зрелые защиты, их иерархия и гибкость.
    clinical_scope: |
      Идентификация защит (отрицание, проекция, проективная идентификация, изоляция и т.д.); уровень организации защит.
    activation_signals:
      - защита
      - отрицание
      - проекция
      - проективная идентификация
      - вытеснение
      - примитивные защиты
    exclusions:
      - адаптивное совладание без защитного качества
    area_neighbors: [3, 4, 6, 10, 11]

  - area_id: A4
    area_index: 3
    name: Aggression
    name_ru: Агрессия
    description: |
      Агрессия как влечение и как компонент конфликта; деструктивность, ненависть, садизм.
    clinical_scope: |
      Проявления агрессии, связь с нарциссизмом и перверсиями; деструктивные объектные отношения.
    activation_signals:
      - агрессия
      - деструктивность
      - ненависть
      - садизм
      - ярость
      - зависть (агрессивная)
    exclusions:
      - ассертивное поведение без агрессивного намерения
    area_neighbors: [2, 4, 6, 8, 9]

  - area_id: A5
    area_index: 4
    name: Perversions
    name_ru: Перверсии
    description: |
      Перверзная организация; слияние агрессии и либидо, нарушение границ, сексуализация агрессии.
    clinical_scope: |
      Перверзные сценарии, триангуляция, манипуляция; связь с нарциссической и пограничной организацией.
    activation_signals:
      - перверсия
      - перверзный
      - триангуляция
      - сексуализированная агрессия
      - нарушение границ
    exclusions:
      - нормативная сексуальность
      - неперверзный фетиш (клиническое различие)
    area_neighbors: [2, 3, 5, 9, 11]  # bipolar peer of A11 via index+6 tension (not edge)

  - area_id: A6
    area_index: 5
    name: Narcissism
    name_ru: Нарциссизм
    description: |
      Нарциссическая организация; грандиозность, идеализация/обесценивание, нарциссическая ярость.
    clinical_scope: |
      Уровень нарциссизма (нормальный — патологический); связь с пограничной организацией и идентичностью.
    activation_signals:
      - нарциссизм
      - грандиозность
      - идеализация
      - обесценивание
      - нарциссическая ярость
      - регуляция самооценки
    exclusions:
      - здоровая самооценка
    area_neighbors: [0, 1, 4, 9, 11]  # bipolar peer of A12 via index+6 tension (edge A6↔A12)

  - area_id: A7
    area_index: 6
    name: Love / Relational Capacity
    name_ru: Любовь / реляционная способность
    description: |
      Способность к любви и стабильным объектным связям; интеграция хорошего и плохого объекта.
    clinical_scope: |
      Зрелая любовь, способность к зависимости и близости; контраст с примитивными связями.
    activation_signals:
      - любовь
      - привязанность
      - близость
      - зависимость
      - зрелые объектные отношения
    exclusions:
      - только поверхностная социальная связь
    area_neighbors: [2, 3, 7, 8, 10]

  - area_id: A8
    area_index: 7
    name: Structural Diagnosis
    name_ru: Структурный диагноз
    description: |
      Уровень организации личности (нейротическая — пограничная — психотическая); структурная оценка.
    clinical_scope: |
      Дифференциация по Кернбергу; тестирование реальности, идентичность, примитивные защиты и супер-эго.
    activation_signals:
      - структурный диагноз
      - организация личности
      - пограничный
      - невротический
      - психотический
      - диффузия идентичности
    exclusions:
      - только синдромальный диагноз (DSM) без структуры
    area_neighbors: [0, 1, 6, 8, 10]

  - area_id: A9
    area_index: 8
    name: Therapeutic Technique
    name_ru: Терапевтическая техника
    description: |
      Технические аспекты TFP; интерпретация переноса, нейтральность, анализ контрпереноса.
    clinical_scope: |
      Применение техники TFP в сессии: интерпретации, управление рамкой, работа с переносом/контрпереносом.
    activation_signals:
      - техника
      - интерпретация переноса
      - контрперенос
      - нейтральность
      - технический нейтралитет
      - здесь-и-сейчас
    exclusions:
      - общая психотерапия без рамки TFP
    area_neighbors: [1, 3, 6, 7, 9]

  - area_id: A10
    area_index: 9
    name: Treatment Process
    name_ru: Процесс лечения
    description: |
      Процесс терапии и изменения; фазы лечения, контракт, цели, регрессии и прогресс.
    clinical_scope: |
      Организация лечения (контракт, фазы TFP), процессуальные аспекты, регрессии, интеграция.
    activation_signals:
      - процесс лечения
      - терапевтический контракт
      - фазы лечения
      - регрессия
      - интеграция
    exclusions:
      - фокус на одной сессии без процесса
    area_neighbors: [1, 3, 4, 5, 8]

  # --- Poles (indices 10–11). Locked names 2026-08-21. Core CREATION/DECEIT UI out. ---
  - area_id: A11
    area_index: 10
    name: Integration / Sublimation
    name_ru: Интеграция / сублимация
    description: |
      Генеративная связка: целостный объект, сублимированные решения влечений,
      конструктивный синтез в поле сессии. Биполяр к A5 (Перверсии).
    clinical_scope: |
      Маркеры интеграции/сублимации vs перверзного слияния; отличие от «интеграция»
      как процессуального ярлыка A10. Семейства/маркеры — TFP-POLES-05.
    activation_signals:
      - интеграция
      - сублимация
      - целостный объект
      - конструктивный синтез
      - зрелая связка
    exclusions:
      - перверзное слияние (→ A5)
      - только процессуальный ярлык «интеграция» без объектной связки (→ A10)
      - core CREATION как UI-ярлык TFP
    area_neighbors: [0, 2, 6, 7, 11]  # hop-1: A1,A3,A7,A8,A12

  - area_id: A12
    area_index: 11
    name: Mutual recognition / Anti-grandiosity
    name_ru: Взаимное признание / анти-грандиозность
    description: |
      Способность видеть другого без всемогущества; нужда/зависимость без коллапса
      в только-A7 «любовь». Биполяр к A6 (Нарциссизм).
    clinical_scope: |
      Маркеры взаимного признания и анти-грандиозности vs грандиозности A6;
      отличие от A7-only реляционной способности. Семейства/маркеры — TFP-POLES-05.
    activation_signals:
      - взаимное признание
      - анти-грандиозность
      - признание другого
      - нужда без всемогущества
      - зависимость без коллапса
    exclusions:
      - грандиозность / обесценивание как ось A6
      - только «любовь» без признания другого (→ A7)
      - core DECEIT как UI-ярлык TFP
    area_neighbors: [0, 2, 4, 5, 10]  # hop-1: A1,A3,A5,A6,A11

# T1.3 — Area distance (shortest path, full icosahedron 0–11). Diameter = 3.
# Source: assets/topology/area_adjacency_matrix.json · TFP-POLES-02 draft 2026-08-21.
area_distance_matrix:
  #     A1  A2  A3  A4  A5  A6  A7  A8  A9  A10 A11 A12
  - [ 0,  1,  2,  3,  2,  1,  2,  1,  2,  2,  1,  1 ]  # A1
  - [ 1,  0,  3,  2,  2,  1,  2,  1,  1,  1,  2,  2 ]  # A2
  - [ 2,  3,  0,  1,  1,  2,  1,  2,  2,  2,  1,  1 ]  # A3
  - [ 3,  2,  1,  0,  1,  2,  1,  2,  1,  1,  2,  2 ]  # A4
  - [ 2,  2,  1,  1,  0,  1,  2,  3,  2,  1,  2,  1 ]  # A5
  - [ 1,  1,  2,  2,  1,  0,  3,  2,  2,  1,  2,  1 ]  # A6
  - [ 2,  2,  1,  1,  2,  3,  0,  1,  1,  2,  1,  2 ]  # A7
  - [ 1,  1,  2,  2,  3,  2,  1,  0,  1,  2,  1,  2 ]  # A8
  - [ 2,  1,  2,  1,  2,  2,  1,  1,  0,  1,  2,  3 ]  # A9
  - [ 2,  1,  2,  1,  1,  1,  2,  2,  1,  0,  3,  2 ]  # A10
  - [ 1,  2,  1,  2,  2,  2,  1,  1,  2,  3,  0,  1 ]  # A11
  - [ 1,  2,  1,  2,  1,  1,  2,  2,  3,  2,  1,  0 ]  # A12
