# LEVEL 4 — Схема лексических маркеров Dict-A
# Цепочка: текст сессии → маркеры → концепты (Dict-B) → активация семьи/области
# Язык маркеров: ru (основной), позже en. Copyright © 2026 igareosh.com.

version: 1
domain: TFP_KERNBERG
language: ru
description: |
  Dict-A задаёт отображение лексических единиц (слов, устойчивых выражений) на узлы графа концептов Dict-B.
  Совпадение токена текста с маркером активирует соответствующий концепт; по концепту определяется семья и область.
  Структура позволяет добавлять en-маркеры без изменения схемы (поле language).

# -----------------------------------------------------------------------------
# Запись маркера (lexical_markers.yaml)
# -----------------------------------------------------------------------------
marker_entry:
  required:
    - marker
    - concept_id
  properties:
    marker:
      type: string
      description: Лексема или поверхностная форма (нормализованная для сопоставления с токенами).
    concept_id:
      type: string
      pattern: "^B_A[0-9]+_F[0-9]+_[0-9]{3}$"
      description: Id концепта Dict-B, активируемого при совпадении маркера.
    language:
      type: string
      enum: [ru, en]
      default: ru
      description: Язык маркера; позволяет иметь ru- и en-маркеры для одного концепта.
    weight:
      type: number
      minimum: 0
      maximum: 1
      default: 1.0
      description: Вес активации (опционально); для взвешивания при множественных совпадениях.
    confidence_type:
      type: string
      enum: [strong, weak]
      default: strong
      description: |
        Множитель при сборке индекса: strong=1.0, weak=0.3 (см. loader.CONFIDENCE_TYPE_MULTIPLIER).
        Слабые контекстные фразы не должны давать тот же вклад, что явная семантика.

# -----------------------------------------------------------------------------
# Ограничения и целевые объёмы
# -----------------------------------------------------------------------------
constraints:
  - Каждый концепт пилота (A2, A3, A4, A10) должен иметь 5–10 маркеров.
  - Один маркер может соответствовать нескольким концептам (многозначность).
  - Маркеры нормализуются к нижнему регистру при загрузке для сопоставления с токенами.
  - Пилот: ~120 концептов × 5–10 маркеров ≈ 800–1000 записей.

# Связь с Dict-B
# concept_id ссылается на hesperia/ontology/dictB/concept_nodes.yaml (поле id узла).
