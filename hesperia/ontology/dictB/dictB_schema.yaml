# LEVEL 3 — Схема графа концептов Dict-B
# Семантический граф: ОБЛАСТИ → СЕМЬИ → КОНЦЕПТЫ
# Теория Кернберга TFP; текст сессии → активация графа.
# Язык: русский. Copyright © 2026 igareosh.com.

version: 1
domain: TFP_KERNBERG
language: ru
description: |
  Dict-B связывает области, семьи и узлы-концепты. Концепты — клинические семантические
  единицы для отображения текста сессии на активацию графа. Каждый узел принадлежит
  одной области и одной семье; связи между концептами задаются в concept_relations.

# -----------------------------------------------------------------------------
# Схема узла концепта (concept_nodes.yaml)
# -----------------------------------------------------------------------------
concept_node:
  required:
    - id
    - label
    - area
    - family
    - definition
    - clinical_observability
    - example_context
    - linked_concepts
  properties:
    id:
      type: string
      pattern: "^B_A[0-9]+_F[0-9]+_[0-9]{3}$"
      description: Уникальный детерминированный id; напр. B_A3_F6_001 (область A3, семья F6, концепт 001).
    label:
      type: string
      description: Краткая метка на русском (транслит snake_case); напр. indutsirovannaya_vina.
    area:
      type: string
      enum: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
      description: Идентификатор области (LEVEL 1).
    family:
      type: string
      pattern: "^F[0-9]+$"
      description: Локальный индекс семьи в области (F1..F24); соответствует family_XXX в реестре.
    definition:
      type: string
      description: Клиническое определение концепта (на русском).
    clinical_observability:
      type: string
      enum: [высокий, умеренный, латентный]
      description: |
        высокий = непосредственно обнаруживаем в тексте;
        умеренный = выводится из контекста;
        латентный = подлежащая структура, выводится по паттернам.
    example_context:
      type: string
      description: Пример клинического/сессионного контекста, в котором проявляется концепт (на русском).
    linked_concepts:
      type: array
      items: { type: string, pattern: "^B_A[0-9]+_F[0-9]+_[0-9]{3}$" }
      description: Список id концептов, связанных с данным (расширяется через concept_relations).

# -----------------------------------------------------------------------------
# Схема связи концептов (concept_relations.yaml)
# -----------------------------------------------------------------------------
concept_relation:
  required:
    - source
    - relation
    - target
  properties:
    source:
      type: string
      pattern: "^B_A[0-9]+_F[0-9]+_[0-9]{3}$"
      description: id концепта-источника.
    relation:
      type: string
      enum:
        - is_a
        - part_of
        - activates
        - opposes
        - co_occurs_with
        - defends_against
        - expresses
        - observed_in
      description: Тип психодинамической связи (операционный ключ).
    target:
      type: string
      pattern: "^B_A[0-9]+_F[0-9]+_[0-9]{3}$"
      description: id концепта-цели.

# -----------------------------------------------------------------------------
# Ограничения
# -----------------------------------------------------------------------------
constraints:
  - У каждого концепта: 1 область, 1 семья, ≥1 связи (как источник или цель).
  - Межобластные связи поощряются для семантического обхода.
  - Концептов на семью: 5–8 (пилот — 5 на семью, ~120 узлов).
  - Id детерминированы: B_{область}_{семья_локально}_{индекс_концепта}.
