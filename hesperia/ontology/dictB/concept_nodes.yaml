  definition: На новом этапе боязни своих сексуальных импульсов стало ясно, что его гомосексуальные чувства включали в себя
    также гетеросексуальные импульсы, которые были неприемлемы для его матери, и сексуальные чувства, перемещенные с нее на
    отца, что, в свою очередь, необходимо было отвергнуть, так как фантазийным последствием того, чтобы стать гомосексуалистом,
    означало быть кастрированным.
  clinical_observability: умеренный
  example_context: При обсуждения садистические импульсы пациент описывает переживания.
- id: B_A4_F8_001
  label: Унижение объекта
  area: A4
  family: F8
  definition: В основе моей работы лежит убеждение, что патология личности определяется теми психическими структурами, которые
    возникают под влиянием аффективного опыта взаимодействия с ранними значимыми объектами.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A4_F8_002
  label: Унижение
  area: A4
  family: F8
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Пациент, который относится ко всем другим людям как к “объектам”, обычно боится, что отказ от такой защитной
    дистанции с терапевтом будет угрожать его безопасности.
- id: B_A4_F8_003
  label: Унижение объекта — аспект 2
  area: A4
  family: F8
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A4_F8_004
  label: Унижение объекта — аспект 3
  area: A4
  family: F8
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: При таких обстоятельствах нормальная смена объекта с матери на отца бессознательно искажена и ее отношения
    с мужчинами превращаются в садомазохистские.
- id: B_A4_F8_005
  label: Унижение объекта — аспект 4
  area: A4
  family: F8
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Терапевт или еще какая-то идеализированная фигура может восприниматься как союзник в борьбе против равно
    всемогущего и (столь же фантастического) “абсолютно плохого” объекта.
- id: B_A4_F8_006
  label: Унижение объекта — аспект 5
  area: A4
  family: F8
  definition: Аффекты, таким образом, можно рассматривать как сложные психические структуры, имеющие нерасторжимую связь с
    когнитивной оценкой текущей ситуации, которую делает индивид, и содержащие позитивную или негативную валентность отношений
    субъекта и объекта в конкретном переживании.
  clinical_observability: умеренный
  example_context: Пациент путает перенос и реальность и не может отличить терапевта от объекта переноса.
- id: B_A4_F9_001
  label: Фантазии разрушения
  area: A4
  family: F9
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A4_F9_002
  label: Фантазии
  area: A4
  family: F9
  definition: Источники фантазии и экстремальные (пиковые) аффективные состояния Если в переносе происходит активация интенсивных
    аффективных состояний, то при этом вспоминаются соответствующие удовлетворяющие или фрустрирующие объектные отношения
    из прошлого, сопровождающиеся попытками их реактивации, если они были удовлетворяющими, или их избегания, если они были
    болезненными.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A4_F9_003
  label: Фантазии разрушения — аспект 2
  area: A4
  family: F9
  definition: Структура фантазии отражает, таким образом, одновременное существоание прошлого, настоящего и будущего, что
    характерно для Ид, предваряя осознание и признание объективных ограничений пространства-времени, характерных для дифференцированного
    Эго (Jaques, 1982).
  clinical_observability: умеренный
  example_context: Когда в поддерживающей терапии пациент предлагает терапевту примитивный материал регрессивной фантазии,
    терапевт не игнорирует это сообщение, но привязывает его к реальности.
- id: B_A4_F9_004
  label: Фантазии разрушения — аспект 3
  area: A4
  family: F9
  definition: От первичной интеграции примитивной аффективной памяти, связывающей “полностью хорошие” или “полностью плохие”
    пиковые аффективные состояния, ведут свое развитие специфические фантазии исполнения желаний, связывающие “Я” и объект,
    которые характерны для бессознательной фантазии.
  clinical_observability: умеренный
  example_context: При этом пациент гибко переходит от эмоций к интеллектуальному пониманию, от фантазии к реальности, от
    переноса к своей внешней жизни и так далее.
- id: B_A4_F9_005
  label: Фантазии разрушения — аспект 4
  area: A4
  family: F9
  definition: Аналогичным образом, преобразование болезненного опыта в символический образ недифференцированного “плохого
    Я — плохой матери” с очевидностью содержит в себе элемент фантазии, выходящей за рамки реалистического характера “хороших”
    Я- и объект-репрезентаций.
  clinical_observability: умеренный
  example_context: После обсуждения фантазии разрушения пациент описывает переживания.
- id: B_A4_F9_006
  label: Фантазии разрушения — аспект 5
  area: A4
  family: F9
  definition: Однако в клинической ситуации анализ реакций ярости — так же как и других интенсивных аффективных состояний
    — всегда открывает лежащие за ними сознательные и бессознательные фантазии, включающие специфические отношения между аспектом
    “Я” и аспектом значимого другого.
  clinical_observability: умеренный
  example_context: При обсуждения фантазии разрушения пациент описывает переживания.
- id: B_A4_F10_001
  label: Агрессивная конкуренция
  area: A4
  family: F10
  definition: Конкуренция с мужчинами содержит в себе скрытые страхи и конфликты, связанные с сознательно или бессознательно
    ощущаемой униженностью по сравнению с ними.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с агрессивная конкуренция.
- id: B_A4_F10_002
  label: Агрессивная
  area: A4
  family: F10
  definition: Агрессивная реакция ребенка на фрустрацию во время орального периода и борьба за власть, характерная для анального
    периода, могут связаться в агрессивных аффективных состояниях, составляющих агрессивное влечение.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления агрессивная конкуренция.
- id: B_A4_F10_003
  label: Агрессивная конкуренция — аспект 2
  area: A4
  family: F10
  definition: Ее первый сексуальный контакт произошел с мужчиной, которого она знала всего одну ночь; его агрессивная и даже
    потенциально угрожающая манера поведения оказала на нее мощное соблазняющее воздействие.
  clinical_observability: умеренный
  example_context: Когда обсуждения агрессивная конкуренция пациент описывает переживания.
- id: B_A4_F10_004
  label: Агрессивная конкуренция — аспект 3
  area: A4
  family: F10
  definition: Парадоксальным образом феминизм может способствовать сексуальному промискуитету женщин с нарциссической патологией,
    которые идентифицируются с мужской сексуальностью, воспринимаемой как агрессивная.
  clinical_observability: умеренный
  example_context: В ходе обсуждения агрессивная конкуренция пациент описывает переживания.
- id: B_A4_F10_005
  label: Агрессивная конкуренция — аспект 4
  area: A4
  family: F10
  definition: Если один из партнеров достигает необычайного успеха или терпит чрезмерную неудачу, бессознательная конкуренция
    между ними может привести к краху отношений.
  clinical_observability: умеренный
  example_context: После обсуждения агрессивная конкуренция пациент описывает переживания.
- id: B_A4_F10_006
  label: Агрессивная конкуренция — аспект 5
  area: A4
  family: F10
  definition: 'Исходная эдипова конкуренция за мать между сыном и отцом здесь как бы перевернута: мужчина — обольстительно
    ребячливый сын, предмет конкуренции двух женщин.'
  clinical_observability: умеренный
  example_context: При обсуждения агрессивная конкуренция пациент описывает переживания.
- id: B_A4_F11_001
  label: Доминирующая агрессия
  area: A4
  family: F11
  definition: Кернберг АГРЕССИЯ ПРИ РАССТРОЙСТВАХ ЛИЧНОСТИ И ПЕРВЕРСИЯХ Перевод с английского и научная редакция А.Ф.
  clinical_observability: умеренный
  example_context: Когда же примитивная агрессия непосредственно пропитывает патологическое грандиозное Я, возникают особенно
    тяжелые формы патологии, которые называют злокачественным нарциссизмом (см.
- id: B_A4_F11_002
  label: Доминирующая
  area: A4
  family: F11
  definition: К 74 Агрессия при расстройствах личности и перверсиях/Пер.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления доминирующая агрессия.
- id: B_A4_F11_003
  label: Доминирующая агрессия — аспект 2
  area: A4
  family: F11
  definition: Либидо и агрессия, в свою очередь, становятся иерархически высшими мотивационными системами, выражающими себя
    множеством дифференцированных аффективных предрасположенностей в различных ситуациях.
  clinical_observability: умеренный
  example_context: Когда обсуждения доминирующая агрессия пациент описывает переживания.
- id: B_A4_F11_004
  label: Доминирующая агрессия — аспект 3
  area: A4
  family: F11
  definition: Это создает психоструктурные условия для пограничной организации личности, характерной для тяжелых расстройств
    личности, при которых преобладает преэдипова и эдипова агрессия.
  clinical_observability: умеренный
  example_context: В ходе обсуждения доминирующая агрессия пациент описывает переживания.
- id: B_A4_F11_005
  label: Доминирующая агрессия — аспект 4
  area: A4
  family: F11
  definition: Для этого необходимо, чтобы терапевт был способен эмпатически почувствовать то удовольствие, которое подразумевает
    агрессия пациента.
  clinical_observability: умеренный
  example_context: После обсуждения доминирующая агрессия пациент описывает переживания.
- id: B_A4_F11_006
  label: Доминирующая агрессия — аспект 5
  area: A4
  family: F11
  definition: Еще раз хочу подчеркнуть, что наиболее нежелательными пациентами являются те, у кого интенсивная агрессия сочетается
    с глубокой психопатологией функционирования Супер-Эго, так что внутренние ограничители против опасного отыгрывания агрессии
    теряются, и терапевт может реально опасаться, что освободившиеся разрушительные силы могут превзойти возможности лечения,
    направленного на их удержание.
  clinical_observability: умеренный
  example_context: При обсуждения доминирующая агрессия пациент описывает переживания.
