  clinical_observability: умеренный
  example_context: В ходе обсуждения импульсивная разрядка пациент описывает переживания.
- id: B_A1_F15_005
  label: Импульсивная разрядка — аспект 4
  area: A1
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Импульсивная разрядка» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: После обсуждения импульсивная разрядка пациент описывает переживания.
