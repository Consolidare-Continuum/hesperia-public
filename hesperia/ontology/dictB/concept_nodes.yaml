    технической нейтральности.
- id: B_A5_F5_006
  label: Фетишистские структуры — аспект 5
  area: A5
  family: F5
  definition: Утверждения Пиаже, что “не существует аффективных состояний, не включающих в себя когнитивных элементов, так
    же как и не существует поведения, которое было бы полностью когнитивным” и что “аффективность играет роль источника энергии,
