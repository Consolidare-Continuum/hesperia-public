    нарушение границ, в смысле соединения интрапсихических структур, которые отделены границами, установленными динамически
    или путем конфликтов.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления управление границами.
- id: B_A9_F12_003
  label: Управление границами — аспект 2
  area: A9
  family: F12
  definition: Наиболее серьезными границами, нарушающимися в сексуальной страсти, являются границы Я.
  clinical_observability: умеренный
  example_context: Когда обсуждения управление границами пациент описывает переживания.
- id: B_A9_F12_004
  label: Управление границами — аспект 3
  area: A9
  family: F12
  definition: Вопрос в том, какого рода Я инвестируется — способность интегрировать любовь и ненависть “под управлением любви”
    или патологическое грандиозное Я.
  clinical_observability: умеренный
  example_context: В ходе обсуждения управление границами пациент описывает переживания.
- id: B_A9_F12_005
  label: Управление границами — аспект 4
  area: A9
  family: F12
  definition: 'Эта точка зрения теоретически соответствует критериям, выдвинутым Спитцером в предисловии к DSM-III: “Каждый
    вид психического нарушения не является отдельной сферой с резко очерченными границами (прерывистость), отделяющими его
    от других психических нарушений или же от состояния, свободного от психических нарушений...'
  clinical_observability: умеренный
  example_context: После обсуждения управление границами пациент описывает переживания.
- id: B_A9_F12_006
  label: Управление границами — аспект 5
  area: A9
  family: F12
  definition: Если на лидеров терапевтических сообществ и на персонал влияют не технические соображения, а идеологические
    убеждения в ценности демократической политической организации, сообщество превращается в политическую партию меньшинства
    в государстве с авторитарным управлением.
  clinical_observability: умеренный
  example_context: При обсуждения управление границами пациент описывает переживания.
- id: B_A9_F13_001
  label: Использование контрпереноса
  area: A9
  family: F13
  definition: В этом контексте мое внимание сосредоточено на специфических искажениях переноса и контрпереноса, вызванных
    структурированной агрессией в форме хронической ненависти и защитами против этой ненависти.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A9_F13_002
  label: Использование
  area: A9
  family: F13
  definition: И действительно, когда, говоря с клинической точки зрения, мы указываем на защитное использование одного влечения
    против другого, мы на самом деле говорим о защитной функции одного аффекта по отношению к другому.
  clinical_observability: умеренный
  example_context: Пациент, стремящийся понять, “как аналитик это сделал”, приписывает ему интеллектуализацию или говорит,
    что тот пользуется такой-то теорией, или что это реакция контрпереноса.
- id: B_A9_F13_003
  label: Использование контрпереноса — аспект 2
  area: A9
  family: F13
  definition: 'Тесная связь между эротическим мазохизмом и агрессией как в садомазохистских фантазиях, так и в поведении,
    и ключевая функция агрессии в определении тяжести мазохизма указывают на базовую динамику инстинктивных конфликтов на
    всех уровнях психопатологии: взаимодействие и использование либидинальных и агрессивных импульсов.'
  clinical_observability: умеренный
  example_context: Когда обсуждения использование контрпереноса пациент описывает переживания.
- id: B_A9_F13_004
  label: Использование контрпереноса — аспект 3
  area: A9
  family: F13
  definition: Использование промискуитета в качестве критерия опять смещает диагностический фокус на поведение, вместо сосредоточения
    его на том, что определяет это поведение.
  clinical_observability: умеренный
  example_context: В ходе обсуждения использование контрпереноса пациент описывает переживания.
- id: B_A9_F13_005
  label: Использование контрпереноса — аспект 4
  area: A9
  family: F13
  definition: Эта диспозиция, или аффективное состояние, не обязательно является сознательной и может быть выведена из свободных
    ассоциаций пациента, его невербального поведения и общей атмосферы, создаваемой смесью переноса пациента и контрпереноса
    аналитика.
  clinical_observability: умеренный
  example_context: После обсуждения использование контрпереноса пациент описывает переживания.
- id: B_A9_F13_006
  label: Использование контрпереноса — аспект 5
  area: A9
  family: F13
  definition: Процесс регрессии изменяет природу объектных отношений с “реалистических” на контролируемые доминирующей констелляцией
    переноса- контрпереноса, в рамках которой заключены защитные и импульсные аспекты бессознательных конфликтов пациента.
  clinical_observability: умеренный
  example_context: При обсуждения использование контрпереноса пациент описывает переживания.
- id: B_A9_F14_001
  label: Контейнирование аффекта
  area: A9
  family: F14
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A9_F14_002
  label: Контейнирование
  area: A9
  family: F14
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A9_F14_003
  label: Контейнирование аффекта — аспект 2
  area: A9
  family: F14
  definition: Фрейд понимал влечение как переход между физическим и психическим, как психический процесс, укорененный в биологии;
    он предполагал (Freud, 1915b, 1915c), что единственный способ, с помощью которого мы можем узнать о влечениях, это обращение
    к их психическим реперезентациям — идеям и аффектам.
  clinical_observability: умеренный
  example_context: Когда обсуждения контейнирование аффекта пациент описывает переживания.
- id: B_A9_F14_004
  label: Контейнирование аффекта — аспект 3
  area: A9
  family: F14
  definition: 3Рапапорт (Rapaport, 1953) описывает, как с течением времени у Фрейда менялось представление об аффектах.
  clinical_observability: умеренный
  example_context: В ходе обсуждения контейнирование аффекта пациент описывает переживания.
- id: B_A9_F14_005
  label: Контейнирование аффекта — аспект 4
  area: A9
  family: F14
  definition: Аффекты и влечения В первой теории аффектов Фрейда понятия аффекта и влечения были практически взаимозаменимы.
  clinical_observability: умеренный
  example_context: После обсуждения контейнирование аффекта пациент описывает переживания.
- id: B_A9_F14_006
  label: Контейнирование аффекта — аспект 5
  area: A9
  family: F14
  definition: Аффекты, постулировал Фрейд, являются процессами разрядки, которые могут достигать сознания, но не подвержены
    вытеснению; только психические реперезентации влечений вытесняются вместе с памятью о чем-либо или склонностью к возникновению
    соответствующего аффекта (Freud, 1915b,1915c).
  clinical_observability: умеренный
  example_context: При обсуждения контейнирование аффекта пациент описывает переживания.
- id: B_A9_F15_001
  label: Темп интервенций
  area: A9
  family: F15
  definition: Очевидно, что обнаружение пациентов, которые лгут терапевту, не признаваясь во лжи (многие антисоциальные личности
    могут признаваться, что лгут, и продолжать это делать), требует сбора информации у родственников, сложных интервенций
    в области социальной работы и отчетов тех учреждений, с которыми связана жизнь пациента.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с темп интервенций.
- id: B_A9_F15_002
  label: Темп
  area: A9
  family: F15
  definition: Чувствуя нетерпение по поводу медленного темпа психоаналитического лечения, он подозревал, что мой интерес к
    нему корыстен, так же как и мотивы женщин, которых он встречал в жизни.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления темп интервенций.
- id: B_A9_F15_003
  label: Темп интервенций — аспект 2
  area: A9
  family: F15
  definition: Определение психических структур как процессов с медленным темпом изменения, данное Раппапортом (Rappaport,
    1960), по-видимому, ведет к концепции структурных изменений, включающих проявления изменений в паттернах поведения.
  clinical_observability: умеренный
  example_context: Когда обсуждения темп интервенций пациент описывает переживания.
- id: B_A9_F15_004
  label: Темп интервенций — аспект 3
  area: A9
  family: F15
  definition: Тогда аналитик чувствует, что вынужден изменить темп работы, резко сфокусироваться на текущих взаимоотношениях
    в переносе, будучи вынужден признать, что сигналы к этому исходят преимущественно из контртрансферентных фантазий и аффектов,
    а не из видимого содержания вербального и невербального поведения пациента.
  clinical_observability: умеренный
  example_context: В ходе обсуждения темп интервенций пациент описывает переживания.
- id: B_A9_F15_005
  label: Темп интервенций — аспект 4
  area: A9
  family: F15
  definition: также главы 1 и 2) занимают промежуточную позицию, считая термин “пограничная личностная организация” психоструктурным
    диагнозом, в котором сходятся генетическая предрасположенность, психодинамическая предрасположенность и предрасположенность
    темперамента.
  clinical_observability: умеренный
  example_context: После обсуждения темп интервенций пациент описывает переживания.
- id: B_A9_F15_006
  label: Темп интервенций — аспект 5
  area: A9
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Темп интервенций» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения темп интервенций пациент описывает переживания.
- id: B_A9_F16_001
  label: Последовательность интерпретаций
  area: A9
  family: F16
  definition: 3 я указываю на важность постоянных и глубоких интерпретаций фантазий, имеющих место при активации ярости в
    переносе, особенно на важность интерпретации вторичных защит против признания приятных аспектов ярости.
  clinical_observability: умеренный
  example_context: Пациент снова стал демонстрировать “пассивное сопротивление”, отказываясь от свободных ассоциаций или от
    выслушивания интерпретаций.
- id: B_A9_F16_002
  label: Последовательность
  area: A9
  family: F16
  definition: Важно интерпретировать параноидные реакции пациента как часть интерпретаций антисоциального переноса в целом.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления последовательность интерпретаций.
- id: B_A9_F16_003
  label: Последовательность интерпретаций — аспект 2
  area: A9
  family: F16
  definition: Другими словами, “психотическое ядро” переноса идентифицируется, ограничивается и терпится до того, как будет
    предпринята какая-либо попытка разрешить его посредством интерпретаций.
  clinical_observability: умеренный
  example_context: Когда обсуждения последовательность интерпретаций пациент описывает переживания.
- id: B_A9_F16_004
  label: Последовательность интерпретаций — аспект 3
  area: A9
  family: F16
  definition: Оральные регрессии этих пациентов являются временными и защитными по своему характеру и могут быть разрешены
    с помощью интерпретаций, приводя к центральным для них эдиповым конфликтам.
  clinical_observability: умеренный
  example_context: В ходе обсуждения последовательность интерпретаций пациент описывает переживания.
- id: B_A9_F16_005
  label: Последовательность интерпретаций — аспект 4
  area: A9
  family: F16
  definition: Аффективная доминанта сдвигается с другой темы на сам перенос, и это требует от аналитика фокусировки своих
    интерпретаций на переносе, перед тем как переходить к другой теме.
  clinical_observability: умеренный
  example_context: После обсуждения последовательность интерпретаций пациент описывает переживания.
- id: B_A9_F16_006
  label: Последовательность интерпретаций — аспект 5
  area: A9
  family: F16
  definition: Опасность, конечно же, состоит в искушении отыгрывать эту комплементарную идентификацию, а не использовать ее
    в качестве материала, подлежащего включению в процесс интерпретаций.
  clinical_observability: умеренный
  example_context: При обсуждения последовательность интерпретаций пациент описывает переживания.
- id: B_A9_F17_001
  label: Управление фокусом сессии
  area: A9
  family: F17
  definition: Экономическим критерием материала, подлежащего интерпретации в рамках каждой психоаналитической сессии или каждого
    сегмента сессии, является связь материала с доминирующей аффективной диспозицией пациента.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с управление фокусом сессии.
- id: B_A9_F17_002
  label: Управление
  area: A9
  family: F17
  definition: На практике мой подход требует в начале каждой сессии воздерживаться от интервенции до тех пор, пока вербальные
    коммуникации пациента и его невербальное поведение, общая эмоциональная атмосфера и мой контрперенос не наведут меня на
    доминирующую аффективную тему.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления управление фокусом сессии.
- id: B_A9_F17_003
  label: Управление фокусом
  area: A9
  family: F17
  definition: Существуют, конечно, случаи, когда аналитик ощущает сильное внутреннее давление для интерпретативного вмешательства
    на основе того, что случилось на предыдущей сессии, или в качестве реакции на вопрос, который, как кажется, является неотложным
    для пациента, или следуя информации из внешних источников.
  clinical_observability: умеренный
  example_context: Когда обсуждения управление фокусом сессии пациент описывает переживания.
- id: B_A9_F17_004
  label: Управление фокусом сессии — аспект 3
  area: A9
  family: F17
  definition: Настойчивость аналитика во внутреннем исследовании этого давления, так же как и новая информация, предоставляемая
    пациентом на этой сессии, позволяют постепенно отсортировать то, что в данный момент является аффективно доминирующим.
  clinical_observability: умеренный
  example_context: В ходе обсуждения управление фокусом сессии пациент описывает переживания.
- id: B_A9_F17_005
  label: Управление фокусом сессии — аспект 4
  area: A9
  family: F17
  definition: Я-репрезентации пациента также становятся более сложными, включая в Я-концепцию аспекты саморефлексии, которые
    были фокусом внимания аналитика и воспринимаются пациентом путем идентификации с ним.
  clinical_observability: умеренный
  example_context: После обсуждения управление фокусом сессии пациент описывает переживания.
- id: B_A9_F17_006
  label: Управление фокусом сессии — аспект 5
  area: A9
  family: F17
  definition: Самонаблюдение является всегда ключевым фокусом интерпретативной работы при пограничной организации личности,
    при которой защитная диссоциация “Я” представляет главное текущее сопротивление.
  clinical_observability: умеренный
  example_context: При обсуждения управление фокусом сессии пациент описывает переживания.
- id: B_A9_F18_001
  label: Репарация альянса
  area: A9
  family: F18
  definition: Или терапевт может войти в союз с процессами расщепления пациента, облегчая перемещение агрессии куда-то в другое
    место и поощряя создание псевдотерапевтического альянса, обеспечивающего поверхностно дружелюбные отношения в переносе.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с репарация альянса.
- id: B_A9_F18_002
  label: Репарация
  area: A9
  family: F18
  definition: И опять моя комплементарная идентификация в контрпереносе, следствие проективной идентификации пациента, привела
    меня к идентификации с его “врагами” и к моему альянсу с (черной) Кларой и ее сторонниками в противостоянии (белой) главной
    медсестре и ее сторонникам, что в конце концов привело к моему отстранению от лечения в результате альянса доктора Б.,
    главной медсестры и отца пациента.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления репарация альянса.
- id: B_A9_F18_003
  label: Репарация альянса — аспект 2
  area: A9
  family: F18
  definition: Это важное средство для косвенного усиления терапевтического альянса, в то время как 84 непосредственно мы имеем
    дело с характерными для пограничных пациентов примитивными конфликтами вокруг агрессии и невозможности выносить амбивалентность.
  clinical_observability: умеренный
  example_context: Когда обсуждения репарация альянса пациент описывает переживания.
- id: B_A9_F18_004
  label: Репарация альянса — аспект 3
  area: A9
  family: F18
  definition: Другим важным аспектом интерпретации переноса у пограничных пациентов является слабость терапевтического альянса,
    если его сравнивать с альянсом у невротиков в 95 психоанализе.
  clinical_observability: умеренный
  example_context: В ходе обсуждения репарация альянса пациент описывает переживания.
- id: B_A9_F18_005
  label: Репарация альянса — аспект 4
  area: A9
  family: F18
  definition: Если негативный перенос не разрешен, он ставит под угрозу продолжение терапии и создает большую проблему для
    установления рабочего альянса.
  clinical_observability: умеренный
  example_context: После обсуждения репарация альянса пациент описывает переживания.
- id: B_A9_F18_006
  label: Репарация альянса — аспект 5
  area: A9
  family: F18
  definition: Наблюдаемое клиническое проявление, связанное с областью «Репарация альянса» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения репарация альянса пациент описывает переживания.
- id: B_A9_F19_001
  label: Поддержка пациента
  area: A9
  family: F19
  definition: Переход к “классической” психоаналитической технике в работе с такими пациентами возможен, по мнению Кернберга,
    лишь на поздних этапах лечения, когда структура их личности становится преимущественно невротической.
  clinical_observability: умеренный
  example_context: Пациент ненавидит также (поскольку он ей завидует) творческую способность терапевта, выражающуюся в попытках
    понять пациента и передать ему свое понимание.
- id: B_A9_F19_002
  label: Поддержка
  area: A9
  family: F19
  definition: Лишь тогда терапевт может обратиться к анализу невротических, “Эдиповых”, конфликтов пациента и интерпретациям
    там-и- тогда — касающимся текущей жизни пациента и его прошлого — и более твердому соблюдению технической нейтральности.
  clinical_observability: умеренный
  example_context: Терапевт может попытаться избегнуть этого разочарования, эмоционально отстранившись от пациента.
- id: B_A9_F19_003
  label: Поддержка пациента — аспект 2
  area: A9
  family: F19
  definition: 'New Haven: Yale University Press, 1984), позволяющее определить структурную организацию личности пациента —
    преимущественно невротическую, пограничную или психотическую — и соответствующий ей характер психотерапевтического вмешательства.'
  clinical_observability: умеренный
  example_context: Природа путаницы, возникающей у пациента, когда аналитик пытается углубить понимание пациентом представляемого
    им в эти периоды тяжелой регрессии в переносе материала, поднимает другой вопрос.
- id: B_A9_F19_004
  label: Поддержка пациента — аспект 3
  area: A9
  family: F19
  definition: И всегда, когда аффективное состояние пациента подвергается исследованию, обнаруживается его когнитивный аспект,
    обычно отношение “Я” к объекту под воздействием аффективного состояния.
  clinical_observability: умеренный
  example_context: Пациентка, которую я собираюсь описать, удовлетворяет тому, что Майкл Стоун (Stone, 1983) считает позитивными
    критериями для интенсивной психотерапии с психотическими пациентами.
- id: B_A9_F19_005
  label: Поддержка пациента — аспект 4
  area: A9
  family: F19
  definition: Поведение пациента служит также средством коммуникации его субъективного опыта с аналитиком.
  clinical_observability: умеренный
  example_context: Когда эротические желания пациента фокусируются исключительно на аналитике, аспект сопротивления становится
    вполне очевидным, а агрессивный компонент сексуальных побуждений — более выраженным.
- id: B_A9_F19_006
  label: Поддержка пациента — аспект 5
  area: A9
  family: F19
  definition: Важно, что коммуникативные функции аффектов имеют наибольшее значение для переноса и позволяют аналитику эмпатически
    сопереживать и (внутренне) эмоционально откликаться на опыт пациента.
  clinical_observability: умеренный
  example_context: При работе с пациентами с организованной мазохистической перверсией одной из ранних задач терапии является
    анализ защитных аспектов идеализации ими своего сексуального мазохизма.
- id: B_A9_F20_001
  label: Баланс экспрессивности
  area: A9
  family: F20
  definition: Их зависимость от того, как другие люди их оценивают, сбалансирована четким ощущением того, каким социально
    признанным реальным требованиям они должны соответствовать, чтобы получать эту любовь и одобрение, а их детская, льнущая
    зависимость ограничена сексуальным контекстом.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с баланс экспрессивности.
- id: B_A9_F20_002
  label: Баланс
  area: A9
  family: F20
  definition: Стойкие поведенческие изменения могут, в свою очередь, оказать глубокое воздействие на баланс конфликтов индивида
    и, следовательно, на отношения внутри трехчленной структуры и мира интернализованных объектных отношений в целом.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления баланс экспрессивности.
- id: B_A9_F20_003
  label: Баланс экспрессивности — аспект 2
  area: A9
  family: F20
  definition: На практике такие тщательно сбалансированные гомосексуальные отношения трудно поддерживать.
  clinical_observability: умеренный
  example_context: Когда обсуждения баланс экспрессивности пациент описывает переживания.
- id: B_A9_F20_004
  label: Баланс экспрессивности — аспект 3
  area: A9
  family: F20
  definition: Гормональный дисбаланс способен повлечь за собой изменение вторичных половых признаков, что, в свою очередь,
    может привести к гинекомастии (увеличению молочных желез у мужчин) при недостаточном количестве андрогенов; гирсутизму
    (избыточному оволосению у женщин), клиторальной гипертрофии, понижению голоса — при избытке андрогенов.
  clinical_observability: умеренный
  example_context: В ходе обсуждения баланс экспрессивности пациент описывает переживания.
- id: B_A9_F20_005
  label: Баланс экспрессивности — аспект 4
  area: A9
  family: F20
  definition: Изменения в степени власти и авторитета, обусловленые переменами в престиже пары, доходах и других сферах, связанных
    с профессиональной деятельностью и работой, не только влияют на эмоциональный баланс, но, как ни парадоксально, часто
    представляют собой непредвиденные последствия бессознательно детерминированных факторов.
  clinical_observability: умеренный
  example_context: После обсуждения баланс экспрессивности пациент описывает переживания.
- id: B_A9_F20_006
  label: Баланс экспрессивности — аспект 5
  area: A9
  family: F20
  definition: Муж оказался более гибким, но сам факт его терапии создал дисбаланс в отношениях пары, постепенно приведший
    к распаду отношений.
  clinical_observability: умеренный
  example_context: При обсуждения баланс экспрессивности пациент описывает переживания.
- id: B_A9_F21_001
  label: Интервенции кризиса
  area: A9
  family: F21
  definition: На практике мой подход требует в начале каждой сессии воздерживаться от интервенции до тех пор, пока вербальные
    коммуникации пациента и его невербальное поведение, общая эмоциональная атмосфера и мой контрперенос не наведут меня на
    доминирующую аффективную тему.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с интервенции кризиса.
- id: B_A9_F21_002
  label: Интервенции
  area: A9
  family: F21
  definition: 'Диагнозом Лусии при поступлении были: 1) тяжелое расстройство личности преимущественно с нарциссическими и
    пограничными чертами; 2) смешанная наркотическая и алкогольная зависимость; 3) депрессивное расстройство с относительно
    непредсказуемым суицидальным потенциалом, связанное с тяжелыми эмоциональными кризисами.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интервенции кризиса.
- id: B_A9_F21_003
  label: Интервенции кризиса — аспект 2
  area: A9
  family: F21
  definition: Основное структурное условие развития способности к зрелой сексуальной любви — формирование интегрированной
    Эго-идентичности в контексте подросткового кризиса идентичности.
  clinical_observability: умеренный
  example_context: Когда обсуждения интервенции кризиса пациент описывает переживания.
- id: B_A9_F21_004
  label: Интервенции кризиса — аспект 3
  area: A9
  family: F21
  definition: 'Существует связь между кризисом идентичности и Эго-идентичностью: чем стабильней индивидуальная базовая Эго-идентичность,
    тем лучше человек оснащен для преодоления кризиса идентичности; чем жестче требования окружающей среды к установленной
    Эго-идентичности, тем выше опасность срыва для тех, чья структура идентичности имеет дефекты.'
  clinical_observability: умеренный
  example_context: В ходе обсуждения интервенции кризиса пациент описывает переживания.
- id: B_A9_F21_005
  label: Интервенции кризиса — аспект 4
  area: A9
  family: F21
  definition: Подобные данные свидетельствуют, что во время острого кризиса показана кризис-интервенция.
  clinical_observability: умеренный
  example_context: После обсуждения интервенции кризиса пациент описывает переживания.
- id: B_A9_F21_006
  label: Интервенции кризиса — аспект 5
  area: A9
  family: F21
  definition: Во-вторых, подросткам свойственны проявления кризиса идентичности, мгновенное переключение идентификации с одной
    социальной идеологии или группы на другие, так что кажущаяся полная перемена личности может произойти всего за несколько
    месяцев.
  clinical_observability: умеренный
  example_context: При обсуждения интервенции кризиса пациент описывает переживания.
- id: B_A9_F22_001
  label: Управление сессией
  area: A9
  family: F22
  definition: Вопрос в том, какого рода Я инвестируется — способность интегрировать любовь и ненависть “под управлением любви”
    или патологическое грандиозное Я.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с управление сессией.
- id: B_A9_F22_002
  label: Управление
  area: A9
  family: F22
  definition: Если на лидеров терапевтических сообществ и на персонал влияют не технические соображения, а идеологические
    убеждения в ценности демократической политической организации, сообщество превращается в политическую партию меньшинства
    в государстве с авторитарным управлением.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления управление сессией.
- id: B_A9_F22_003
  label: Управление сессией — аспект 2
  area: A9
  family: F22
  definition: Наблюдаемое клиническое проявление, связанное с областью «Управление сессией» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Когда обсуждения управление сессией пациент описывает переживания.
- id: B_A9_F22_004
  label: Управление сессией — аспект 3
  area: A9
  family: F22
  definition: Наблюдаемое клиническое проявление, связанное с областью «Управление сессией» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: В ходе обсуждения управление сессией пациент описывает переживания.
- id: B_A9_F22_005
  label: Управление сессией — аспект 4
  area: A9
  family: F22
  definition: Наблюдаемое клиническое проявление, связанное с областью «Управление сессией» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: После обсуждения управление сессией пациент описывает переживания.
- id: B_A9_F22_006
  label: Управление сессией — аспект 5
  area: A9
  family: F22
  definition: Наблюдаемое клиническое проявление, связанное с областью «Управление сессией» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения управление сессией пациент описывает переживания.
- id: B_A9_F23_001
  label: Самонаблюдение терапевта
  area: A9
  family: F23
  definition: В то же время перенос выглядит удивительно свободным от явной агрессии; хроническая лживость и поиск примитивного
    абсолютного хорошего состояния “Я” при устранении всех объектов — с помощью алкоголя или наркотиков, путем бессознательных
    или сознательных усилий включить терапевта в эксплуатацию или разрушение других — вот что является доминирующим.
  clinical_observability: умеренный
  example_context: Пациент ненавидит также (поскольку он ей завидует) творческую способность терапевта, выражающуюся в попытках
    понять пациента и передать ему свое понимание.
- id: B_A9_F23_002
  label: Самонаблюдение
  area: A9
  family: F23
  definition: Усилие терапевта воспрепятствовать диффузному разрушению или разложению всего ценного может переживаться пациентом
    (посредством проективных механизмов) как грубое нападение, которое ведет к появлению направленной ярости и ненависти в
    переносе; мы становимся свидетелями превращения “психопатического” переноса в “параноидный” (см.
  clinical_observability: умеренный
  example_context: Пациент, проецирующий собственный обман на терапевта, постепенно или внезапно переходит от психопатического
    переноса к параноидному.
- id: B_A9_F23_003
  label: Самонаблюдение терапевта — аспект 2
  area: A9
  family: F23
  definition: Одна из наиболее постоянных особенностей переноса, в котором преобладают действия вовне, выражающие глубинную
    зависть, это необычная зависимость пациента от терапевта, проявляющаяся совместно с агрессией по отношению к терапевту
    — впечатляющая демонстрация “фиксации на травме”.
  clinical_observability: умеренный
  example_context: Пациент начинает осознавать, что его атаки направлены не на плохого, садистского, тираничного или бесчестного
    терапевта, а на хорошего терапевта, который пытается ему помочь.
- id: B_A9_F23_004
  label: Самонаблюдение терапевта — аспект 3
  area: A9
  family: F23
  definition: В то же время фантазии и страхи пациента отражают его представление, что пока он будет нападать на терапевта,
    он будет подвергаться аналогичным атакам ненависти, садистской эксплуатации и преследованиям с его стороны.
  clinical_observability: умеренный
  example_context: Терапевтам, занимающимся терапией подростков, следует противостоять усилиям игнорировать эту сферу как
    несущественную.
- id: B_A9_F23_005
  label: Самонаблюдение терапевта — аспект 4
  area: A9
  family: F23
  definition: Обычно пациент отыгрывает объектные отношения между преследователем и жертвой, чередуя свои идентификации с
    каждой из этих ролей и проецируя дополнительную роль на терапевта.
  clinical_observability: умеренный
  example_context: Пациент может обвинять терапевта в тех самых реакциях, которые сам старается вызвать в нем своим поведением.
- id: B_A9_F23_006
  label: Самонаблюдение терапевта — аспект 5
  area: A9
  family: F23
  definition: В своих предыдущих работах я указывал (1975, 1984), что пациент, особенно нарциссический пациент с антисоциальными
    чертами, больше всего ненавидит то, что он в наибольшей степени надеется получить от терапевта — неизменную преданность
    ему.
  clinical_observability: умеренный
  example_context: Пациентка ненавидела своего терапевта, который “злоупотребляет конфронтацией”.
- id: B_A9_F24_001
  label: Регуляция технической позиции
  area: A9
  family: F24
  definition: Лишь тогда терапевт может обратиться к анализу невротических, “Эдиповых”, конфликтов пациента и интерпретациям
    там-и- тогда — касающимся текущей жизни пациента и его прошлого — и более твердому соблюдению технической нейтральности.
  clinical_observability: умеренный
  example_context: Причины “позитивного” изменения надо исследовать с той же технической нейтральностью, как и причины ухудшения
    поведения.
- id: B_A9_F24_002
  label: Регуляция
  area: A9
  family: F24
  definition: Однако наиболее вероятной является ситуация, когда терапевт, даже опытный, начинает колебаться в своей внутренней
    позиции день ото дня, от сеанса к сеансу, от попыток аналитического разрешения активирующейся ненависти в переносе до
    ее игнорирования и избегания.
  clinical_observability: умеренный
  example_context: Когда необходимы внешние структуры, лечением должна заниматься команда, чтобы терапевт мог сохранять позицию
    технической нейтральности.
- id: B_A9_F24_003
  label: Регуляция технической
  area: A9
  family: F24
  definition: Эти естественные колебания отражают реальное компромиссное образование, позволяющее терапевту отойти в сторону
    и оценить последствия своих различных вмешательств и дающее ему передышку, пока он вновь не вернется к активной интерпретативной
    позиции.
  clinical_observability: умеренный
  example_context: Когда обсуждения регуляция технической позиции пациент описывает переживания.
- id: B_A9_F24_004
  label: Регуляция технической позиции — аспект 3
  area: A9
  family: F24
  definition: Это бессознательное объектное отношение в переносе находится под контролем аффективной диспозиции, которая отличается
    от первоначального “объективного” ощущения безопасности, исходящего из “реальных” объектных отношений, определяемых психоаналитической
    рамкой.
  clinical_observability: умеренный
  example_context: В ходе обсуждения регуляция технической позиции пациент описывает переживания.
- id: B_A9_F24_005
  label: Регуляция технической позиции — аспект 4
  area: A9
  family: F24
  definition: Или, возможно, на фоне определенной привычной трансферентной диспозиции, острый конфликт в жизни пациента активирует
    другое аффективно заряженное объектное отношение, которое может временно доминировать на сеансе.
  clinical_observability: умеренный
  example_context: После обсуждения регуляция технической позиции пациент описывает переживания.
- id: B_A9_F24_006
  label: Регуляция технической позиции — аспект 5
  area: A9
  family: F24
  definition: В конце концов я решил сосредоточиться на природе и симптомах его постоянной недоступности для меня и моей недоступности
    для него, которая проявлялась в его позиции на сеансах.
  clinical_observability: умеренный
  example_context: При обсуждения регуляция технической позиции пациент описывает переживания.
- id: B_A10_F1_001
  label: Терапевтический контракт
  area: A10
  family: F1
  definition: Я должен добавить, что я встречался с его родителями раз в год, вместе с пациентом, чтобы освежить наш базовый
    контракт.
  clinical_observability: умеренный
  example_context: Терапевтический альянс есть связь аналитика с наблюдающей частью Эго пациента (Zetzel, 1956; Greenson,
    1965), какой бы слабой она ни была, в терапевтической ситуации.
- id: B_A10_F1_002
  label: Терапевтический
  area: A10
  family: F1
  definition: На практике, однако, эти психопатические переносы имеют тенденцию пропитывать и разлагать весь психотерапевтический
    процесс и являются главной причиной его пробуксовки и провала.
  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A10_F1_003
  label: Терапевтический контракт — аспект 2
  area: A10
  family: F1
  definition: Реакцией на такой терапевтический подход было углубление дезорганизации поведения мисс Е.; через некоторое время
    появились четкие признаки галлюцинаций и также ипохондрического и параноидного бреда.
  clinical_observability: умеренный
  example_context: Когда обсуждения терапевтический контракт пациент описывает переживания.
- id: B_A10_F1_004
  label: Терапевтический контракт — аспект 3
  area: A10
  family: F1
  definition: Лучше было бы, по моему мнению, не ограничивать шизофрению столь искусственно и на основании клинического исследования
    ставить диагноз даже тем пациентам, у которых нет яркой картины заболевания, и в тех случаях, когда терапевтический подход
    и прогноз должны отличаться от подхода и прогноза при личностных расстройствах.
  clinical_observability: умеренный
  example_context: В ходе обсуждения терапевтический контракт пациент описывает переживания.
- id: B_A10_F1_005
  label: Терапевтический контракт — аспект 4
  area: A10
  family: F1
  definition: Поскольку у Эго невротика наблюдающая часть достаточно выражена, терапевтический альянс (или, можно сказать,
    альянс наблюдающей части Эго пациента и аналитика, направленный на решение задачи) есть данность, обычно не требующая
    слишком большого внимания.
  clinical_observability: умеренный
  example_context: После обсуждения терапевтический контракт пациент описывает переживания.
- id: B_A10_F1_006
  label: Терапевтический контракт — аспект 5
  area: A10
  family: F1
  definition: Поддерживающая терапия может быть очень “всепозволяющей”, поскольку с помощью активной конфронтации она усиливает
    внутреннюю свободу принятия решений пациента; с другой стороны, за кажущейся терпимостью “всепозволяющего” терапевта может
    стоять бессознательный контракт с саморазрушительными тенденциями пациента.
  clinical_observability: умеренный
  example_context: При обсуждения терапевтический контракт пациент описывает переживания.
- id: B_A10_F2_001
  label: Информированное согласие
  area: A10
  family: F2
  definition: С одной стороны, согласие, кажется, существует в том, что чем более тяжелым является расстройство личности пациента
    в рамках истерического спектра, тем более вероятно наличие симптомов, соответствующих “конверсионной истерии”.
  clinical_observability: умеренный
  example_context: Пациент воспринимает понимание и терпимость аналитика как тайное согласие на его антисоциальное поведение.
- id: B_A10_F2_002
  label: Информированное
  area: A10
  family: F2
  definition: Он также обращает внимание на важность генитального опыта как такового, благодаря которому происходит сдвиг
    в сознании, развивается новое объединение, согласие с природой.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления информированное согласие.
- id: B_A10_F2_003
  label: Информированное согласие — аспект 2
  area: A10
  family: F2
  definition: Одной из форм, которую может принимать агрессия, связанная с эдиповыми конфликтами (в клинической практике и
    в обыденной жизни), является бессознательное молчаливое согласие обоих партнеров о поиске реального третьего, представляющего
    собой сгущенный идеал одного и соперника другого.
  clinical_observability: умеренный
  example_context: Когда обсуждения информированное согласие пациент описывает переживания.
- id: B_A10_F2_004
  label: Информированное согласие — аспект 3
  area: A10
  family: F2
  definition: Дело в том, что супружеская неверность — кратковременные и продолжительные отношения любовного треугольника
    — чаще является бессознательным согласием пары, искушаемой воплотить свои наиболее глубокие стремления.
  clinical_observability: умеренный
  example_context: В ходе обсуждения информированное согласие пациент описывает переживания.
- id: B_A10_F2_005
  label: Информированное согласие — аспект 4
  area: A10
  family: F2
  definition: Эти регрессивные тенденции, проецируемые на детей, отражают опасения по поводу реакции детей на то, что они
    исключены из одного из моментов родительской жизни (отношений родителей в спальне), их страх за то, что дети будут идентифицировать
    себя с родителями, а также бессознательное согласие родителей отказаться от полной идентификации с их собственными родителями.
  clinical_observability: умеренный
  example_context: После обсуждения информированное согласие пациент описывает переживания.
- id: B_A10_F2_006
  label: Информированное согласие — аспект 5
  area: A10
  family: F2
  definition: Тогда я решил конфронтировать пациентов со своим полным несогласием с их мнением о моем дурном обращении с ними.
  clinical_observability: умеренный
  example_context: При обсуждения информированное согласие пациент описывает переживания.
- id: B_A10_F3_001
  label: Установление сеттинга
  area: A10
  family: F3
  definition: Защиты выталкивают динамическое бессознательное глубже и глубже в глубины психического аппарата, кульминацией
    этого процесса является установление барьеров вытеснения, которые одновременно выражают взаимное отталкивание и внутреннюю
    консолидацию Ид и Эго.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с установление сеттинга.
- id: B_A10_F3_002
  label: Установление
  area: A10
  family: F3
  definition: Более того, установление границ реальности также восстанавливает внутреннюю свободу аналитика в работе с контртрансферентными
    реакциями.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления установление сеттинга.
- id: B_A10_F3_003
  label: Установление сеттинга — аспект 2
  area: A10
  family: F3
  definition: Комбинация диффузной конвенциональности и сниженного индивидуального чувства ответственности создает условия
    для общего разложения преданности моральным нормам внутри группового сеттинга.
  clinical_observability: умеренный
  example_context: Когда обсуждения установление сеттинга пациент описывает переживания.
- id: B_A10_F3_004
  label: Установление сеттинга — аспект 3
  area: A10
  family: F3
  definition: Первой психотерапевтической задачей при работе с тяжело регрессировшими психотическими пациентами, особенно
    с шизофреническими пациентами, утратившими способность к обычной вербальной коммуникации, требующими оберегающего лечения
    в больничных условиях и обладающими очень слабым пониманием реальности, является установление значимого контакта.
  clinical_observability: умеренный
  example_context: В ходе обсуждения установление сеттинга пациент описывает переживания.
- id: B_A10_F3_005
  label: Установление сеттинга — аспект 4
  area: A10
  family: F3
  definition: Установление ядерной половой идентичности — интегрированной Я-концепции, которая определяет идентификацию индивида
    с тем или иным полом — не может быть рассмотрено отдельно от установления соответствующей интегрированной концепции другого,
    что включает отношение к нему как к желаемому сексуальному объекту.
  clinical_observability: умеренный
  example_context: После обсуждения установление сеттинга пациент описывает переживания.
- id: B_A10_F3_006
  label: Установление сеттинга — аспект 5
  area: A10
  family: F3
  definition: Но установление глубоких объектных отношений высвобождает также примитивную агрессию в отношениях в контексте
    реципрокной активизации у обоих партнеров подавленных или отщепленных с младенчества и детства патогенных объектных отношений.
  clinical_observability: умеренный
  example_context: При обсуждения установление сеттинга пациент описывает переживания.
- id: B_A10_F4_001
  label: Поддержание сеттинга
  area: A10
  family: F4
  definition: Твердое поддержание аналитиком технической нейтральности, избегание коммуникации с пациентом контрпереноса,
    избегание установления параметров техники, первоначально незапланированные для этого лечения, — все это может увеличить
    его внутреннюю свободу для фантазирования во время сеансов вместе с пациентом, так же как и за пределами сеансов.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с поддержание сеттинга.
- id: B_A10_F4_002
  label: Поддержание
  area: A10
  family: F4
  definition: Комбинация диффузной конвенциональности и сниженного индивидуального чувства ответственности создает условия
    для общего разложения преданности моральным нормам внутри группового сеттинга.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления поддержание сеттинга.
- id: B_A10_F4_003
  label: Поддержание сеттинга — аспект 2
  area: A10
  family: F4
  definition: Такие пациенты часто толерантны к полиморфным перверсным фантазиям и действиям и могут демонстрировать широкий
    спектр сексуального поведения, наряду с поддержанием облигаторного гомосексуального состояния.
  clinical_observability: умеренный
  example_context: Когда обсуждения поддержание сеттинга пациент описывает переживания.
- id: B_A10_F4_004
  label: Поддержание сеттинга — аспект 3
  area: A10
  family: F4
  definition: Некоторые технические проблемы при психоанализе перверсий Мне кажется, что решающее значение для аналитика,
    занимающегося лечением пациентов с хорошо структурированными перверсиями — на невротическом ли, или на пограничном и нарциссическом
    уровнях — имеет поддержание позиции технической нейтральности относительно того, какой будет сексуальная ориентация пациента
    по окончании лечения.
  clinical_observability: умеренный
  example_context: В ходе обсуждения поддержание сеттинга пациент описывает переживания.
- id: B_A10_F4_005
  label: Поддержание сеттинга — аспект 4
  area: A10
  family: F4
  definition: 'Переживания соединения и слияния необходимо отличать от феномена регрессивного соединения, который затушевывает
    дифференциацию Я — не-Я: сексуальную страсть характеризует синхронное переживание соединения и в то же время поддержание
    своей отдельной идентичности.'
  clinical_observability: умеренный
  example_context: После обсуждения поддержание сеттинга пациент описывает переживания.
- id: B_A10_F4_006
  label: Поддержание сеттинга — аспект 5
  area: A10
  family: F4
  definition: Зная о частоте встречающихся тяжелых случаев бессознательного эдипова чувства вины и нарциссических защит, формирующихся
    на основе эдиповых и доэдиповых конфликтов, мы можем задать вопрос о факторах, отвечающих за формирование и поддержание
    благоприятных отношений между мужчиной и женщиной.
  clinical_observability: умеренный
  example_context: При обсуждения поддержание сеттинга пациент описывает переживания.
- id: B_A10_F5_001
  label: Контроль безопасности
  area: A10
  family: F5
  definition: Важно, чтобы терапевт испытывал достаточное чувство безопасности, чтобы анализ мощных агрессивных сил не создавал
    нового риска для пациентов и других людей, в том числе и самого терапевта.
  clinical_observability: умеренный
  example_context: Пациент, который относится ко всем другим людям как к “объектам”, обычно боится, что отказ от такой защитной
    дистанции с терапевтом будет угрожать его безопасности.
- id: B_A10_F5_002
  label: Контроль
  area: A10
  family: F5
  definition: Все эти личностные расстройства обнаруживают хорошо интегрированную личностную идентичность, неспецифические
    проявления силы Эго (хорошая толерантность к тревоге, контроль импульсов и сублиматорная деятельность) и жесткое, но хорошо
    интегрированное Супер-Эго.
  clinical_observability: умеренный
  example_context: При этом снижался контроль за работой и ухудшалось качество обслуживания, что иногда приводило к политическим
    конфликтам между местными группами и чиновниками, занимавшимися психиатрией.
- id: B_A10_F5_003
  label: Контроль безопасности — аспект 2
  area: A10
  family: F5
  definition: Один пациент-мужчина переживал очень сильные чувства небезопасности и униженности перед своим аналитиком, при
    этом постоянно ругая его.
  clinical_observability: умеренный
  example_context: Когда обсуждения контроль безопасности пациент описывает переживания.
- id: B_A10_F5_004
  label: Контроль безопасности — аспект 3
  area: A10
  family: F5
  definition: Это поведение часто представляет собой бессознательную попытку восстановить контроль за окружающими, путем пробуждения
    у них чувства вины — например, когда рвутся отношения с сексуальным партнером или когда что-то мешает реализации желаний
    пациента.
  clinical_observability: умеренный
  example_context: В ходе обсуждения контроль безопасности пациент описывает переживания.
- id: B_A10_F5_005
  label: Контроль безопасности — аспект 4
  area: A10
  family: F5
