  clinical_observability: умеренный
  example_context: В ходе обсуждения потребность в зависимости пациент описывает переживания.
- id: B_A1_F10_005
  label: Потребность в зависимости — аспект 4
  area: A1
  family: F10
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
