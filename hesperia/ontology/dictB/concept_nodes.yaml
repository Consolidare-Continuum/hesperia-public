  example_context: В ходе обсуждения импульсы привязанности пациент описывает переживания.
- id: B_A1_F11_005
  label: Импульсы привязанности — аспект 4
  area: A1
  family: F11
  definition: Они легко вступают в отношения с окружающими и способны на теплые и поддерживающие привязанности — при том,
