  label: Оценка
  area: A8
  family: F9
  definition: эмпатии с центральным субъективным переживанием пациента — и “комплементарной идентификации” — т.е.
  clinical_observability: умеренный
  example_context: Пациенты, хронически лгущие аналитику, вносят в аналитическую ситуацию неестественность, которую аналитик
    сначала объясняет недостатком эмпатии по отношению к пациенту.
