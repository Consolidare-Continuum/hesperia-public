  example_context: В ходе обсуждения диагностические гипотезы пациент описывает переживания.
- id: B_A8_F17_005
  label: Диагностические гипотезы — аспект 4
  area: A8
  family: F17
  definition: Одним из аргументов в поддержку данной гипотезы является то, что у женщин мы действительно можем наблюдать спектр
