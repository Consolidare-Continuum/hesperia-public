  label: Импульсивная разрядка — аспект 5
  area: A1
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Импульсивная разрядка» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения импульсивная разрядка пациент описывает переживания.
- id: B_A1_F16_001
  label: Торможение влечений
  area: A1
  family: F16
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Принимая во внимание последние достижения в исследовании аффектов, я, не отвергая теории влечений Фрейда
    в целом, вношу в нее некоторые изменения.
- id: B_A1_F16_002
  label: Торможение
  area: A1
  family: F16
  definition: НОВОЕ В ПСИХОАНАЛИТИЧЕСКОЙ ТЕОРИИ ВЛЕЧЕНИЙ Марджори Брирли (Brierley, 1937) была первой, кто указал на странный
    парадокс, касающийся роли аффектов в психоаналитической теории и практике.
  clinical_observability: умеренный
  example_context: Когда происходит такое разрешение примитивного переноса, целостность эмоциональной сферы показывает, что
    производные влечений стали более интегрированными и дифференцированными.
- id: B_A1_F16_003
  label: Торможение влечений — аспект 2
  area: A1
  family: F16
  definition: Брирли думала, что если удастся прояснить роль, которую играют аффекты, то это позволит понять многие до сих
    пор неясные моменты теории влечений.
  clinical_observability: умеренный
  example_context: Когда обсуждения торможение влечений пациент описывает переживания.
- id: B_A1_F16_004
  label: Торможение влечений — аспект 3
  area: A1
  family: F16
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: В ходе обсуждения торможение влечений пациент описывает переживания.
- id: B_A1_F16_005
  label: Торможение влечений — аспект 4
  area: A1
  family: F16
  definition: Наконец, я предлагаю модель развития аффектов и влечений, основанную на собственных концепциях.
  clinical_observability: умеренный
  example_context: После обсуждения торможение влечений пациент описывает переживания.
- id: B_A1_F16_006
  label: Торможение влечений — аспект 5
  area: A1
  family: F16
  definition: Он понимал либидо, или сексуальное влечение, как иерархически соподчиненную организацию частичных влечений,
    принадлежащих более ранним фазам развития.
  clinical_observability: умеренный
  example_context: При обсуждения торможение влечений пациент описывает переживания.
- id: B_A1_F17_001
  label: Аффективная заразительность
  area: A1
  family: F17
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с аффективная заразительность.
- id: B_A1_F17_002
  label: Аффективная
  area: A1
  family: F17
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления аффективная заразительность.
- id: B_A1_F17_003
  label: Аффективная заразительность — аспект 2
  area: A1
  family: F17
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: Когда обсуждения аффективная заразительность пациент описывает переживания.
- id: B_A1_F17_004
  label: Аффективная заразительность — аспект 3
  area: A1
  family: F17
  definition: Аффективная доминанта сдвигается с другой темы на сам перенос, и это требует от аналитика фокусировки своих
    интерпретаций на переносе, перед тем как переходить к другой теме.
  clinical_observability: умеренный
  example_context: В ходе обсуждения аффективная заразительность пациент описывает переживания.
- id: B_A1_F17_005
  label: Аффективная заразительность — аспект 4
  area: A1
  family: F17
  definition: С исчезновением аналитического пространства доминирующая аффективная тема становится заметной благодаря его
    отсутствию.
  clinical_observability: умеренный
  example_context: После обсуждения аффективная заразительность пациент описывает переживания.
- id: B_A1_F17_006
  label: Аффективная заразительность — аспект 5
  area: A1
  family: F17
  definition: Несомненно, аффективная коммуникация увеличивает опасность выражения взаимных проекций принадлежащих Супер-Эго
    негативных аспектов нормальной амбивалентности, неконтролируемых или недоступных ему.
  clinical_observability: умеренный
  example_context: При обсуждения аффективная заразительность пациент описывает переживания.
- id: B_A1_F18_001
  label: Усиление аффекта
  area: A1
  family: F18
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A1_F18_002
  label: Усиление
  area: A1
  family: F18
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A1_F18_003
  label: Усиление аффекта — аспект 2
  area: A1
  family: F18
  definition: Фрейд понимал влечение как переход между физическим и психическим, как психический процесс, укорененный в биологии;
    он предполагал (Freud, 1915b, 1915c), что единственный способ, с помощью которого мы можем узнать о влечениях, это обращение
    к их психическим реперезентациям — идеям и аффектам.
  clinical_observability: умеренный
  example_context: Когда обсуждения усиление аффекта пациент описывает переживания.
- id: B_A1_F18_004
  label: Усиление аффекта — аспект 3
  area: A1
  family: F18
  definition: 3Рапапорт (Rapaport, 1953) описывает, как с течением времени у Фрейда менялось представление об аффектах.
  clinical_observability: умеренный
  example_context: В ходе обсуждения усиление аффекта пациент описывает переживания.
- id: B_A1_F18_005
  label: Усиление аффекта — аспект 4
  area: A1
  family: F18
  definition: Аффекты и влечения В первой теории аффектов Фрейда понятия аффекта и влечения были практически взаимозаменимы.
  clinical_observability: умеренный
  example_context: После обсуждения усиление аффекта пациент описывает переживания.
- id: B_A1_F18_006
  label: Усиление аффекта — аспект 5
  area: A1
  family: F18
  definition: Аффекты, постулировал Фрейд, являются процессами разрядки, которые могут достигать сознания, но не подвержены
    вытеснению; только психические реперезентации влечений вытесняются вместе с памятью о чем-либо или склонностью к возникновению
    соответствующего аффекта (Freud, 1915b,1915c).
  clinical_observability: умеренный
  example_context: При обсуждения усиление аффекта пациент описывает переживания.
- id: B_A1_F19_001
  label: Стыд и вина
  area: A1
  family: F19
  definition: Бессознательная вина и эротизация боли у них, как правило, отсутствуют.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с стыд и вина.
- id: B_A1_F19_002
  label: Стыд
  area: A1
  family: F19
  definition: Действительно, психоаналитическая гипотеза о бессознательном чувстве вины может продемонстрировать свою валидность
    только в том случае, если вина становится осознанной в результате психоаналитической эксплорации.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления стыд и вина.
- id: B_A1_F19_003
  label: Стыд и
  area: A1
  family: F19
  definition: В дополнение к этому нарциссические пациенты обнаруживают некоторую степень патологии Супер-Эго, включая неспособность
    к переживанию печали по собственному поводу, глубокие перепады настроения, преобладание стыда в противоположность вине
    при интрапсихической регуляции их социального поведения и систему ценностей, в большей степени детскую, нежели взрослую.
  clinical_observability: умеренный
  example_context: Когда обсуждения стыд и вина пациент описывает переживания.
- id: B_A1_F19_004
  label: Стыд и вина — аспект 3
  area: A1
  family: F19
  definition: Подобная психологическая структура позволяет отрицать агрессию и преобразовывать ее в бесстыдную эксплуатацию.
  clinical_observability: умеренный
  example_context: В ходе обсуждения стыд и вина пациент описывает переживания.
- id: B_A1_F19_005
  label: Стыд и вина — аспект 4
  area: A1
  family: F19
  definition: Он ответил, что ему очень стыдно за то, что он только что мне рассказал.
  clinical_observability: умеренный
  example_context: После обсуждения стыд и вина пациент описывает переживания.
- id: B_A1_F19_006
  label: Стыд и вина — аспект 5
  area: A1
  family: F19
  definition: Мужчины будут стыдиться этой неудачи и унижения, и, танцуя друг с другом, пары будут стыдиться, что держат друг
    друга в руках.
  clinical_observability: умеренный
  example_context: При обсуждения стыд и вина пациент описывает переживания.
- id: B_A1_F20_001
  label: Зависть как аффект
  area: A1
  family: F20
  definition: Как известно, первоначально психоанализ создавался для лечения неврозов (хотя, с точки зрения нынешней классификации,
    некоторые пациенты Фрейда вовсе не были невротиками, а страдали от более тяжелых психических расстройств).
  clinical_observability: умеренный
  example_context: Принимая во внимание последние достижения в исследовании аффектов, я, не отвергая теории влечений Фрейда
    в целом, вношу в нее некоторые изменения.
- id: B_A1_F20_002
  label: Зависть
  area: A1
  family: F20
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A1_F20_003
  label: Зависть как
  area: A1
  family: F20
  definition: Им разработана современная психоналитическая теория личности, вкратце заключающаяся в том, что “Я” человека
    состоит из различных репрезентаций (образов, проявлений) себя и своих объектов (прежде всего близких людей) и связывающих
    их аффективных состояний.
  clinical_observability: умеренный
  example_context: Примитивные аффекты появляются в течение первых двух-трех лет жизни и обладают качествами интенсивности
    и глобальности, а также диффузным, недифференцированным когнитивным элементом.
- id: B_A1_F20_004
  label: Зависть как аффект — аспект 3
  area: A1
  family: F20
  definition: Кернберга очень интересуют вопросы патологического нарциссизма, который иногда, как мне кажется, превращается
    у него в отдельную структурную категорию патологии, наряду с тремя упомянутыми.
  clinical_observability: умеренный
  example_context: Когда аффективное состояние прерывается, нарушаются доминирующие в переносе объектные отношения и ограничивается
    полнота осознания пациентом собственного субъективного опыта.
- id: B_A1_F20_005
  label: Зависть как аффект — аспект 4
  area: A1
  family: F20
  definition: Как и все книги Кернберга, она является сгустком его основных теоретических идей, клинического и жизненного
    опыта, одним из вариантов той Книги, которую он пишет в течение всей жизни.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A1_F20_006
  label: Зависть как аффект — аспект 5
  area: A1
  family: F20
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: После того, как жена увела детей, он с облегчением почувствовал себя в одиночестве, хотя и испытывал вину
    за то, что не проводит с ними достаточно много времени.
- id: B_A1_F21_001
  label: Тревога и страх
  area: A1
  family: F21
  definition: Якобсон (Jacobson, 1953) привлекла внимание к тому факту, что состояния напряжения (например, сексуальное возбуждение)
    могут быть приятными, а состояния разрядки (тревога) могут быть неприятными.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A1_F21_002
  label: Тревога
  area: A1
  family: F21
  definition: На поверхностном уровне ненависть к объекту бессознательной и сознательной зависти обычно рационализируется
    в качестве страха перед разрушительным потенциалом этого объекта, происходящего как от действительной агрессии, испытанной
    со стороны прошлых объектов пациента, в которых тот очень нуждался (в случае пациентов, переживших тяжелые травмы), так
    и от проекций его собственных ярости и ненависти.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A1_F21_003
  label: Тревога и
  area: A1
  family: F21
  definition: Ненависть и неспособность выносить общение с объектом защищают пациента от того, что может в ином случае проявиться
    как сочетание жестоких нападок на объект, параноидных страхов перед ним и направленной на самого себя агрессии при идентификации
    с объектом.
  clinical_observability: умеренный
  example_context: Примечательно, что импотенция у нарциссических мужчин с жесткими запретами, со страхом перед женщинами,
    может являться непосредственным выражением этого страха.
- id: B_A1_F21_004
  label: Тревога и страх — аспект 3
  area: A1
  family: F21
  definition: В то же время фантазии и страхи пациента отражают его представление, что пока он будет нападать на терапевта,
    он будет подвергаться аналогичным атакам ненависти, садистской эксплуатации и преследованиям с его стороны.
  clinical_observability: умеренный
  example_context: Когда в процессе терапии страх ослабевает, они впадают в сексуальный промискуитет.
- id: B_A1_F21_005
  label: Тревога и страх — аспект 4
  area: A1
  family: F21
  definition: Такие образы усиливают эдиповы страхи и приводят к сгущению бессознательных эдиповых и предэдиповых проблем
    в поведении этих пациентов в гораздо большей степени, чем это случается при преэдиповой регрессии у пациентов с депрессивно-мазохистской
    личностью и преимущественно эдиповой динамикой.
  clinical_observability: умеренный
  example_context: Пациент в своей грандиозности переживает победу над страхом боли и смерти и, на бессознательном уровне,
    чувствует, что контролирует и саму смерть.
- id: B_A1_F21_006
  label: Тревога и страх — аспект 5
  area: A1
  family: F21
  definition: Грандиозность находит себе подкрепление в чувстве торжества над страхом или болью и смертью и в ощущении своего
    превосходства над теми, кто шокирован или огорчен его поведением.
  clinical_observability: умеренный
  example_context: При обсуждения тревога и страх пациент описывает переживания.
- id: B_A1_F22_001
  label: Предвосхищение и возбуждение
  area: A1
  family: F22
  definition: Якобсон (Jacobson, 1953) привлекла внимание к тому факту, что состояния напряжения (например, сексуальное возбуждение)
    могут быть приятными, а состояния разрядки (тревога) могут быть неприятными.
  clinical_observability: умеренный
  example_context: При нормальных обстоятельствах сексуальное возбуждение зрелого индивида активируется в контексте эротического
    желания.
- id: B_A1_F22_002
  label: Предвосхищение
  area: A1
  family: F22
  definition: Этот опыт включает активацию сильного сексуального возбуждения в подростковый и юношеский период, когда эротически
    окрашенные аффективные состояния интегрируются с генитальным возбуждением и с эротически наполненными эмоциямми и фантазиями,
    идущими от эдиповой стадии развития.
  clinical_observability: умеренный
  example_context: Пациенты, о которых пойдет речь, не способны испытывать сексуальное возбуждение, несмотря на совершенно
    нормально функционирующий биологический аппарат.
- id: B_A1_F22_003
  label: Предвосхищение и
  area: A1
  family: F22
  definition: Психоаналитическая ситуация обеспечивает нам уникальный способ исследования аффектов любого рода — начиная от
    примитивных (ярость или сексуальное возбуждение) и до когнитивно дифференцированных, имеющих сложное строение.
  clinical_observability: умеренный
  example_context: При садистических перверсиях мы видим открытое садистическое поведение — связанное или не связанное с сексуальными
    действиями, — которое несет в себе мощное возбуждение и удовлетворение.
- id: B_A1_F22_004
  label: Предвосхищение и возбуждение — аспект 3
  area: A1
  family: F22
  definition: Раньше (Kernberg, 1991b) я уже описывал агрессивный компонент, входящий в сексуальное возбуждение — агрессивный
    компонент проникновения и принятия в себя — как принятие агрессии на службу любви, использующее эрогенный потенциал переживания
    боли как важнейший вклад в удовлетворяющее слияние с другим в сексуальном возбуждении и оргазме.
  clinical_observability: умеренный
  example_context: В ходе обсуждения предвосхищение и возбуждение пациент описывает переживания.
- id: B_A1_F22_005
  label: Предвосхищение и возбуждение — аспект 4
  area: A1
  family: F22
  definition: Эта нормальная способность к трансформации боли в эротическое возбуждение страдает в случаях, когда отношения
    матери и младенца характеризуются сильной агрессией, и является, по-видимому, главным мостом, ведущим к эротическому возбуждению
    от вызывания страданий у других людей, что приводит к консолидации приятных характеристик садистской ненависти.
  clinical_observability: умеренный
  example_context: После обсуждения предвосхищение и возбуждение пациент описывает переживания.
- id: B_A1_F22_006
  label: Предвосхищение и возбуждение — аспект 5
  area: A1
  family: F22
  definition: Другая пациентка, белая женщина, принадлежащая к среднему классу, двадцати с небольшим лет, могла испытывать
    сексуальное возбуждение, только отдаваясь за деньги мужчинам значительно старше ее или неграм в опасных кварталах.
  clinical_observability: умеренный
  example_context: При обсуждения предвосхищение и возбуждение пациент описывает переживания.
- id: B_A1_F23_001
  label: Аффективная амбивалентность
  area: A1
  family: F23
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с аффективная амбивалентность.
- id: B_A1_F23_002
  label: Аффективная
  area: A1
  family: F23
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления аффективная амбивалентность.
- id: B_A1_F23_003
  label: Аффективная амбивалентность — аспект 2
  area: A1
  family: F23
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: Когда обсуждения аффективная амбивалентность пациент описывает переживания.
- id: B_A1_F23_004
  label: Аффективная амбивалентность — аспект 3
  area: A1
  family: F23
  definition: Первое — это истерическое расстройство личности, для которого характерно сравнительно сохранное чувство идентичности,
    способность к стабильным, дифференцированным, эмоционально богатым и эмпатичным отношениям с окружающими, включая способность
    выдерживать их амбивалентность и сложность, и преобладание защитных механизмов, основанных на вытеснении.
  clinical_observability: умеренный
  example_context: В ходе обсуждения аффективная амбивалентность пациент описывает переживания.
- id: B_A1_F23_005
  label: Аффективная амбивалентность — аспект 4
  area: A1
  family: F23
  definition: С моей точки зрения, колебание терапевта между параноидной позицией и элементами участия — иными словами, истинная
    амбивалентность в его реакциях на этих пациентов — является здоровой реакцией.
  clinical_observability: умеренный
  example_context: После обсуждения аффективная амбивалентность пациент описывает переживания.
- id: B_A1_F23_006
  label: Аффективная амбивалентность — аспект 5
  area: A1
  family: F23
  definition: Аффективная доминанта сдвигается с другой темы на сам перенос, и это требует от аналитика фокусировки своих
    интерпретаций на переносе, перед тем как переходить к другой теме.
  clinical_observability: умеренный
  example_context: При обсуждения аффективная амбивалентность пациент описывает переживания.
- id: B_A1_F24_001
  label: Иерархия мотивационных систем
  area: A1
  family: F24
  definition: Это убеждение находит свое выражение в том внимании, которое я уделяю необходимости интегрировать систему диагностики,
    основанной на описании поведения, с психодинамическим подходом, сосредоточенным на формировании психических структур.
  clinical_observability: умеренный
  example_context: Пациенты с невротической организацией личности демонстрируют преимущественно межсистемные конфликты.
- id: B_A1_F24_002
  label: Иерархия
  area: A1
  family: F24
  definition: Влечения и инстинкты Хотя Фрейд считал, что влечения, которые он признавал основой системы психической мотивации,
    имеют биологические источники, он постоянно указывал на недостаточность достоверных сведений о процессах, которые приводят
    к превращению этих биологических инстинктов в психологическую мотивацию.
  clinical_observability: умеренный
  example_context: Когда перенос у пограничных пациентов преимущественно негативный, с ним надо работать систематически лишь
    здесь-и-теперь, не занимаясь полной генетической реконструкцией.
- id: B_A1_F24_003
  label: Иерархия мотивационных
  area: A1
  family: F24
  definition: С моей точки зрения, понимание влечений как высшей ступени в иереархии психической мотивационной системы является
    правильным, и дуалистическая теория влечений Фрейда служит удовлетворительным объяснением этой мотивации.
  clinical_observability: умеренный
  example_context: При внутрисистемном конфликте отщепленные интернализованные объектные отношения на первый взгляд кажутся
    отделенными друг от друга, но они недифференцированные по своей природе.
- id: B_A1_F24_004
  label: Иерархия мотивационных систем — аспект 3
  area: A1
  family: F24
  definition: Эта биологически-средовая система считается эпигенетической.
  clinical_observability: умеренный
  example_context: В ходе обсуждения иерархия мотивационных систем пациент описывает переживания.
- id: B_A1_F24_005
  label: Иерархия мотивационных систем — аспект 4
  area: A1
  family: F24
  definition: Инстинкты, согласно этой точке зрения, это иерархически организованные биологические мотивационные системы.
  clinical_observability: умеренный
  example_context: После обсуждения иерархия мотивационных систем пациент описывает переживания.
- id: B_A1_F24_006
  label: Иерархия мотивационных систем — аспект 5
  area: A1
  family: F24
  definition: Если мы рассматриваем аффекты как первичные блоки построения влечений и наиболее ранних мотивационных систем,
    нам по-прежнему необходимо объяснить, как аффекты организуются в иерархические системы влечений более высокого уровня.
  clinical_observability: умеренный
  example_context: При обсуждения иерархия мотивационных систем пациент описывает переживания.
- id: B_A2_F1_001
  label: Репрезентации Я
  area: A2
  family: F1
  definition: Якобсон также описала, как когнитивные аспекты аффектов соотносятся с их вкладом в репрезентации “Я” и объектов
    как в Эго, так и в Супер-Эго.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A2_F1_002
  label: Репрезентации
  area: A2
  family: F1
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной личностной организацией и сопутствующим синдромом диффузной идентичности обычно
    не могут глубоко интегрировать репрезентации значимых других.
- id: B_A2_F1_003
  label: Репрезентации Я — аспект 2
  area: A2
  family: F1
  definition: Спутанные, недифференцированные репрезентации или сгущенные “полностью хорошие” Я- и объект-репрезентации выстраиваются
    отдельно от так же точно спутанных или сгущенных “полностью плохих” Я- и объект- репрезентаций.
  clinical_observability: умеренный
  example_context: Примитивные Я- и объект-репрезентации взаимосвязаны как основные формы примитивных объектных отношений
    (Kernberg, 1976).
- id: B_A2_F1_004
  label: Репрезентации Я — аспект 3
  area: A2
  family: F1
  definition: Аффективные структуры памяти, возникающие из неприятных или болезненных пиковых аффективных состояний, в которых
    Я- и объект-репрезентации также не являются дифференцированными, строятся самостоятельно, отдельно от приятных.
  clinical_observability: умеренный
  example_context: При таком положении вещей инвестированные как либидо, так и агрессией Я- репрезентации усиливают господство
    садистических предшественников Супер-Эго.
- id: B_A2_F1_005
  label: Репрезентации Я — аспект 4
  area: A2
  family: F1
  definition: Это аффективное состояние всегда сигнализирует об активации бессознательных объектных отношений между аспектом
    “Я”-репрезентации и соответствующей объект-репрезентацией пациента.
  clinical_observability: умеренный
  example_context: После обсуждения репрезентации я пациент описывает переживания.
- id: B_A2_F1_006
  label: Репрезентации Я — аспект 5
  area: A2
  family: F1
  definition: Говоря иными словами, если, согласно Фрейду (Freud, 1915а), единственное знание, которое мы получаем о влечениях,
    исходит от их психических репрезентаций и аффектов, то это репрезентации “Я” и объекта, связанные доминирующим аффективным
    состоянием.
  clinical_observability: умеренный
  example_context: При обсуждения репрезентации я пациент описывает переживания.
- id: B_A2_F2_001
  label: Репрезентации объекта
  area: A2
  family: F2
  definition: В основе моей работы лежит убеждение, что патология личности определяется теми психическими структурами, которые
    возникают под влиянием аффективного опыта взаимодействия с ранними значимыми объектами.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A2_F2_002
  label: Репрезентации
  area: A2
  family: F2
  definition: Якобсон также описала, как когнитивные аспекты аффектов соотносятся с их вкладом в репрезентации “Я” и объектов
    как в Эго, так и в Супер-Эго.
  clinical_observability: умеренный
  example_context: Пациент, который относится ко всем другим людям как к “объектам”, обычно боится, что отказ от такой защитной
    дистанции с терапевтом будет угрожать его безопасности.
- id: B_A2_F2_003
  label: Репрезентации объекта — аспект 2
  area: A2
  family: F2
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A2_F2_004
  label: Репрезентации объекта — аспект 3
  area: A2
  family: F2
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: При таких обстоятельствах нормальная смена объекта с матери на отца бессознательно искажена и ее отношения
    с мужчинами превращаются в садомазохистские.
- id: B_A2_F2_005
  label: Репрезентации объекта — аспект 4
  area: A2
  family: F2
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: Терапевт или еще какая-то идеализированная фигура может восприниматься как союзник в борьбе против равно
    всемогущего и (столь же фантастического) “абсолютно плохого” объекта.
- id: B_A2_F2_006
  label: Репрезентации объекта — аспект 5
  area: A2
  family: F2
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной личностной организацией и сопутствующим синдромом диффузной идентичности обычно
    не могут глубоко интегрировать репрезентации значимых других.
- id: B_A2_F3_001
  label: Диада Я–Объект
  area: A2
  family: F3
  definition: По мере накопления клинического опыта и развития теоретических концепций о ранних отношениях ребенка и матери,
    переносе/контрпереносе, объектных отношениях, аналитической ситуации и т.п.
  clinical_observability: умеренный
  example_context: Когда аффективное состояние прерывается, нарушаются доминирующие в переносе объектные отношения и ограничивается
    полнота осознания пациентом собственного субъективного опыта.
- id: B_A2_F3_002
  label: Диада
  area: A2
  family: F3
  definition: Отто Кернберг также много сделал для внедрения теории объектных отношений Мелани Кляйн и других британских психоаналитиков
    в основанную на эго-психологии теорию и практику американского психоанализа.
  clinical_observability: умеренный
  example_context: При нормальных условиях объект любви, не отвечающий взаимностью на любовь субъекта, оставляется им посредством
    процесса оплакивания.
- id: B_A2_F3_003
  label: Диада Я–Объект — аспект 2
  area: A2
  family: F3
  definition: Им разработана современная психоналитическая теория личности, вкратце заключающаяся в том, что “Я” человека
    состоит из различных репрезентаций (образов, проявлений) себя и своих объектов (прежде всего близких людей) и связывающих
    их аффективных состояний.
  clinical_observability: умеренный
  example_context: Пациентка отыгрывает защитное мазохистское объектное отношение, исходящее из интернализованного ею агрессивно-покорного
    взаимодействия с матерью.
- id: B_A2_F3_004
  label: Диада Я–Объект — аспект 3
  area: A2
  family: F3
  definition: В основе моей работы лежит убеждение, что патология личности определяется теми психическими структурами, которые
    возникают под влиянием аффективного опыта взаимодействия с ранними значимыми объектами.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A2_F3_005
  label: Диада Я–Объект — аспект 4
  area: A2
  family: F3
  definition: В третьей и четвертой частях книги я излагаю свою теорию эго- психологии — объектных отношений в ее приложении
    к клинической ситуации.
  clinical_observability: умеренный
  example_context: В ходе этого процесса прежде неосознаваемые, отрицаемые, вытесненные, проецируемые или диссоциированные
    объектные отношения могут стать полностью осознанными и эго-дистонными.
- id: B_A2_F3_006
  label: Диада Я–Объект — аспект 5
  area: A2
  family: F3
  definition: '*** За тот вклад, который они внесли в мои размышления о теории объектных отношений, я благодарен докторам
    Сельме Крамер, Райнеру Краузе, Джозефу и Анне-Мари Сандлер, Эрнсту и Гертруде Тихо, а также Джону Сазерленду.'
  clinical_observability: умеренный
  example_context: Пациент может теперь смутно осознавать, что объект его любви и ненависти — это одно и то же.
- id: B_A2_F4_001
  label: Аффективная связь внутри диады
  area: A2
  family: F4
  definition: (Freud, 1915b, 1915c) он рассматривал их (в частности, их связь с удовольствием или болью, психомоторные и нейровегетативные
    аспекты) как процессы разрядки влечений; наконец, в 1926 г.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A2_F4_002
  label: Аффективная
  area: A2
  family: F4
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: При нормальных условиях проецируется не Я-идеал, а идеалы, развивающиеся по мере структурного развития
    внутри Супер-Эго (включая Я-идеал).
- id: B_A2_F4_003
  label: Аффективная связь
  area: A2
  family: F4
  definition: Мне кажется, очень обоснованно было бы рассматривать аффекты как связь между компонентами инстинктов, имеющими
    биологическую обусловленность, с одной стороны, и интрапсихической организацией влечений, с другой.
  clinical_observability: умеренный
  example_context: Терапевтический альянс есть связь аналитика с наблюдающей частью Эго пациента (Zetzel, 1956; Greenson,
    1965), какой бы слабой она ни была, в терапевтической ситуации.
- id: B_A2_F4_004
  label: Аффективная связь внутри диады — аспект 3
  area: A2
  family: F4
  definition: Сгущение и смещение как характеристики содержимого Ид отражают связь между аффективно окрашенными репрезентациями
    “Я” и объектов со сходной позитивной или негативной валентностью, образуя таким образом соответствующие агрессивные, либидинальные
    и, позднее, смешанные ряды.
  clinical_observability: умеренный
  example_context: При внутрисистемном конфликте отщепленные интернализованные объектные отношения на первый взгляд кажутся
    отделенными друг от друга, но они недифференцированные по своей природе.
- id: B_A2_F4_005
  label: Аффективная связь внутри диады — аспект 4
  area: A2
  family: F4
  definition: Аффекты, таким образом, можно рассматривать как сложные психические структуры, имеющие нерасторжимую связь с
    когнитивной оценкой текущей ситуации, которую делает индивид, и содержащие позитивную или негативную валентность отношений
    субъекта и объекта в конкретном переживании.
  clinical_observability: умеренный
  example_context: После обсуждения аффективная связь внутри диады пациент описывает переживания.
- id: B_A2_F4_006
  label: Аффективная связь внутри диады — аспект 5
  area: A2
  family: F4
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
  example_context: При обсуждения аффективная связь внутри диады пациент описывает переживания.
- id: B_A2_F5_001
  label: Диффузия идентичности
  area: A2
  family: F5
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности также имеют недостаточно интегрированную Я-концепцию, синдром
    диффузной идентичности.
- id: B_A2_F5_002
  label: Диффузия
  area: A2
  family: F5
  definition: По этой причине интерсубъективность, независимо от того, включается ли она в переживание себя или отвергается
    посредством проективных механизмов, является неотьемлемой частью развития нормальной идентичности.
  clinical_observability: умеренный
  example_context: После этого можно исследовать пациента на наличие синдрома диффузной идентичности.
- id: B_A2_F5_003
  label: Диффузия идентичности — аспект 2
  area: A2
  family: F5
  definition: эмпатии с тем, что пациент не может в себе выносить и активирует посредством проективной идентификации — узнает
    о мире интернализованных объектных отношений пациента, составляющих часть идентичности его Эго.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной личностной организацией и сопутствующим синдромом диффузной идентичности обычно
    не могут глубоко интегрировать репрезентации значимых других.
- id: B_A2_F5_004
  label: Диффузия идентичности — аспект 3
  area: A2
  family: F5
  definition: Эти пациенты также обнаруживают спутанность сексуальной идентичности, так что гомо- и гетеросексуальные взаимодействия
    становятся частью их половой жизни при ведущей организующей роли мазохистского сценария.
  clinical_observability: умеренный
  example_context: При этом мы ищем признаки диффузной идентичности в рассказах пациента о себе и своей социальной жизни.
- id: B_A2_F5_005
  label: Диффузия идентичности — аспект 4
  area: A2
  family: F5
  definition: Первое — это истерическое расстройство личности, для которого характерно сравнительно сохранное чувство идентичности,
    способность к стабильным, дифференцированным, эмоционально богатым и эмпатичным отношениям с окружающими, включая способность
    выдерживать их амбивалентность и сложность, и преобладание защитных механизмов, основанных на вытеснении.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A2_F5_006
  label: Диффузия идентичности — аспект 5
  area: A2
  family: F5
  definition: Сценическое расстройство личности входит в категорию пограничной организации личности; оно характеризуется синдромом
    размытой идентичности, тяжелой патологией объектных отношений и преобладанием примитивных защитных операций, основанных
    на расщеплении.
  clinical_observability: умеренный
  example_context: При обсуждения диффузия идентичности пациент описывает переживания.
- id: B_A2_F6_001
  label: Консолидация идентичности
  area: A2
  family: F6
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности также имеют недостаточно интегрированную Я-концепцию, синдром
    диффузной идентичности.
- id: B_A2_F6_002
  label: Консолидация
  area: A2
  family: F6
  definition: По этой причине интерсубъективность, независимо от того, включается ли она в переживание себя или отвергается
    посредством проективных механизмов, является неотьемлемой частью развития нормальной идентичности.
  clinical_observability: умеренный
  example_context: После этого можно исследовать пациента на наличие синдрома диффузной идентичности.
- id: B_A2_F6_003
  label: Консолидация идентичности — аспект 2
  area: A2
  family: F6
  definition: эмпатии с тем, что пациент не может в себе выносить и активирует посредством проективной идентификации — узнает
    о мире интернализованных объектных отношений пациента, составляющих часть идентичности его Эго.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной личностной организацией и сопутствующим синдромом диффузной идентичности обычно
    не могут глубоко интегрировать репрезентации значимых других.
- id: B_A2_F6_004
  label: Консолидация идентичности — аспект 3
  area: A2
  family: F6
  definition: Эти пациенты также обнаруживают спутанность сексуальной идентичности, так что гомо- и гетеросексуальные взаимодействия
    становятся частью их половой жизни при ведущей организующей роли мазохистского сценария.
  clinical_observability: умеренный
  example_context: При этом мы ищем признаки диффузной идентичности в рассказах пациента о себе и своей социальной жизни.
- id: B_A2_F6_005
  label: Консолидация идентичности — аспект 4
  area: A2
  family: F6
  definition: Наконец, консолидация патологически грандиозного “Я” в качестве части нарциссической структуры личности приводит
    к процессам идеализации, полностью отличным от нормального нарциссического функционирования в контексте интегрированной
    трехчленной психической структуры.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A2_F6_006
  label: Консолидация идентичности — аспект 5
  area: A2
  family: F6
  definition: Первое — это истерическое расстройство личности, для которого характерно сравнительно сохранное чувство идентичности,
    способность к стабильным, дифференцированным, эмоционально богатым и эмпатичным отношениям с окружающими, включая способность
    выдерживать их амбивалентность и сложность, и преобладание защитных механизмов, основанных на вытеснении.
  clinical_observability: умеренный
  example_context: При обсуждения консолидация идентичности пациент описывает переживания.
- id: B_A2_F7_001
  label: Постоянство объекта
  area: A2
  family: F7
  definition: В основе моей работы лежит убеждение, что патология личности определяется теми психическими структурами, которые
    возникают под влиянием аффективного опыта взаимодействия с ранними значимыми объектами.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A2_F7_002
  label: Постоянство
  area: A2
  family: F7
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Пациент, который относится ко всем другим людям как к “объектам”, обычно боится, что отказ от такой защитной
    дистанции с терапевтом будет угрожать его безопасности.
- id: B_A2_F7_003
  label: Постоянство объекта — аспект 2
  area: A2
  family: F7
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A2_F7_004
  label: Постоянство объекта — аспект 3
  area: A2
  family: F7
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: При таких обстоятельствах нормальная смена объекта с матери на отца бессознательно искажена и ее отношения
    с мужчинами превращаются в садомазохистские.
- id: B_A2_F7_005
  label: Постоянство объекта — аспект 4
  area: A2
  family: F7
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Терапевт или еще какая-то идеализированная фигура может восприниматься как союзник в борьбе против равно
    всемогущего и (столь же фантастического) “абсолютно плохого” объекта.
- id: B_A2_F7_006
  label: Постоянство объекта — аспект 5
  area: A2
  family: F7
  definition: Аффекты, таким образом, можно рассматривать как сложные психические структуры, имеющие нерасторжимую связь с
    когнитивной оценкой текущей ситуации, которую делает индивид, и содержащие позитивную или негативную валентность отношений
    субъекта и объекта в конкретном переживании.
  clinical_observability: умеренный
  example_context: Пациент путает перенос и реальность и не может отличить терапевта от объекта переноса.
- id: B_A2_F8_001
  label: Интеграция хороших и плохих объектов
  area: A2
  family: F8
  definition: Им разработана современная психоналитическая теория личности, вкратце заключающаяся в том, что “Я” человека
    состоит из различных репрезентаций (образов, проявлений) себя и своих объектов (прежде всего близких людей) и связывающих
    их аффективных состояний.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A2_F8_002
  label: Интеграция
  area: A2
  family: F8
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интеграция хороших и плохих объектов.
- id: B_A2_F8_003
  label: Интеграция хороших
  area: A2
  family: F8
  definition: Якобсон также описала, как когнитивные аспекты аффектов соотносятся с их вкладом в репрезентации “Я” и объектов
    как в Эго, так и в Супер-Эго.
  clinical_observability: умеренный
  example_context: Когда обсуждения интеграция хороших и плохих объектов пациент описывает переживания.
- id: B_A2_F8_004
  label: Интеграция хороших и плохих объектов — аспект 3
  area: A2
  family: F8
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: В ходе обсуждения интеграция хороших и плохих объектов пациент описывает переживания.
- id: B_A2_F8_005
  label: Интеграция хороших и плохих объектов — аспект 4
  area: A2
  family: F8
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: После обсуждения интеграция хороших и плохих объектов пациент описывает переживания.
- id: B_A2_F8_006
  label: Интеграция хороших и плохих объектов — аспект 5
  area: A2
  family: F8
  definition: Я также считаю, что бессознательная организация и интеграция аффективно обусловленного раннего опыта подразумевает
    более высокий уровень мотивационной организации, чем тот, что представлен аффективными состояниями как таковыми.
  clinical_observability: умеренный
  example_context: При обсуждения интеграция хороших и плохих объектов пациент описывает переживания.
- id: B_A2_F9_001
  label: Расщеплённые объектные представления
  area: A2
  family: F9
  definition: Эта идея находится в сооответствии с его представлениями о психической природе влечений.
  clinical_observability: умеренный
  example_context: Когда аффективное состояние прерывается, нарушаются доминирующие в переносе объектные отношения и ограничивается
    полнота осознания пациентом собственного субъективного опыта.
- id: B_A2_F9_002
  label: Расщеплённые
  area: A2
  family: F9
  definition: Я предполагаю, что именно аффективно заряженные объектные отношения обеспечивают физиологические “зоны” энергией.
  clinical_observability: умеренный
  example_context: В ходе этого процесса прежде неосознаваемые, отрицаемые, вытесненные, проецируемые или диссоциированные
    объектные отношения могут стать полностью осознанными и эго-дистонными.
- id: B_A2_F9_003
  label: Расщеплённые объектные
  area: A2
  family: F9
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: При психоаналитическом исследовании таких пациентов мы открываем не то, что происходило в их внешнем мире,
    но то, как пациент переживал значимые объектные отношения в прошлом.
- id: B_A2_F9_004
  label: Расщеплённые объектные представления — аспект 3
  area: A2
  family: F9
  definition: Более того, аффект в психоаналитической ситуации либо отражает, либо дополняет реактивные внутренние объектные
    отношения.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A2_F9_005
  label: Расщеплённые объектные представления — аспект 4
  area: A2
  family: F9
  definition: В переносе аффективное состояние повторяет важные для пациента в прошлом объектные отношения.
  clinical_observability: умеренный
  example_context: Примитивная идеализация слабо дифференцированных взрослых или сверстников, являющихся образцами, представляет
    собой отщепленные частичные объектные отношения.
- id: B_A2_F9_006
  label: Расщеплённые объектные представления — аспект 5
  area: A2
  family: F9
  definition: И, конечно же, все возникающие в переносе объектные отношения содержат в себе также и определенное аффективное
    состояние.
  clinical_observability: умеренный
  example_context: Терапевт, который пытается использовать в поддерживающей терапии магические представления пациента и связанную
    с ними диссоциированную идеализацию, обычно за это расплачивается.
- id: B_A2_F10_001
  label: Идеализированные объекты
  area: A2
  family: F10
