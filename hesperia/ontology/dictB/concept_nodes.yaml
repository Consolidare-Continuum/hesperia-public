- id: B_A6_F15_001
  label: Нарциссический контроль
  area: A6
  family: F15
  definition: В своих предыдущих работах я указывал (1975, 1984), что пациент, особенно нарциссический пациент с антисоциальными
    чертами, больше всего ненавидит то, что он в наибольшей степени надеется получить от терапевта — неизменную преданность
    ему.
  clinical_observability: умеренный
  example_context: При этом снижался контроль за работой и ухудшалось качество обслуживания, что иногда приводило к политическим
    конфликтам между местными группами и чиновниками, занимавшимися психиатрией.
- id: B_A6_F15_002
  label: Нарциссический
  area: A6
  family: F15
  definition: Все эти личностные расстройства обнаруживают хорошо интегрированную личностную идентичность, неспецифические
    проявления силы Эго (хорошая толерантность к тревоге, контроль импульсов и сублиматорная деятельность) и жесткое, но хорошо
    интегрированное Супер-Эго.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарциссический контроль.
- id: B_A6_F15_003
  label: Нарциссический контроль — аспект 2
  area: A6
  family: F15
  definition: Это поведение часто представляет собой бессознательную попытку восстановить контроль за окружающими, путем пробуждения
    у них чувства вины — например, когда рвутся отношения с сексуальным партнером или когда что-то мешает реализации желаний
    пациента.
  clinical_observability: умеренный
  example_context: Когда обсуждения нарциссический контроль пациент описывает переживания.
- id: B_A6_F15_004
  label: Нарциссический контроль — аспект 3
  area: A6
  family: F15
  definition: Они теряют эмоциональный контроль только перед лицом тех, с кем находятся в интенсивном конфликте, особенно
    имеющем сексуальную или конкурентную природу.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарциссический контроль пациент описывает переживания.
- id: B_A6_F15_005
  label: Нарциссический контроль — аспект 4
  area: A6
  family: F15
  definition: Совершить самоубийство, согласно фантазии таких пациентов, значит установить садистский контроль над окружающими
    или “покинуть” мир, который, по их мнению, они не в силах контролировать.
  clinical_observability: умеренный
  example_context: После обсуждения нарциссический контроль пациент описывает переживания.
- id: B_A6_F15_006
  label: Нарциссический контроль — аспект 5
  area: A6
  family: F15
  definition: Длительное стационарное лечение в специализированных закрытых больницах или в тюремной системе, возможно, является
    эффективным в некоторых случаях, особенно если твердый и не поддающийся коррупции внешний контроль за режимом сочетается
    с возможностью групповой терапии в группах, составленных из пациентов-заключенных (Reid, 1981).
  clinical_observability: умеренный
  example_context: При обсуждения нарциссический контроль пациент описывает переживания.
- id: B_A6_F16_001
  label: Перфекционизм
  area: A6
  family: F16
  definition: Его семья, друзья и коллеги считали его холодным и отчужденным, и он знал, что несмотря на все свои усилия стать
    более открытым и общительным, был зажат, неуклюж, ригиден и склонен к перфекционизму.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с перфекционизм.
- id: B_A6_F16_002
  label: Перфекционизм — аспект 1
  area: A6
  family: F16
  definition: Интерпретация его страха гомосексуальных желаний по отношению ко мне, позволяющая ему говорить об этих вопросах
    более свободно, запустила развитие интенсивных страхов передо мной как садистским родительским образом, сочетающим в себе
    как отцовскую гневную, авторитарную позицию, так и жесткий, требовательный перфекционизм матери.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления перфекционизм.
- id: B_A6_F16_003
  label: Перфекционизм — аспект 2
  area: A6
  family: F16
  definition: В переносе его обсессивно-компульсивный перфекционизм поначалу сильно мешал свободным ассоциациям и был основной
    темой работы в течение первых двух лет анализа.
  clinical_observability: умеренный
  example_context: Когда обсуждения перфекционизм пациент описывает переживания.
- id: B_A6_F16_004
  label: Перфекционизм — аспект 3
  area: A6
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Перфекционизм» в контексте объектных отношений и защит
    (Кернберг).
  clinical_observability: умеренный
  example_context: В ходе обсуждения перфекционизм пациент описывает переживания.
- id: B_A6_F16_005
  label: Перфекционизм — аспект 4
  area: A6
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Перфекционизм» в контексте объектных отношений и защит
    (Кернберг).
  clinical_observability: умеренный
  example_context: После обсуждения перфекционизм пациент описывает переживания.
