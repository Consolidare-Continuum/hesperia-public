- id: B_A8_F19_002
  label: Дифференциальная
  area: A8
  family: F19
  definition: Тогда им были рекомендованы диагностика и терапия супружеских отношений.
  clinical_observability: умеренный
  example_context: 'Пациенты с суицидальным риском: диагностика и подход 318 17.'
- id: B_A8_F19_003
  label: Дифференциальная диагностика — аспект 2
  area: A8
  family: F19
  definition: Дифференциальная диагностика антисоциального поведения в таких случаях есть важнейший аспект диагностики у подростков
    с нарциссическими нарушениями.
  clinical_observability: умеренный
  example_context: Когда обсуждения дифференциальная диагностика пациент описывает переживания.
- id: B_A8_F19_004
  label: Дифференциальная диагностика — аспект 3
  area: A8
