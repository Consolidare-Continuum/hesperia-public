- id: B_A8_F14_002
  label: Интерпретация — аспект 1
  area: A8
  family: F14
  definition: Лишь тогда терапевт может обратиться к анализу невротических, “Эдиповых”, конфликтов пациента и интерпретациям
    там-и- тогда — касающимся текущей жизни пациента и его прошлого — и более твердому соблюдению технической нейтральности.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интерпретация.
- id: B_A8_F14_003
  label: Интерпретация — аспект 2
  area: A8
  family: F14
  definition: 'Такая интерпретация может звучать примерно следующим образом: “У меня возникает впечатление, что если я укажу
    вам, что я считаю (то или иное ваше поведение) проявлением вашей глубокой потребности разрушить (определенные отношения),
    вы истолкуете мое замечание как мое нападение на вас, вместо попытки помочь вам понять то, что я считаю важным аспектом
