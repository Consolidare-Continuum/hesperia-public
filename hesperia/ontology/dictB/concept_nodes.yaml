  example_context: Когда обсуждения наблюдение контрпереноса пациент описывает переживания.
- id: B_A8_F16_004
  label: Наблюдение контрпереноса — аспект 3
  area: A8
  family: F16
  definition: главу 9.) Интуитивная оценка аналитиком данного пространства посредством контрпереноса создает “третий канал”
