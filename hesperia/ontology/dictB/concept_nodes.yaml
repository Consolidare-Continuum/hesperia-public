  clinical_observability: умеренный
  example_context: В ходе обсуждения сочувствие пациент описывает переживания.
- id: B_A7_F2_005
  label: Сочувствие — аспект 4
  area: A7
  family: F2
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сочувствие» в контексте объектных отношений и защит
