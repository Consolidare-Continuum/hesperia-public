  family: F22
  definition: Эротическая идеализация, отражающая проекцию Эго-идеала, приводит совсем к другим результатам по сравнению с
    эротической идеализацией, отражающей проекцию патологически грандиозного “Я”.
  clinical_observability: умеренный
  example_context: В ходе обсуждения оценка результата пациент описывает переживания.
- id: B_A10_F22_005
  label: Оценка результата — аспект 4
  area: A10
  family: F22
  definition: Затем, если очевиден диагноз нарциссической структуры личности, ключевой диагностической задачей становится
    оценка тяжести всех представленных антисоциальных особенностей, их прошлой истории и детских источников и сохранившихся
    у пациента способности к объектным отношениям и функционирования Супер-Эго.
  clinical_observability: умеренный
  example_context: После обсуждения оценка результата пациент описывает переживания.
- id: B_A10_F22_006
  label: Оценка результата — аспект 5
  area: A10
  family: F22
  definition: Оценка причин, по которым пациент решил проконсультироваться у психиатра — они могут включать манипулятивную
    попытку получить справку о здоровье для восстановления в школе или избежать судебного преследования, — нередко служит
    как диагностическим, так и прогностическим целям.
  clinical_observability: умеренный
  example_context: При обсуждения оценка результата пациент описывает переживания.
- id: B_A10_F23_001
  label: Долгосрочное наблюдение
  area: A10
  family: F23
  definition: (“Первый канал” соответствует сообщению пациентом своих субъективных переживаний; “второй канал” — это наблюдение
    аналитиком невербального поведения пациента).
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с долгосрочное наблюдение.
- id: B_A10_F23_002
  label: Долгосрочное
  area: A10
  family: F23
  definition: Я считаю, что это представление проливает новый свет на сделанное Фрейдом (Freud, 1915а) наблюдение, что инстинкт
    может превращаться в свою противоположность и обретать в качестве своего объекта “Я” пациента.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления долгосрочное наблюдение.
- id: B_A10_F23_003
  label: Долгосрочное наблюдение — аспект 2
  area: A10
  family: F23
  definition: Я полагаю, давнее клиническое наблюдение, что один аффект может использоваться в качестве защиты против другого
    вытесненного или диссоциированного аффекта, следует переформулировать как защитное использование одного интернализованного
    объектного отношения и соответствующего ему аффекта против другого интернализованного объектного отношения и соответствующего
    ему аффекта.
  clinical_observability: умеренный
  example_context: Когда обсуждения долгосрочное наблюдение пациент описывает переживания.
- id: B_A10_F23_004
  label: Долгосрочное наблюдение — аспект 3
  area: A10
  family: F23
  definition: Самонаблюдение можно принимать как данность при невротической организации личности; саморефлексивность, рассматриваемая
    таким образом, является предварительным условием, но не эквивалентом эмоциональной интроспекции или инсайта.
  clinical_observability: умеренный
  example_context: В ходе обсуждения долгосрочное наблюдение пациент описывает переживания.
- id: B_A10_F23_005
  label: Долгосрочное наблюдение — аспект 4
  area: A10
  family: F23
  definition: Самонаблюдение является всегда ключевым фокусом интерпретативной работы при пограничной организации личности,
    при которой защитная диссоциация “Я” представляет главное текущее сопротивление.
  clinical_observability: умеренный
  example_context: После обсуждения долгосрочное наблюдение пациент описывает переживания.
- id: B_A10_F23_006
  label: Долгосрочное наблюдение — аспект 5
  area: A10
  family: F23
  definition: В то же время он попытался обосновать отсутствие противоречия между его наблюдением и моим заявлением, сказав
    мне, что я, возможно, не осознавал своего поведения на улице и что, полностью не осознавая этого, увидел его там.
  clinical_observability: умеренный
  example_context: При обсуждения долгосрочное наблюдение пациент описывает переживания.
- id: B_A10_F24_001
  label: Интеграция изменений
  area: A10
  family: F24
  definition: Я получил большую пользу от обсуждеиия своих мыслей по вопросу структурных изменений с докторами Марди Горовицем,
    Лестером Люборским и Робертом Валлерштейном.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A10_F24_002
  label: Интеграция
  area: A10
  family: F24
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интеграция изменений.
- id: B_A10_F24_003
  label: Интеграция изменений — аспект 2
  area: A10
  family: F24
  definition: Я также считаю, что бессознательная организация и интеграция аффективно обусловленного раннего опыта подразумевает
    более высокий уровень мотивационной организации, чем тот, что представлен аффективными состояниями как таковыми.
  clinical_observability: умеренный
  example_context: Когда обсуждения интеграция изменений пациент описывает переживания.
- id: B_A10_F24_004
  label: Интеграция изменений — аспект 3
  area: A10
  family: F24
  definition: 'В более благоприятных условиях интеграция абсолютно хороших и абсолютно плохих интернализованных объектных
    отношений может все же произойти и возникнет константность объекта, ведущая к интеграции структур Эго и Супер-Эго и установлению
    барьера вытеснения, отделяющего Эго от Ид: трехчленная структура получает свою консолидацию.'
  clinical_observability: умеренный
  example_context: В ходе обсуждения интеграция изменений пациент описывает переживания.
- id: B_A10_F24_005
  label: Интеграция изменений — аспект 4
  area: A10
  family: F24
  definition: Обычно только на продвинутых стадиях лечения пациентов с тяжелой психопатологией может иметь место интеграция
    идеализированного и преследующего интернализованных объектных отношений, при соответствующем переключении параноидного
    переноса на депрессивный — т.е.
  clinical_observability: умеренный
  example_context: После обсуждения интеграция изменений пациент описывает переживания.
- id: B_A10_F24_006
  label: Интеграция изменений — аспект 5
  area: A10
  family: F24
  definition: Так, даже после столкновения с последствиями своего антисоциального поведения и несмотря на бурное выражение
    сожаления, у них не возникает изменений в поведении по отношению к тем, на кого они нападали или кого эксплуатировали,
    или какой-то спонтанной озабоченности из-за неудачи в изменении поведения.
  clinical_observability: умеренный
  example_context: При обсуждения интеграция изменений пациент описывает переживания.
