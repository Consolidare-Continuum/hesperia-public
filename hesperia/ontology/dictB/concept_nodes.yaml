  clinical_observability: умеренный
  example_context: В ходе обсуждения оценка нарциссизма пациент описывает переживания.
- id: B_A8_F8_005
  label: Оценка нарциссизма — аспект 4
  area: A8
  family: F8
  definition: Это относится к некоторым пациентам с синдромом злокачественного нарциссизма и, видимо, является главной причиной
    того, что антисоциальные личности в чистом виде не поддаются лечению психоаналитического типа.
  clinical_observability: умеренный
  example_context: После обсуждения оценка нарциссизма пациент описывает переживания.
- id: B_A8_F8_006
  label: Оценка нарциссизма — аспект 5
  area: A8
  family: F8
  definition: Реальная оценка такой возможности и реалистическое структурирование ситуации лечения для защиты пациента, терапевта
