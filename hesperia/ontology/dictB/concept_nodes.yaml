  clinical_observability: умеренный
  example_context: Когда любовь взаимна, самооценка любящих повышается.
- id: B_A8_F10_003
  label: Оценка способности
  area: A8
  family: F10
  definition: Существует также доказательство того, что диэнцефальные центры, являющиеся медиаторами переживания отталкивающего
    или притягивающего характера восприятий, уже полностью созрели к моменту рождения, что подтверждает наше предположение
    ранней способности младенца к переживанию удовольствия и боли.
  clinical_observability: умеренный
  example_context: Пациент может теперь смутно осознавать, что объект его любви и ненависти — это одно и то же.
- id: B_A8_F10_004
  label: Оценка способности к любви — аспект 3
  area: A8
  family: F10
  definition: Недавние результаты наблюдений за взаимодействием младенцев с матерями (Stern, 1977, 1985) указывают на то,
    что в течение первых недель жизни происходит активация способности к различению особенностей, присущих матери, говорящая,
    что младенец изначально подготовлен к образованию особых схем самого себя и других людей.
  clinical_observability: умеренный
  example_context: Природа доэдиповых влияний на способность к сексуальной любви являлась предметом важных психоаналитических
    исследований.
- id: B_A8_F10_005
  label: Оценка способности к любви — аспект 4
  area: A8
  family: F10
  definition: Эта ранняя фаза имеет существенные для ее характеристики черты субъективности и не может рассматриваться как
    эквивалент стадии, на которой проявляются ранние способности к перекрестной дифференцировке моделей, которая, как подразумевается,
    соответствует врожденным способностям, оптимально наблюдаемым в экспериментальных условиях слабого или модулированного
    аффекта.
  clinical_observability: умеренный
  example_context: При страстной любви оргастические ощущения достигают максимума, и здесь мы можем исследовать значимость
    таких переживаний для индивидуума и для пары.
- id: B_A8_F10_006
  label: Оценка способности к любви — аспект 5
  area: A8
  family: F10
  definition: Субъективность также подразумевает мышление и поэтому требует, как минимум, способности манипулировать символами.
  clinical_observability: умеренный
  example_context: При сексуальной страсти преодоление временных границ Я также происходит под знаком принятия обязательств
    на будущее по отношению к объекту любви как к идеалу, придающему жизни личный смысл.
- id: B_A8_F11_001
  label: Структурное интервью
  area: A8
  family: F11
  definition: На основе выделенных им структурных критериев уровня организации личности Кернберг разработал структурное диагностическое
    интервью (см.
  clinical_observability: умеренный
  example_context: Примерно за два года до нашего первоначального интервью г-жа Н.
- id: B_A8_F11_002
  label: Структурное
  area: A8
  family: F11
  definition: Хотя дифференциальный диагноз способности к переживанию вины и участия подразумевает в качестве предварительного
    шага оценку реакций пациента на ограничение и крушение его всемогущества, другие характеристики, отражающие эту неспособность
    к вине и участию, могут быть обнаружены непосредственно в интервью.
  clinical_observability: умеренный
  example_context: После взаимных интервью последовал ряд индивидуальных сессий с новым развитием событий.
- id: B_A8_F11_003
  label: Структурное интервью — аспект 2
  area: A8
  family: F11
  definition: Изучение всех этих факторов обычно требует нескольких интервью; порой необходимо вновь и вновь возвращаться
    к областям сомнений и спутанности и повторно оценивать реакцию пациента на конфронтацию с обманным маневром или с противоречиями.
  clinical_observability: умеренный
  example_context: Когда же во время диагностического интервью такие защиты интерпретируются у психотика, это приводит к дальнейшему
    ухудшению его функционирования.
- id: B_A8_F11_004
  label: Структурное интервью — аспект 3
  area: A8
  family: F11
  definition: С моей точки зрения, структурное изменение, специфическое для психоаналитического лечения вначале возникает
    в переносе, и его соотношение с инсайтом может быть оценено путем фокусирования на взаимосвязи между интроспекцией и изменениями
    в поведении.
  clinical_observability: умеренный
  example_context: При оценке суицидального потенциала у пограничных пациентов меня поражает, насколько бесполезны их сознательные
    рационализации своей депрессии, с которыми они приходят на первые интервью.
- id: B_A8_F11_005
  label: Структурное интервью — аспект 4
  area: A8
  family: F11
  definition: Является ли структурное изменение, достигнутое посредством психоанализа, более прочным, чем полученное иным
    путем?
  clinical_observability: умеренный
  example_context: После обсуждения структурное интервью пациент описывает переживания.
- id: B_A8_F11_006
  label: Структурное интервью — аспект 5
  area: A8
  family: F11
  definition: Хотя структурное изменение может возникнуть именно в данном контексте, другие изменения возникают также как
    часть поддерживающих элементов, которыми может характеризоваться лечение и которые являются непременной чертой многих
    экспрессивных и поддерживающих терапий.
  clinical_observability: умеренный
  example_context: При обсуждения структурное интервью пациент описывает переживания.
- id: B_A8_F12_001
  label: Прояснение
  area: A8
  family: F12
  definition: Мне кажется, что психоанализ внес свой вклад как в запутывание диагностических вопросов, так и в прояснение
    структурных характеристик антисоциальной личности.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с прояснение.
- id: B_A8_F12_002
  label: Прояснение — аспект 1
  area: A8
  family: F12
  definition: 'Kernberg, 1984): 1) диагностику преобладающих объектных отношений в общей хаотической ситуации переноса; 2)
    прояснение того, что является репрезентацией “Я”, что — репрезентацией объекта в этих интернализованных объектных отношениях,
    а что — доминирующим аффектом, связывающим их; 3) интерпретативное связывание этих примитивных преобладающих объектных
    отношений с их отщепленной противоположностью.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления прояснение.
- id: B_A8_F12_003
  label: Прояснение — аспект 2
  area: A8
  family: F12
  definition: были направлены на прояснение его хаотичных отношений с подругой.
  clinical_observability: умеренный
  example_context: Когда обсуждения прояснение пациент описывает переживания.
- id: B_A8_F12_004
  label: Прояснение — аспект 3
  area: A8
  family: F12
  definition: Оба случая иллюстрируют постепенные прояснение, конфронтацию и интерпретацию доминирующих паттернов переноса,
    и значение этих паттернов для прояснения внутренней структуры болезни, изменения этих паттернов и зависимости как симптоматических,
    так и поведенческих изменений, происходящих в результате смены этих паттернов переноса.
  clinical_observability: умеренный
  example_context: В ходе обсуждения прояснение пациент описывает переживания.
- id: B_A8_F12_005
  label: Прояснение — аспект 4
  area: A8
  family: F12
  definition: Прояснение всех этих тем в переносе привело к дальнейшему прояснению трудностей, испытываемых ею в отношениях
    с женщинами.
  clinical_observability: умеренный
  example_context: После обсуждения прояснение пациент описывает переживания.
- id: B_A8_F12_006
  label: Прояснение — аспект 5
  area: A8
  family: F12
  definition: Подобное прояснение привело к изменениям в ее отношениях с мужем и в ее способности поддержать его усилия по
    улучшению деловой ситуации.
  clinical_observability: умеренный
  example_context: При обсуждения прояснение пациент описывает переживания.
- id: B_A8_F13_001
  label: Конфронтация
  area: A8
  family: F13
  definition: Конфронтация как техническое средство означает тактичное соединение противоречивых или спутанных аспектов повествования
    пациента, его поведения или его прошлого; это не агрессивное проявление критики или несогласия с пациентом.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с конфронтация.
- id: B_A8_F13_002
  label: Конфронтация — аспект 1
  area: A8
  family: F13
  definition: Центральным аспектом терапевтического подхода к психопатическим переносам является тактичная, но прямая конфронтация
    пациента с его обманом.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления конфронтация.
- id: B_A8_F13_003
  label: Конфронтация — аспект 2
  area: A8
  family: F13
  definition: Эта конфронтация нередко вызывает немедленную злобную атаку со стороны пациента, который обвиняет терапевта
    в агрессии или нечестности.
  clinical_observability: умеренный
  example_context: Когда обсуждения конфронтация пациент описывает переживания.
- id: B_A8_F13_004
  label: Конфронтация — аспект 3
  area: A8
  family: F13
  definition: Конфронтация пациента с этими несовместимыми реальностями воспроизводит ситуацию, возникающую, когда “сумасшедший”
    и “нормальный” пытаются общаться друг с другом без постороннего свидетеля или арбитра, который мог бы выяснить, что же
    является реальностью.
  clinical_observability: умеренный
