  label: Сексуальное возбуждение
  area: A1
  family: F12
  definition: Он понимал либидо, или сексуальное влечение, как иерархически соподчиненную организацию частичных влечений,
    принадлежащих более ранним фазам развития.
  clinical_observability: умеренный
