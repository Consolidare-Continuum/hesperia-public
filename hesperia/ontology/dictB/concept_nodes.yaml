- id: B_A6_F23_001
  label: Сексуализированный нарциссизм
  area: A6
  family: F23
  definition: Кернберга очень интересуют вопросы патологического нарциссизма, который иногда, как мне кажется, превращается
    у него в отдельную структурную категорию патологии, наряду с тремя упомянутыми.
  clinical_observability: умеренный
