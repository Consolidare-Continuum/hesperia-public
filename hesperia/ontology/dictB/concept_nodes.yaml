  clinical_observability: умеренный
  example_context: При обсуждения дистанцирование от аффекта пациент описывает переживания.
- id: B_A3_F20_001
  label: Защитное избегание
  area: A3
  family: F20
  definition: И действительно, когда, говоря с клинической точки зрения, мы указываем на защитное использование одного влечения
    против другого, мы на самом деле говорим о защитной функции одного аффекта по отношению к другому.
  clinical_observability: умеренный
  example_context: Пациентка отыгрывает защитное мазохистское объектное отношение, исходящее из интернализованного ею агрессивно-покорного
    взаимодействия с матерью.
- id: B_A3_F20_002
  label: Защитное
  area: A3
  family: F20
  definition: Я полагаю, давнее клиническое наблюдение, что один аффект может использоваться в качестве защиты против другого
    вытесненного или диссоциированного аффекта, следует переформулировать как защитное использование одного интернализованного
    объектного отношения и соответствующего ему аффекта против другого интернализованного объектного отношения и соответствующего
    ему аффекта.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления защитное избегание.
- id: B_A3_F20_003
  label: Защитное избегание — аспект 2
  area: A3
  family: F20
  definition: Для аналитика фобическое избегание признания реальности одного из аспектов своего поведения, замеченного пациентом
    и вызвавшего определенную реакцию с его стороны, является технической ошибкой.
  clinical_observability: умеренный
  example_context: Когда обсуждения защитное избегание пациент описывает переживания.
- id: B_A3_F20_004
  label: Защитное избегание — аспект 3
  area: A3
  family: F20
  definition: Но такое избегание проблемы является, конечно же, неудовлетворительным.
  clinical_observability: умеренный
  example_context: В ходе обсуждения защитное избегание пациент описывает переживания.
- id: B_A3_F20_005
  label: Защитное избегание — аспект 4
  area: A3
  family: F20
  definition: Твердое поддержание аналитиком технической нейтральности, избегание коммуникации с пациентом контрпереноса,
    избегание установления параметров техники, первоначально незапланированные для этого лечения, — все это может увеличить
    его внутреннюю свободу для фантазирования во время сеансов вместе с пациентом, так же как и за пределами сеансов.
  clinical_observability: умеренный
  example_context: После обсуждения защитное избегание пациент описывает переживания.
- id: B_A3_F20_006
  label: Защитное избегание — аспект 5
  area: A3
  family: F20
  definition: Я считаю, однако, что избегание Бионом анализа вопросов контрпереноса с тяжело регрессивными пациентами и указание,
    что концепция контрпереноса должна быть сохранена в ее узком значении и потому должна указывать на патологию терапевта,
    лишает анализ влияния всего поля контртрансферентных реакций.
  clinical_observability: умеренный
  example_context: При обсуждения защитное избегание пациент описывает переживания.
- id: B_A3_F21_001
  label: Регрессия
  area: A3
  family: F21
  definition: Мазохистские и садомазохистские личностные структуры и смешанные невротические констелляции, включающие параноидные,
    мазохистские и садистские черты, могут испытывать относительно внезапные колебания между депрессивной и параноидной регрессиями
    в переносе.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с регрессия.
- id: B_A3_F21_002
  label: Регрессия — аспект 1
  area: A3
  family: F21
  definition: Если произошло переключение переноса с преимущественно антисоциального на параноидный, показан обычный технический
    подход к тяжелым параноидным регрессиям, характер и способ применения которого я обсуждаю далее (гл.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления регрессия.
- id: B_A3_F21_003
  label: Регрессия — аспект 2
  area: A3
  family: F21
  definition: Такие параноидные сопротивления могут даже вести к параноидному трансферентному психозу, но также, если подобная
    регрессия контейнируется и удерживается в психотерапии, к последующему постепенному преобразованию в более обычный перенос,
    характерный для тяжелых нарциссических расстройств личности.
  clinical_observability: умеренный
  example_context: Когда обсуждения регрессия пациент описывает переживания.
- id: B_A3_F21_004
  label: Регрессия — аспект 3
  area: A3
  family: F21
  definition: РЕГРЕССИЯ В ПЕРЕНОСЕ И ПСИХОАНАЛИТИЧЕСКАЯ ТЕХНИКА РАБОТЫ С ИНФАНТИЛЬНЫМИ ЛИЧНОСТЯМИ Категория пациентов, описываемых
    нами в настоящей главе, относится к спектру пограничной организации личности, которую можно лечить с помощью психоанализа,
    хотя при этом на пути терапевтического успеха и возникают определенные технические проблемы.
  clinical_observability: умеренный
  example_context: В ходе обсуждения регрессия пациент описывает переживания.
- id: B_A3_F21_005
  label: Регрессия — аспект 4
  area: A3
  family: F21
  definition: Есть случаи (например, случай г-жи Ж.), когда происходит регрессия к сгущенной отцовско-материнской фигуре.
  clinical_observability: умеренный
  example_context: После обсуждения регрессия пациент описывает переживания.
- id: B_A3_F21_006
  label: Регрессия — аспект 5
  area: A3
  family: F21
  definition: Я думаю, что Бион, сводя вместе шизофрению и патологию характера, недооценивал важные различия в их специфических
    трансферентных регрессиях и, что даже более важно, в их техническом ведении.
  clinical_observability: умеренный
  example_context: При обсуждения регрессия пациент описывает переживания.
- id: B_A3_F22_001
  label: Фантазийное бегство
  area: A3
  family: F22
  definition: То, что отсутствует, это на самом деле очень даже присутствующая защита (имплицитное, фантазийное объектное
    отношение) от направленного на аналитика импульса, и это то, что должно быть проинтерпретировано.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с фантазийное бегство.
- id: B_A3_F22_002
  label: Фантазийное
  area: A3
  family: F22
  definition: ЕСЛИ ПИТАНИЕ (ДОБЫчА ЕДЫ, КОРМЛЕНИЕ), БОРЬБА—БЕГСТВО И СПАРИВАНИЕ яВЛяЮТСя ОСНОВНЫМИ ИНСТИНКТАМИ, ТО СООТВЕТСТВУЮЩИЕ
    ИМ АФФЕКТИВНЫЕ СОСТОяНИя МОГУТ РАССМАТРИВАТЬСя В КАчЕСТВЕ ИХ КОМПОНЕНТОВ.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления фантазийное бегство.
- id: B_A3_F22_003
  label: Фантазийное бегство — аспект 2
  area: A3
  family: F22
  definition: 'Обычно инстинкты классифицируют по трем направлениям: добыча еды — реакция на опасность (отражение атаки/бегство)
    — спаривание или каким-либо иным образом, но при этом инстинкты представляют собой сплав врожденных предрасположенностей
    и научения под воздействием окружающей среды.'
  clinical_observability: умеренный
  example_context: Когда обсуждения фантазийное бегство пациент описывает переживания.
- id: B_A3_F22_004
  label: Фантазийное бегство — аспект 3
  area: A3
  family: F22
  definition: К примеру, истерические женщины с сильными бессознательными тенденциями к конкуренции с мужчинами могут поддерживать
    стабильные, глубокие отношения с ними до тех пор, пока не присутствует сексуальная сторона; только при достижении сексуальной
    близости бессознательное негодование на фантазийное подчинение мужчине или бессознательное чувство вины за запретную сексуальность
    мешают отношениям.
  clinical_observability: умеренный
  example_context: В ходе обсуждения фантазийное бегство пациент описывает переживания.
- id: B_A3_F22_005
  label: Фантазийное бегство — аспект 4
  area: A3
  family: F22
  definition: Бегство нарциссических пациентов от “покоренных” сексуальных объектов может также представлять попытку уберечь
    эти объекты от бессознательной деструктивности.
  clinical_observability: умеренный
  example_context: После обсуждения фантазийное бегство пациент описывает переживания.
- id: B_A3_F22_006
  label: Фантазийное бегство — аспект 5
  area: A3
  family: F22
  definition: И важнейший источник зависти к пенису у женщин — поиск отношений зависимости с отцом и его пенисом, зависимости,
    которая является бегством от фрустрирующих отношений с матерью и освобождением от них.
  clinical_observability: умеренный
  example_context: При обсуждения фантазийное бегство пациент описывает переживания.
- id: B_A3_F23_001
  label: Юмор как защита
  area: A3
  family: F23
  definition: Как известно, первоначально психоанализ создавался для лечения неврозов (хотя, с точки зрения нынешней классификации,
    некоторые пациенты Фрейда вовсе не были невротиками, а страдали от более тяжелых психических расстройств).
  clinical_observability: умеренный
  example_context: После того, как жена увела детей, он с облегчением почувствовал себя в одиночестве, хотя и испытывал вину
    за то, что не проводит с ними достаточно много времени.
- id: B_A3_F23_002
  label: Юмор
  area: A3
  family: F23
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности могут использовать как проекцию, так и проективную идентификацию,
    но последняя явно доминирует в защитном репертуаре и ситуации переноса.
- id: B_A3_F23_003
  label: Юмор как
  area: A3
  family: F23
  definition: Кернберга очень интересуют вопросы патологического нарциссизма, который иногда, как мне кажется, превращается
    у него в отдельную структурную категорию патологии, наряду с тремя упомянутыми.
  clinical_observability: умеренный
  example_context: Пациенты с психотической организацией личности (для которых характерна, в первую очередь, потеря проверки
    реальности) обычно используют проективную идентификацию как преобладающую защиту.
- id: B_A3_F23_004
  label: Юмор как защита — аспект 3
  area: A3
  family: F23
  definition: Как и все книги Кернберга, она является сгустком его основных теоретических идей, клинического и жизненного
    опыта, одним из вариантов той Книги, которую он пишет в течение всей жизни.
  clinical_observability: умеренный
  example_context: Когда затем он стал выпытывать у нее информацию обо мне, она стала более сдержанной и спросила его “иронически”,
    как ему показалось, не является ли он моим пациентом.
- id: B_A3_F23_005
  label: Юмор как защита — аспект 4
  area: A3
  family: F23
  definition: В этом контексте мое внимание сосредоточено на специфических искажениях переноса и контрпереноса, вызванных
    структурированной агрессией в форме хронической ненависти и защитами против этой ненависти.
  clinical_observability: умеренный
  example_context: Принятие мной комплементарной идентификации в своем контрпереносе было не таким регрессивным проявлением
    с моей стороны, как менее реалистическая контридентификация, упомянутая в связи с г-жой Л.
- id: B_A3_F23_006
  label: Юмор как защита — аспект 5
  area: A3
  family: F23
  definition: Сделанные мной теоретические выводы, касающиеся агрессии и ненависти, я применяю для создания новых технических
    подходов в работе с тяжелыми расстройствами личности в рамках психоанализа как такового, психоаналитической психотерапии
    или больничного лечения средой.
  clinical_observability: умеренный
  example_context: Когда мою пациентку перевели к другому врачу, я почувствовал эмоциональную отстраненность как от Лусии,
    так и от доктора А.
- id: B_A3_F24_001
  label: Интроективная идентификация
  area: A3
  family: F24
  definition: Под завистью к объекту и потребностью уничтожить и испортить все хорошее, что может исходить из контактов с
    ним, лежит бессознательная идентификация с первоначально ненавистным — и необходимым — объектом.
  clinical_observability: умеренный
  example_context: Принятие мной комплементарной идентификации в своем контрпереносе было не таким регрессивным проявлением
    с моей стороны, как менее реалистическая контридентификация, упомянутая в связи с г-жой Л.
- id: B_A3_F24_002
  label: Интроективная
  area: A3
  family: F24
  definition: Идентификация с предающим объектом приводит на путь мстительного разрушения всех объектных отношений.
  clinical_observability: умеренный
  example_context: При психозе преобладают психотические идентификации, в том числе психотические интроекции и проективная
    идентификация.
- id: B_A3_F24_003
  label: Интроективная идентификация — аспект 2
  area: A3
  family: F24
  definition: Следующим шагом является идентификация с объектом, дающая субъекту чувство силы, свободы от страха и ощущения,
    что единственный путь к вступлению в отношения с другими людьми — это удовлетворение собственной агрессии.
  clinical_observability: умеренный
  example_context: Причинение боли другому и идентификация с его эротическим удовольствием от боли есть эротический садизм
    — противоположная сторона эротического мазохизма.
- id: B_A3_F24_004
  label: Интроективная идентификация — аспект 3
  area: A3
  family: F24
  definition: Альтернативным путем является принятие фальшивого, циничного способа общения, полностью отрицающего важность
    объектных отношений, превращение в невинного наблюдателя, а не идентификация с жестоким тираном или мазохистское подчинение
    ему.
  clinical_observability: умеренный
  example_context: Примитивные формы проекции, в частности проективная идентификация.
- id: B_A3_F24_005
  label: Интроективная идентификация — аспект 4
  area: A3
  family: F24
  definition: “Идентификация с агрессором”, также иллюстрируемая моим примером и теперь понимаемая как последовательная идентификация
    и с “Я”, и с объектом, демонстрирует превращение пассивного импульса в активный.
  clinical_observability: умеренный
  example_context: Когда же пациент рационализирует свою “контрагрессию” как следствие агрессии окружающих, проективная идентификация
    осложняется вторичной рационализацией.
- id: B_A3_F24_006
  label: Интроективная идентификация — аспект 5
  area: A3
  family: F24
  definition: Выражение импульса, направленного на “Я”, в противоположность выражению такого импульса, направленного на объект,
    может также пониматься как идентификация с нападающим объектом.
  clinical_observability: умеренный
  example_context: Примитивные же формы проекции, в частности проективная идентификация, есть мощное межличностное оружие,
    с помощью которого можно “перевалить” агрессию на аналитика.
- id: B_A4_F1_001
  label: Реакции ярости
  area: A4
  family: F1
  definition: И наоборот, реакции гнева на фрустрации в оральный период и борьба за власть в анальный период могут соединить
    созвучные агрессивные аффективные состояния, приводя таким образом к интеграции агрессивного влечения.
  clinical_observability: умеренный
  example_context: При дальнейшем развитии функцией ярости становится удаление препятствий к удовлетворению.
- id: B_A4_F1_002
  label: Реакции
  area: A4
  family: F1
  definition: В целом, аффекты сексуального возбуждения и ярости могут рассматриваться как, соответственно, центральные аффекты,
    вокруг которых происходит организация либидо и агрессии.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A4_F1_003
  label: Реакции ярости — аспект 2
  area: A4
  family: F1
  definition: Предлагаемая мной концепция также обеспечивает нас недостающими в психоаналитической теории звеньями связи между
    “источниками” агрессивно заряженных взаимоотношений младенца и матери, “зональными” функциями агрессивного отвержения
    или орального поглощения, анальным контролем, открытыми физическими столкновениями, связанными с припадками ярости и т.д.
  clinical_observability: умеренный
  example_context: Пациент представляет типичный случай обсессивной личности с ярко выраженным формированием реакции на агрессию
    в виде стойкой сверхвежливости и педантичности в самовыражении.
- id: B_A4_F1_004
  label: Реакции ярости — аспект 3
  area: A4
  family: F1
  definition: 'Мазохистское страдание истерического пациента, который воспринимает аналитика как фрустрирующую и наказывающую
    фигуру, может служить защитой от стоящих за этим сексуального возбуждения и позитивных эдиповых стремлений: смесь печали,
    ярости и жалости к себе может отражать аффективное состояние с защитными функциями, направленное против вытесненного сексуального
    возбуждения.'
  clinical_observability: умеренный
  example_context: Примитивная природа переноса пограничного пациента развивает у стремящегося чувствовать эмпатию терапевта
    способность осознавать собственные примитивные эмоциональные реакции.
- id: B_A4_F1_005
  label: Реакции ярости — аспект 4
  area: A4
  family: F1
  definition: Ненависть происходит от ярости, первичного аффекта, вокруг которого группируется агрессивное влечение; в случае
    тяжелой психопатологии ненависть может полностью доминировать как в отношении к самому себе, так и к окружающим.
  clinical_observability: умеренный
  example_context: Терапевт все настойчивее пытается помочь пациенту, несмотря на отсутствие реакции со стороны последнего
    или даже на ухудшение его состояния.
- id: B_A4_F1_006
  label: Реакции ярости — аспект 5
  area: A4
  family: F1
  definition: Ниже я постараюсь сосредоточиться на тех особенностях развития ярости, которые у некоторых пациентов приводят
    к преобладанию ненависти и тяжелой патологии характера, выражающихся в проявлении ненависти в качестве всеобъемлющего
    аффекта в переносе.
  clinical_observability: умеренный
  example_context: Терапевт должен сдерживать эти реакции, используя их для понимания.
- id: B_A4_F2_001
  label: Хроническая враждебность
  area: A4
  family: F2
  definition: В то же время перенос выглядит удивительно свободным от явной агрессии; хроническая лживость и поиск примитивного
    абсолютного хорошего состояния “Я” при устранении всех объектов — с помощью алкоголя или наркотиков, путем бессознательных
