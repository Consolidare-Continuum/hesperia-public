- id: B_A8_F14_001
  label: Интерпретация
  area: A8
  family: F14
  definition: 'Основными особенностями техники экспрессивной психотерапии являются: 1) акцент аналитика на интерпретациях
    “здесь-и-теперь”, т.е.'
  clinical_observability: умеренный
  example_context: При злокачественном разрушении источников помощи используется, в частности, тот факт, что всякая интерпретация
