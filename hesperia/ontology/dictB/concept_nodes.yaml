  label: Сексуализированный
  area: A6
  family: F23
  definition: Садизм может принимать форму сексуальной перверсии с действительным физическим повреждением объекта, или являться
    частью синдрома злокачественного нарциссизма, садомазохистской структуры личности, или представлять иногда рационализированную,
