- id: B_A10_F18_003
  label: Структурные изменения
  area: A10
  family: F18
  definition: ISBN 5-86375-103-7 (РФ) Книга Отто Кернберга, одного из крупнейших специалистов в области тяжелых неврозов,
    автора современной психоаналитической теории личности, посвящена исследованию проблем агрессии при различных психических
    расстройствах и на различных уровнях организации личности.
  clinical_observability: умеренный
  example_context: Пациенты, консультирующиеся по поводу умеренных или слабо выраженных невротических симптомов, осложняющих
    истерическое расстройство личности, могут нуждаться только в лечении этих симптомов.
- id: B_A10_F18_004
  label: Структурные изменения личности — аспект 3
  area: A10
  family: F18
  definition: Сделанные теоретические выводы, касающиеся агрессии и ненависти, автор применяет для создания новых технических
    подходов в работе с тяжелыми расстройствами личности в рамках психоанализа.
  clinical_observability: умеренный
  example_context: При инфантильной личности нередко встречается “pseudologia fantastica”; “параноидный зуд предательства”
    (Jacobson, 1971a) иллюстрирует вероломство в контексте паранойи.
- id: B_A10_F18_005
  label: Структурные изменения личности — аспект 4
  area: A10
  family: F18
  definition: Отто Кернберг — один из крупнейших специалистов в области тяжелых расстройств личности, лежащих в “промежутке”
    между неврозом и психозом и ставших доступными для психоаналитического лечения, в том числе и благодаря его личным усилиям.
  clinical_observability: умеренный
  example_context: Пациент с обсессивно-компульсивным расстройством личности ворует мелкие предметы из общественных мест,
    где работает, подвергая себя унизительному риску быть пойманным и уволенным.
