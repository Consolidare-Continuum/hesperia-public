  example_context: При обсуждения перфекционизм пациент описывает переживания.
- id: B_A6_F17_001
  label: Фантазии величия
  area: A6
  family: F17
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A6_F17_002
  label: Фантазии
  area: A6
  family: F17
  definition: Источники фантазии и экстремальные (пиковые) аффективные состояния Если в переносе происходит активация интенсивных
    аффективных состояний, то при этом вспоминаются соответствующие удовлетворяющие или фрустрирующие объектные отношения
    из прошлого, сопровождающиеся попытками их реактивации, если они были удовлетворяющими, или их избегания, если они были
    болезненными.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A6_F17_003
  label: Фантазии величия — аспект 2
  area: A6
  family: F17
  definition: Структура фантазии отражает, таким образом, одновременное существоание прошлого, настоящего и будущего, что
    характерно для Ид, предваряя осознание и признание объективных ограничений пространства-времени, характерных для дифференцированного
    Эго (Jaques, 1982).
  clinical_observability: умеренный
  example_context: Когда в поддерживающей терапии пациент предлагает терапевту примитивный материал регрессивной фантазии,
    терапевт не игнорирует это сообщение, но привязывает его к реальности.
- id: B_A6_F17_004
  label: Фантазии величия — аспект 3
  area: A6
  family: F17
  definition: От первичной интеграции примитивной аффективной памяти, связывающей “полностью хорошие” или “полностью плохие”
    пиковые аффективные состояния, ведут свое развитие специфические фантазии исполнения желаний, связывающие “Я” и объект,
    которые характерны для бессознательной фантазии.
  clinical_observability: умеренный
  example_context: При этом пациент гибко переходит от эмоций к интеллектуальному пониманию, от фантазии к реальности, от
    переноса к своей внешней жизни и так далее.
- id: B_A6_F17_005
  label: Фантазии величия — аспект 4
  area: A6
  family: F17
  definition: Аналогичным образом, преобразование болезненного опыта в символический образ недифференцированного “плохого
    Я — плохой матери” с очевидностью содержит в себе элемент фантазии, выходящей за рамки реалистического характера “хороших”
    Я- и объект-репрезентаций.
  clinical_observability: умеренный
  example_context: После обсуждения фантазии величия пациент описывает переживания.
- id: B_A6_F17_006
  label: Фантазии величия — аспект 5
  area: A6
  family: F17
  definition: Однако в клинической ситуации анализ реакций ярости — так же как и других интенсивных аффективных состояний
    — всегда открывает лежащие за ними сознательные и бессознательные фантазии, включающие специфические отношения между аспектом
    “Я” и аспектом значимого другого.
  clinical_observability: умеренный
  example_context: При обсуждения фантазии величия пациент описывает переживания.
- id: B_A6_F18_001
  label: Нарциссическая эксплуатация
  area: A6
  family: F18
  definition: Один пациент, нарциссическая личность с явно пограничными особенностями, требовал, чтобы его привязывали мужчины,
    с которыми он случайно встречался в барах, излюбленных садомазохистами.
  clinical_observability: умеренный
  example_context: Когда нарциссическая личность достигает высокого уровня функционирования, мы видим пациента, лишенного
    невротических симптомов и с хорошей поверхностной адаптацией.
- id: B_A6_F18_002
  label: Нарциссическая
  area: A6
  family: F18
  definition: Если говорить коротко, организация Эго, объектные отношения, развитие Супер-Эго, нарциссическая организация
    и степень интеграции полиморфной перверсной детской сексуальности являются кодетерминантами уровня и клинических особенностей
    мазохистской патологии.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарциссическая эксплуатация.
- id: B_A6_F18_003
  label: Нарциссическая эксплуатация — аспект 2
  area: A6
  family: F18
  definition: Во внутреннем мире таких пациентов и, следовательно, в воспринимаемой ими реальности межличностных отношений
    человек либо крайне могуществен и жесток, либо ему грозят разрушение и эксплуатация.
  clinical_observability: умеренный
  example_context: Когда обсуждения нарциссическая эксплуатация пациент описывает переживания.
- id: B_A6_F18_004
  label: Нарциссическая эксплуатация — аспект 3
  area: A6
  family: F18
  definition: Если не выявлена антисоциальная личность как таковая, то следующей диагностической категорией, которую необходимо
    рассмотреть, является нарциссическое расстройство личности с синдромом злокачественного нарциссизма или нарциссическая
    личность с преобладающими пассивно- паразитическими антисоциальными наклонностями.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарциссическая эксплуатация пациент описывает переживания.
- id: B_A6_F18_005
  label: Нарциссическая эксплуатация — аспект 4
  area: A6
  family: F18
  definition: Это замечание кажется самоочевидным, но я делаю его, потому что оно противоречит высказыванию Фрейда (Freud,
    1914), утверждавшего, что нарциссическая зараженность при влюбленности понижается.
  clinical_observability: умеренный
  example_context: После обсуждения нарциссическая эксплуатация пациент описывает переживания.
- id: B_A6_F18_006
  label: Нарциссическая эксплуатация — аспект 5
  area: A6
  family: F18
  definition: Нарциссическая идентификация с сексуальным возбуждением и оргазмом партнера и с восхищением партнера перед собственным
    телом индивида связана с эдиповыми и преэдиповыми фантазиями, которые замечательно похожи между собой у гомосексуальных
    и гетеросексуальных пациентов-мужчин.
  clinical_observability: умеренный
  example_context: При обсуждения нарциссическая эксплуатация пациент описывает переживания.
- id: B_A6_F19_001
  label: Эмоциональная поверхностность
  area: A6
  family: F19
  definition: Истерическая личность у женщин Главная характеристика этих женщин — эмоциональная лабильность.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с эмоциональная поверхностность.
- id: B_A6_F19_002
  label: Эмоциональная
  area: A6
  family: F19
  definition: Другие атрибуты, подразумевающие недостаточную способность к эмоциональной вовлеченности вкупе с недостатком
    моральных функций также не характерны для этого расстройства личности — например, эмоциональная поверхностность, ложные
    аффекты, лживость и pseudologia fantastica, упоминаемые в более ранней литературе.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления эмоциональная поверхностность.
- id: B_A6_F19_003
  label: Эмоциональная поверхностность — аспект 2
  area: A6
  family: F19
  definition: Мужчины — пациенты с “неврозом компенсации” или ипохондрией часто проявляют эмоциональную незрелость, склонность
    к драматизации, аффективную поверхностность и импульсивность, характерные для сценического расстройства личности, наряду
    с антисоциальными чертами и склонностями к эксплуатации в своих отношениях с представителями помогающих профессий.
  clinical_observability: умеренный
  example_context: Когда обсуждения эмоциональная поверхностность пациент описывает переживания.
- id: B_A6_F19_004
  label: Эмоциональная поверхностность — аспект 3
  area: A6
  family: F19
  definition: Типичными симптомами нарциссической личности в области патологической любви к себе являются чрезмерные внимание
    к себе и центрированность на себе; грандиозность и различные производные эксгибиционизма, позиция превосходства, безрассудство
    и сверхамбициозность; сверхзависимость от восхищения; эмоциональная пустота; приступы чрезмерной беззащитности, чередующиеся
    с грандиозностью.
  clinical_observability: умеренный
  example_context: В ходе обсуждения эмоциональная поверхностность пациент описывает переживания.
- id: B_A6_F19_005
  label: Эмоциональная поверхностность — аспект 4
  area: A6
  family: F19
  definition: На практике мой подход требует в начале каждой сессии воздерживаться от интервенции до тех пор, пока вербальные
    коммуникации пациента и его невербальное поведение, общая эмоциональная атмосфера и мой контрперенос не наведут меня на
    доминирующую аффективную тему.
  clinical_observability: умеренный
  example_context: После обсуждения эмоциональная поверхностность пациент описывает переживания.
- id: B_A6_F19_006
  label: Эмоциональная поверхностность — аспект 5
  area: A6
  family: F19
  definition: Временами эмоциональная диссоциация аналитика от ситуации, его временный “отказ” от аналитических переживаний
    могут выступить как дистанцирующее средство, обеззараживающее терапевтические отношения, но ценой потенциального разрушения
    лечения либо временного или постоянного ухода примитивных переносов в “подполье”.
  clinical_observability: умеренный
  example_context: При обсуждения эмоциональная поверхностность пациент описывает переживания.
- id: B_A6_F20_001
  label: Фрагментация Я
  area: A6
  family: F20
  definition: У пациента с пограничной личностной организацией в качестве реакции на такой вопрос могут активизироваться примитивные
    механизмы защиты, такие как проективная идентификация, расщепление, примитивная диссоциация противоречащих друг другу
    аспектов Я, отрицание, величие, фрагментация аффектов, всемогущество или обесценивание.
  clinical_observability: умеренный
  example_context: Когда пациент говорит, что чувствует замешательство или “рассыпается на части”, это не обязательно означает,
    что у него “фрагментация Я”.
- id: B_A6_F20_002
  label: Фрагментация
  area: A6
  family: F20
  definition: Существенно важно, чтобы терапевт всесторонне исследовал жизнь пациента — его конфликты и взаимодействие с другими
    людьми вне рамок психотерапии, — и при этом терапевт должен бороться с неопределенностью слов пациента, с недостатком
    необходимых сведений и с искажениями, которые вносят примитивные механизмы защиты, такие как отрицание, фрагментация эмоциональных
    переживаний, обесценивание и т.п.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления фрагментация я.
- id: B_A6_F20_003
  label: Фрагментация Я — аспект 2
  area: A6
  family: F20
  definition: Описанные Якобсон регрессивный патологический отказ от Я- и объект-репрезентаций и даже их фрагментация, свойственные
    маниакально-депрессивному психозу и шизофрении, соответствуют описанному Малер отсутствию границ между Я- и объект-репрезентациями
    при симбиотическом психозе детства.
  clinical_observability: умеренный
  example_context: Когда обсуждения фрагментация я пациент описывает переживания.
- id: B_A6_F20_004
  label: Фрагментация Я — аспект 3
  area: A6
  family: F20
  definition: Наблюдаемое клиническое проявление, связанное с областью «Фрагментация Я» в контексте объектных отношений и
    защит (Кернберг).
  clinical_observability: умеренный
  example_context: В ходе обсуждения фрагментация я пациент описывает переживания.
- id: B_A6_F20_005
  label: Фрагментация Я — аспект 4
  area: A6
  family: F20
  definition: Наблюдаемое клиническое проявление, связанное с областью «Фрагментация Я» в контексте объектных отношений и
    защит (Кернберг).
  clinical_observability: умеренный
  example_context: После обсуждения фрагментация я пациент описывает переживания.
- id: B_A6_F20_006
  label: Фрагментация Я — аспект 5
  area: A6
  family: F20
  definition: Наблюдаемое клиническое проявление, связанное с областью «Фрагментация Я» в контексте объектных отношений и
    защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения фрагментация я пациент описывает переживания.
- id: B_A6_F21_001
  label: Нарциссическое избегание
  area: A6
  family: F21
  definition: Мазохистское подчинение обеспечивает нарциссическое удовлетворение; депрессивно-мазохистская личность получает
    нарциссическое удовлетворение от чувства, что она является жертвой несправедливого обращения, а потому морально выше своего
    объекта.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с нарциссическое избегание.
- id: B_A6_F21_002
  label: Нарциссическое
  area: A6
  family: F21
  definition: 'Такие случаи надо отличать от антисоциального, дополняющего нарциссическое, расстройства личности: прогноз
    и при лечении, и без него для антисоциальной личности намного хуже.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарциссическое избегание.
- id: B_A6_F21_003
  label: Нарциссическое избегание — аспект 2
  area: A6
  family: F21
  definition: АНТИСОЦИАЛЬНОЕ И НАРЦИССИЧЕСКОЕ РАССТРОЙСТВА ЛИЧНОСТИ В этой главе наше внимание будет сосредоточено на тесных
    связях между нарциссическим и антисоциальным расстройствами личности.
  clinical_observability: умеренный
  example_context: Когда обсуждения нарциссическое избегание пациент описывает переживания.
- id: B_A6_F21_004
  label: Нарциссическое избегание — аспект 3
  area: A6
  family: F21
  definition: Таким образом, я описываю измерение антисоциального поведения, связывающее нарциссическое расстройство личности
    с антисоциальным расстройством личности и со злокачественным нарциссизмом.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарциссическое избегание пациент описывает переживания.
- id: B_A6_F21_005
  label: Нарциссическое избегание — аспект 4
  area: A6
  family: F21
  definition: Антисоциальное расстройство личности Такие пациенты обычно проявляют нарциссическое расстройство личности.
  clinical_observability: умеренный
  example_context: После обсуждения нарциссическое избегание пациент описывает переживания.
- id: B_A6_F21_006
  label: Нарциссическое избегание — аспект 5
  area: A6
  family: F21
  definition: Если не выявлена антисоциальная личность как таковая, то следующей диагностической категорией, которую необходимо
    рассмотреть, является нарциссическое расстройство личности с синдромом злокачественного нарциссизма или нарциссическая
    личность с преобладающими пассивно- паразитическими антисоциальными наклонностями.
  clinical_observability: умеренный
  example_context: При обсуждения нарциссическое избегание пациент описывает переживания.
- id: B_A6_F22_001
  label: Нарциссическое очарование
  area: A6
  family: F22
  definition: Было бы обоснованным предположить, что трехмесячный младенец способен переживать эмоции так же, как он способен
    к поведению, показывающему удовольствие, ярость или разочарование (Izard, 1978), это та идея, которую долго развивали
    Плучик и Келлерман (Plutchik and Kellerman, 1983).
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с нарциссическое очарование.
- id: B_A6_F22_002
  label: Нарциссическое
  area: A6
  family: F22
  definition: Мазохистское подчинение обеспечивает нарциссическое удовлетворение; депрессивно-мазохистская личность получает
    нарциссическое удовлетворение от чувства, что она является жертвой несправедливого обращения, а потому морально выше своего
    объекта.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарциссическое очарование.
- id: B_A6_F22_003
  label: Нарциссическое очарование — аспект 2
  area: A6
  family: F22
  definition: 'Такие случаи надо отличать от антисоциального, дополняющего нарциссическое, расстройства личности: прогноз
    и при лечении, и без него для антисоциальной личности намного хуже.'
  clinical_observability: умеренный
  example_context: Когда обсуждения нарциссическое очарование пациент описывает переживания.
- id: B_A6_F22_004
  label: Нарциссическое очарование — аспект 3
  area: A6
  family: F22
  definition: АНТИСОЦИАЛЬНОЕ И НАРЦИССИЧЕСКОЕ РАССТРОЙСТВА ЛИЧНОСТИ В этой главе наше внимание будет сосредоточено на тесных
    связях между нарциссическим и антисоциальным расстройствами личности.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарциссическое очарование пациент описывает переживания.
- id: B_A6_F22_005
  label: Нарциссическое очарование — аспект 4
  area: A6
  family: F22
  definition: Таким образом, я описываю измерение антисоциального поведения, связывающее нарциссическое расстройство личности
    с антисоциальным расстройством личности и со злокачественным нарциссизмом.
  clinical_observability: умеренный
