  clinical_observability: умеренный
  example_context: После обсуждения диагностические гипотезы пациент описывает переживания.
- id: B_A8_F17_006
  label: Диагностические гипотезы — аспект 5
  area: A8
  family: F17
  definition: Муж дал мне ясно понять, что не верит в желание жены продолжать диагностические интервью; более того, она считает,
