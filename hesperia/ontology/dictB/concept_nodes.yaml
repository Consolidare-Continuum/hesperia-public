  definition: Под завистью к объекту и потребностью уничтожить и испортить все хорошее, что может исходить из контактов с
    ним, лежит бессознательная идентификация с первоначально ненавистным — и необходимым — объектом.
  clinical_observability: умеренный
  example_context: После обсуждения нарциссическая зависть пациент описывает переживания.
- id: B_A6_F5_006
  label: Нарциссическая зависть — аспект 5
  area: A6
  family: F5
  definition: Зависть можно рассматривать и как источник примитивных форм ненависти, тесно связанный с оральной агрессией,
    жадностью и прожорливостью, и как последствие ненависти, происходящее из фиксации на травме.
  clinical_observability: умеренный
  example_context: При обсуждения нарциссическая зависть пациент описывает переживания.
- id: B_A6_F6_001
  label: Нарциссическая ярость
  area: A6
  family: F6
  definition: Психоаналитическая ситуация обеспечивает нам уникальный способ исследования аффектов любого рода — начиная от
    примитивных (ярость или сексуальное возбуждение) и до когнитивно дифференцированных, имеющих сложное строение.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A6_F6_002
  label: Нарциссическая
  area: A6
  family: F6
  definition: Было бы обоснованным предположить, что трехмесячный младенец способен переживать эмоции так же, как он способен
    к поведению, показывающему удовольствие, ярость или разочарование (Izard, 1978), это та идея, которую долго развивали
    Плучик и Келлерман (Plutchik and Kellerman, 1983).
  clinical_observability: умеренный
  example_context: Пациенты данной категории сталкиваются с трудностями в выражении агрессии и склонны чувствовать депрессию
    в условиях, которые в норме вызывают злость или ярость.
- id: B_A6_F6_003
  label: Нарциссическая ярость — аспект 2
  area: A6
  family: F6
  definition: Ярость С клинической точки зрения, основное аффективное состояние, характеризующее активацию агрессии в переносе,
    это ярость.
  clinical_observability: умеренный
  example_context: Придя в ярость, г-жа Б.
- id: B_A6_F6_004
  label: Нарциссическая ярость — аспект 3
  area: A6
  family: F6
  definition: Полностью развернутая реакция ярости — ее всеобъемлющий характер, ее диффузность, затемненность специфического
    когнитивного содержания и соответствующих объектных отношений — может создавать ошибочное впечатление, что ярость — это
    “чистый” примитивный аффект.
  clinical_observability: умеренный
  example_context: После этого Лусия впала в ярость и стала обвинять меня, что это я ригидно настаивал на том, чтобы она прошла
    курсы, которые ее совсем не интересовали.
- id: B_A6_F6_005
  label: Нарциссическая ярость — аспект 4
  area: A6
  family: F6
  definition: Наиболее типичным примером являются пациенты, которые достигают неспецифического облегчения тревоги посредством
    самоповреждения какого-либо рода или импульсивных суицидальных жестов, выполняемых с большой яростью и почти без депрессии.
  clinical_observability: умеренный
  example_context: Пациент принял эти условия, но перед этим в течение нескольких сеансов выражал свою ярость.
- id: B_A6_F6_006
  label: Нарциссическая ярость — аспект 5
  area: A6
  family: F6
  definition: Один пациент, нарциссическая личность с явно пограничными особенностями, требовал, чтобы его привязывали мужчины,
    с которыми он случайно встречался в барах, излюбленных садомазохистами.
  clinical_observability: умеренный
  example_context: Когда тетя обратила его внимание на это, пациент впал в такую сильную ярость, которую он не испытывал в
    течение нескольких месяцев.
- id: B_A6_F7_001
  label: Обесценивание объекта
  area: A6
  family: F7
  definition: В основе моей работы лежит убеждение, что патология личности определяется теми психическими структурами, которые
    возникают под влиянием аффективного опыта взаимодействия с ранними значимыми объектами.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A6_F7_002
  label: Обесценивание
  area: A6
  family: F7
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Пациент, который относится ко всем другим людям как к “объектам”, обычно боится, что отказ от такой защитной
    дистанции с терапевтом будет угрожать его безопасности.
- id: B_A6_F7_003
  label: Обесценивание объекта — аспект 2
  area: A6
  family: F7
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A6_F7_004
  label: Обесценивание объекта — аспект 3
  area: A6
  family: F7
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: При таких обстоятельствах нормальная смена объекта с матери на отца бессознательно искажена и ее отношения
    с мужчинами превращаются в садомазохистские.
- id: B_A6_F7_005
  label: Обесценивание объекта — аспект 4
  area: A6
  family: F7
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Терапевт или еще какая-то идеализированная фигура может восприниматься как союзник в борьбе против равно
    всемогущего и (столь же фантастического) “абсолютно плохого” объекта.
- id: B_A6_F7_006
  label: Обесценивание объекта — аспект 5
  area: A6
  family: F7
  definition: Аффекты, таким образом, можно рассматривать как сложные психические структуры, имеющие нерасторжимую связь с
    когнитивной оценкой текущей ситуации, которую делает индивид, и содержащие позитивную или негативную валентность отношений
    субъекта и объекта в конкретном переживании.
  clinical_observability: умеренный
  example_context: Пациент путает перенос и реальность и не может отличить терапевта от объекта переноса.
- id: B_A6_F8_001
  label: Отрицание зависимости
  area: A6
  family: F8
  definition: С клинической точки зрения, эти пациенты иллюстрируют самодеструктивность, находящуюся в зависимости от интенсивности
    примитивной агрессии, примитивизации всех интрапсихических структур, недостаточного развития Супер-Эго и использования
    либидинальных и эротических стремлений на службе агрессии.
  clinical_observability: умеренный
  example_context: Пациент сперва пытался отрицать, что то, что происходит между нами, имеет какое-то отношение к его мачехе,
    но его отрицание было достаточно слабым и безрезультатным.
- id: B_A6_F8_002
  label: Отрицание
  area: A6
  family: F8
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
    и сострадания у самих себя и у окружающих.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A6_F8_003
  label: Отрицание зависимости — аспект 2
  area: A6
  family: F8
  definition: Отвержение со стороны такого мужчины вызывало тяжелую депрессию, попытки суицида или отрицание того, что она
    была отвергнута.
  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A6_F8_004
  label: Отрицание зависимости — аспект 3
  area: A6
  family: F8
  definition: Эта экстраверсия проявляется в легкости социальных контактов и окрашена тенденцией к эксгибиционизму и чрезмерной
    зависимости от окружающих.
  clinical_observability: умеренный
  example_context: В ходе обсуждения отрицание зависимости пациент описывает переживания.
- id: B_A6_F8_005
  label: Отрицание зависимости — аспект 4
  area: A6
  family: F8
  definition: Один из паттернов характеризуется качеством псевдогипермаскулинности, театральным преувеличением принятого в
    культуре маскулинного поведения, обычно с акцентом на независимости, и установку на доминирование и превосходство над
    женщинами в сочетании с детской надутостью, если эти ожидания не сбываются.
  clinical_observability: умеренный
  example_context: После обсуждения отрицание зависимости пациент описывает переживания.
- id: B_A6_F8_006
  label: Отрицание зависимости — аспект 5
  area: A6
  family: F8
  definition: Сценическая личность может использовать сексуальное поведение глубоко и неадекватно для проявления своих потребностей
    в эксгибиционизме и зависимости, у нее меньше сексуальных торможений, и она гораздо чаще склонна к промискуитету по сравнению
    с истерической личностью.
  clinical_observability: умеренный
  example_context: При обсуждения отрицание зависимости пациент описывает переживания.
- id: B_A6_F9_001
  label: Нарциссическая изоляция
  area: A6
  family: F9
  definition: Один пациент, нарциссическая личность с явно пограничными особенностями, требовал, чтобы его привязывали мужчины,
    с которыми он случайно встречался в барах, излюбленных садомазохистами.
  clinical_observability: умеренный
  example_context: Когда нарциссическая личность достигает высокого уровня функционирования, мы видим пациента, лишенного
    невротических симптомов и с хорошей поверхностной адаптацией.
- id: B_A6_F9_002
  label: Нарциссическая
  area: A6
  family: F9
  definition: Если говорить коротко, организация Эго, объектные отношения, развитие Супер-Эго, нарциссическая организация
    и степень интеграции полиморфной перверсной детской сексуальности являются кодетерминантами уровня и клинических особенностей
    мазохистской патологии.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарциссическая изоляция.
- id: B_A6_F9_003
  label: Нарциссическая изоляция — аспект 2
  area: A6
  family: F9
  definition: Если не выявлена антисоциальная личность как таковая, то следующей диагностической категорией, которую необходимо
    рассмотреть, является нарциссическое расстройство личности с синдромом злокачественного нарциссизма или нарциссическая
    личность с преобладающими пассивно- паразитическими антисоциальными наклонностями.
  clinical_observability: умеренный
  example_context: Когда обсуждения нарциссическая изоляция пациент описывает переживания.
- id: B_A6_F9_004
  label: Нарциссическая изоляция — аспект 3
  area: A6
  family: F9
  definition: Это замечание кажется самоочевидным, но я делаю его, потому что оно противоречит высказыванию Фрейда (Freud,
    1914), утверждавшего, что нарциссическая зараженность при влюбленности понижается.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарциссическая изоляция пациент описывает переживания.
- id: B_A6_F9_005
  label: Нарциссическая изоляция — аспект 4
  area: A6
  family: F9
  definition: Нарциссическая идентификация с сексуальным возбуждением и оргазмом партнера и с восхищением партнера перед собственным
    телом индивида связана с эдиповыми и преэдиповыми фантазиями, которые замечательно похожи между собой у гомосексуальных
    и гетеросексуальных пациентов-мужчин.
  clinical_observability: умеренный
  example_context: После обсуждения нарциссическая изоляция пациент описывает переживания.
- id: B_A6_F9_006
  label: Нарциссическая изоляция — аспект 5
  area: A6
  family: F9
  definition: Перверсия и нарциссическая патология Эти случаи еще более трудны для лечения, и, как уже упоминалось выше, гомосексуальная
    идентичность может быть тесно интегрирована в патологически грандиозное “Я”.
  clinical_observability: умеренный
  example_context: При обсуждения нарциссическая изоляция пациент описывает переживания.
- id: B_A6_F10_001
  label: Чувствительность к унижению
  area: A6
  family: F10
  definition: 'Третья подразумеваемая характеристика истерических пациентов — эгоцентризм: сосредоточенное на себе, извиняющее
    себя, тщеславно эксгибиционистское, требующее к себе внимания поведение этих пациенток и их чувствительность к реакциям
    других людей.'
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с чувствительность к унижению.
- id: B_A6_F10_002
  label: Чувствительность
  area: A6
  family: F10
  definition: В Бразильских лекциях (Bion, 1974, 1975) Бион обнаруживает как исключительную чувствительность к регрессивным
    переносам, так и загадочное отсутствие интереса к реальной ситуации пациента, которое является дополнением его невнимания
    к контрпереносу.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления чувствительность к унижению.
- id: B_A6_F10_003
  label: Чувствительность к
  area: A6
  family: F10
  definition: 'отрицала наличие галлюцинаций или бреда, но сказала, что обладает повышенной чувствительностью к окружающему:
    предчувствует, когда зазвонит телефон, знает пол, возраст и род занятий людей, даже если они подходят к ней сзади.'
  clinical_observability: умеренный
  example_context: Когда обсуждения чувствительность к унижению пациент описывает переживания.
- id: B_A6_F10_004
  label: Чувствительность к унижению — аспект 3
  area: A6
  family: F10
  definition: Она чувствовала, что ее физическая энергия заблокирована и в то же самое время выходит из ее тела через шею
    в голову и окружающую среду, так что у нее появилась повышенная чувствительность по всем стимулам — в такой степени, что
    это вызывает у нее смятение.
  clinical_observability: умеренный
  example_context: В ходе обсуждения чувствительность к унижению пациент описывает переживания.
- id: B_A6_F10_005
  label: Чувствительность к унижению — аспект 4
  area: A6
  family: F10
  definition: Такая чувствительность может сексуально сдерживать мужчин (в том числе из страха стать сексуально менее привлекательными,
    подобно женщинам) на более поздних стадиях семейной жизни, когда оживают или усиливаются эдиповы запреты на сексуальность.
  clinical_observability: умеренный
  example_context: После обсуждения чувствительность к унижению пациент описывает переживания.
- id: B_A6_F10_006
  label: Чувствительность к унижению — аспект 5
  area: A6
  family: F10
  definition: У женщин бессознательная фантазия о предпочтении в качестве сексуального объекта могущественным, дистанцированным,
    потенциально угрожающим и в то же время соблазняющим отцом соединяется с искуплением вины благодаря принуждению, сексуальному
    унижению и оставлению.
  clinical_observability: умеренный
  example_context: При обсуждения чувствительность к унижению пациент описывает переживания.
- id: B_A6_F11_001
  label: Нарциссическая уязвимость
  area: A6
  family: F11
  definition: Они показывают аномальную уязвимость к разочарованию в других людях, заставляющую их делать многое из того,
    что им не нравится, чтобы обрести симпатию и любовь.
  clinical_observability: умеренный
  example_context: Когда нарциссическая личность достигает высокого уровня функционирования, мы видим пациента, лишенного
    невротических симптомов и с хорошей поверхностной адаптацией.
- id: B_A6_F11_002
  label: Нарциссическая
  area: A6
  family: F11
  definition: Один пациент, нарциссическая личность с явно пограничными особенностями, требовал, чтобы его привязывали мужчины,
