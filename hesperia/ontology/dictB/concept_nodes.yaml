- id: B_A8_F15_003
  label: Анализ переноса — аспект 2
  area: A8
  family: F15
  definition: произошло расширение спектра клинического применения психоанализа.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности могут использовать как проекцию, так и проективную идентификацию,
