  clinical_observability: умеренный
  example_context: При долгом участии (от 6 месяцев до 1 года) в такой полиморфной перверзивной деятельности их способность
    к сексуальной близости (и, по этой же причине, всякая близость) прекращается (Бартель, 1971).
- id: B_A2_F21_002
  label: Толерантность
  area: A2
  family: F21
  definition: Уровень патологичности каждых конкретных межличностных отношений зависит от степени вовлеченности в эти отношения
    или близости с другим человеком.
  clinical_observability: умеренный
  example_context: Примитивные диссоциативные механизмы могут сдерживать перверсии в рамках стабильного равновесия пары, которой
    удается достичь чрезвычайной близости при доминирующей роли агрессии.
- id: B_A2_F21_003
  label: Толерантность к
  area: A2
  family: F21
  definition: Толерантность к фрустрации у них низка.
  clinical_observability: умеренный
  example_context: Когда обсуждения толерантность к близости пациент описывает переживания.
- id: B_A2_F21_004
  label: Толерантность к близости — аспект 3
  area: A2
  family: F21
  definition: На одном из сеансов, когда я обсуждал с ней страх сексуальной близости с ее другом, г-жа Б., внезапно приняла
    тревожный и подозрительный вид и спросила, почему я сделал рукой определенный жест.
  clinical_observability: умеренный
  example_context: В ходе обсуждения толерантность к близости пациент описывает переживания.
- id: B_A2_F21_005
  label: Толерантность к близости — аспект 4
  area: A2
  family: F21
  definition: 'Я сказал, что понимаю: она видит меня сейчас как бы копией своей матери, и если это так, то меня особенно поражает
    то, что я стал похож на ее мать, как раз когда я попытался помочь ей в том, чтобы меньше опасаться сексуальной близости
    со своим другом.'
  clinical_observability: умеренный
  example_context: После обсуждения толерантность к близости пациент описывает переживания.
- id: B_A2_F21_006
  label: Толерантность к близости — аспект 5
  area: A2
  family: F21
  definition: Я ответил, что мне интересно, не восприняла ли она мои расспросы о ее страхах по поводу сексуальной близости
    с другом как косвенное внушение лечь с ним в постель, что делало меня сексуально соблазнительным мужчиной, как ей казалось,
    похожим на ее отца.
  clinical_observability: умеренный
  example_context: При обсуждения толерантность к близости пациент описывает переживания.
- id: B_A2_F22_001
  label: Ожидания взаимности
  area: A2
  family: F22
  definition: Черты, отражающие сверхзависимость от поддержки, любви и принятия со стороны окружающих, являются проявлением,
    как показывает психоаналитическое исследование, тенденции чувствовать чрезмерную вину перед другими людьми из- за бессознательной
    амбивалентности по отношению к любимым и необходимым объектам и быть гиперреакцией на фрустрацию, когда ожидания этих
    пациентов не оправдываются.
  clinical_observability: умеренный
  example_context: Когда такие пациенты не способны соответствовать собственным завышенным стандартам и нереалистичным ожиданиям,
    у них появляются клинические признаки депрессии.
- id: B_A2_F22_002
  label: Ожидания
  area: A2
  family: F22
  definition: В отличие от этого, на наиболее тяжелом уровне патологической влюбленности, проекция патологически грандиозного
    “Я” создает нарциссические ожидания, имеющие качества самопоражения и впечатляющие наблюдателя как глубоко мазохистские.
  clinical_observability: умеренный
  example_context: Когда я однажды сказал, что подозреваю его в краже одной мелочи, пропавшей из комнаты ожидания после его
    визита, он “признался”, что взял ее и позже вернул эту вещь.
- id: B_A2_F22_003
  label: Ожидания взаимности — аспект 2
  area: A2
  family: F22
  definition: Один из паттернов характеризуется качеством псевдогипермаскулинности, театральным преувеличением принятого в
    культуре маскулинного поведения, обычно с акцентом на независимости, и установку на доминирование и превосходство над
    женщинами в сочетании с детской надутостью, если эти ожидания не сбываются.
  clinical_observability: умеренный
  example_context: Когда обсуждения ожидания взаимности пациент описывает переживания.
- id: B_A2_F22_004
  label: Ожидания взаимности — аспект 3
  area: A2
  family: F22
  definition: Сценическая личность у женщин Эти пациентки демонстрируют эгоцентричное, самоизвиняющее поведение, которое может
    также сопровождаться сильной зависимостью от окружающих, но их льнущая зависимость не обнаруживает той взаимности, которая
    характерна для отношений при истерическом расстройстве личности.
  clinical_observability: умеренный
  example_context: В ходе обсуждения ожидания взаимности пациент описывает переживания.
- id: B_A2_F22_005
  label: Ожидания взаимности — аспект 4
  area: A2
  family: F22
  definition: Реалистические ожидания или торможения со стороны родительских объектов или обесцениваются, или преобразуются
    в персекуторные угрозы.
  clinical_observability: умеренный
  example_context: После обсуждения ожидания взаимности пациент описывает переживания.
- id: B_A2_F22_006
  label: Ожидания взаимности — аспект 5
  area: A2
  family: F22
  definition: перебила меня, возразив, что у любой матери возникнет страшное возмущение в ответ на такие ожидания ребенка.
  clinical_observability: умеренный
  example_context: При обсуждения ожидания взаимности пациент описывает переживания.
- id: B_A2_F23_001
  label: Стабильность отношений
  area: A2
  family: F23
  definition: Отто Кернберг также много сделал для внедрения теории объектных отношений Мелани Кляйн и других британских психоаналитиков
    в основанную на эго-психологии теорию и практику американского психоанализа.
  clinical_observability: умеренный
  example_context: После месяцев проработки этой парадигмы переноса появился новый аспект отношений г-жи А.
- id: B_A2_F23_002
  label: Стабильность
  area: A2
  family: F23
  definition: В третьей и четвертой частях книги я излагаю свою теорию эго- психологии — объектных отношений в ее приложении
    к клинической ситуации.
  clinical_observability: умеренный
  example_context: Пациент переживает перемену самосознания и своих внутренних отношений с окружающими и бывает удивлен характером
    своих переживаний — неожиданным для него и для его аналитика.
- id: B_A2_F23_003
  label: Стабильность отношений — аспект 2
  area: A2
  family: F23
  definition: '*** За тот вклад, который они внесли в мои размышления о теории объектных отношений, я благодарен докторам
    Сельме Крамер, Райнеру Краузе, Джозефу и Анне-Мари Сандлер, Эрнсту и Гертруде Тихо, а также Джону Сазерленду.'
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A2_F23_004
  label: Стабильность отношений — аспект 3
  area: A2
  family: F23
  definition: Пытаясь прояснить взаимоотношения между аффектами и настроениями, Якобсон (Jacobson1957b) определяет настроения
    как временную фиксацию и генерализацию аффектов по отношению ко всему миру интернализованных объектных отношений, т.е.
  clinical_observability: умеренный
  example_context: Примером служит случай одной нарциссической женщины с долгой историей эксплуататорских отношений с властными
    мужчинами и ведущей жизнь, свидетельствующую об эгоцентризме и самовозвеличивании.
- id: B_A2_F23_005
  label: Стабильность отношений — аспект 4
  area: A2
  family: F23
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: Терапевт создает гипотезу о природе примитивных, фантастических и диссоциированных объектных отношений,
    которые активизировались.
- id: B_A2_F23_006
  label: Стабильность отношений — аспект 5
  area: A2
  family: F23
  definition: Аффект и объект Я предполагаю, что раннее аффективное развитие основано на прямой фиксации ранних аффективно
    заряженных объектных отношений в форме аффективной памяти.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A2_F24_001
  label: Нарративная целостность идентичности
  area: A2
  family: F24
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности также имеют недостаточно интегрированную Я-концепцию, синдром
    диффузной идентичности.
- id: B_A2_F24_002
  label: Нарративная
  area: A2
  family: F24
  definition: По этой причине интерсубъективность, независимо от того, включается ли она в переживание себя или отвергается
    посредством проективных механизмов, является неотьемлемой частью развития нормальной идентичности.
  clinical_observability: умеренный
  example_context: После этого можно исследовать пациента на наличие синдрома диффузной идентичности.
- id: B_A2_F24_003
  label: Нарративная целостность
  area: A2
  family: F24
  definition: эмпатии с тем, что пациент не может в себе выносить и активирует посредством проективной идентификации — узнает
    о мире интернализованных объектных отношений пациента, составляющих часть идентичности его Эго.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной личностной организацией и сопутствующим синдромом диффузной идентичности обычно
    не могут глубоко интегрировать репрезентации значимых других.
- id: B_A2_F24_004
  label: Нарративная целостность идентичности — аспект 3
  area: A2
  family: F24
  definition: Эти пациенты также обнаруживают спутанность сексуальной идентичности, так что гомо- и гетеросексуальные взаимодействия
    становятся частью их половой жизни при ведущей организующей роли мазохистского сценария.
  clinical_observability: умеренный
  example_context: При этом мы ищем признаки диффузной идентичности в рассказах пациента о себе и своей социальной жизни.
- id: B_A2_F24_005
  label: Нарративная целостность идентичности — аспект 4
  area: A2
  family: F24
  definition: Первое — это истерическое расстройство личности, для которого характерно сравнительно сохранное чувство идентичности,
    способность к стабильным, дифференцированным, эмоционально богатым и эмпатичным отношениям с окружающими, включая способность
    выдерживать их амбивалентность и сложность, и преобладание защитных механизмов, основанных на вытеснении.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A2_F24_006
  label: Нарративная целостность идентичности — аспект 5
  area: A2
  family: F24
  definition: Сценическое расстройство личности входит в категорию пограничной организации личности; оно характеризуется синдромом
    размытой идентичности, тяжелой патологией объектных отношений и преобладанием примитивных защитных операций, основанных
    на расщеплении.
  clinical_observability: умеренный
  example_context: Когда происходит такое разрешение примитивного переноса, целостность эмоциональной сферы показывает, что
    производные влечений стали более интегрированными и дифференцированными.
- id: B_A3_F1_001
  label: Расщепление Я
  area: A3
  family: F1
  definition: Это расщепление происходит у пациентов, функционирующих на пограничном уровне, у нарциссических личностей и
    даже при доступных анализу психозах.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с расщепление я.
- id: B_A3_F1_002
  label: Расщепление
  area: A3
  family: F1
  definition: Конфликты не столько вытеснены, сколько проявляются во взаимно диссоциированных состояниях Эго, отражающих примитивную
    защиту — расщепление.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления расщепление я.
- id: B_A3_F1_003
  label: Расщепление Я — аспект 2
  area: A3
  family: F1
  definition: Как будто бы пациентка обнаружила новое расщепление между обычной человечностью, которая дремала в ней, и садистским,
    тираническим аспектом своей личности, доминировавшим в течение большей части ее жизни.
  clinical_observability: умеренный
  example_context: Когда обсуждения расщепление я пациент описывает переживания.
- id: B_A3_F1_004
  label: Расщепление Я — аспект 3
  area: A3
  family: F1
  definition: Эти психотические личности или аспекты личности демонстрируют преобладание крайне деструктивных импульсов, ненависти
    к реальности, выражаемых как разрушение способности пациента к осознанию реальности, проективную идентификацию и патологическое
    расщепление проецируемого материала на отдельные фрагменты, образующие “странные объекты”.
  clinical_observability: умеренный
  example_context: В ходе обсуждения расщепление я пациент описывает переживания.
- id: B_A3_F1_005
  label: Расщепление Я — аспект 4
  area: A3
  family: F1
  definition: Это примитивная диссоциация или расщепление между полностью хорошими и полностью плохими состояниями Эго, которое
    [диссоциацию или расщепление] пациент пытается поддерживать.
  clinical_observability: умеренный
  example_context: После обсуждения расщепление я пациент описывает переживания.
- id: B_A3_F1_006
  label: Расщепление Я — аспект 5
  area: A3
  family: F1
  definition: и должна поддерживать расщепление между своей параноидной реакцией на меня и своей идеализацией его, чтобы избежать
    психотического ощущения спутанности.
  clinical_observability: умеренный
  example_context: При обсуждения расщепление я пациент описывает переживания.
- id: B_A3_F2_001
  label: Расщепление объектов
  area: A3
  family: F2
  definition: Им разработана современная психоналитическая теория личности, вкратце заключающаяся в том, что “Я” человека
    состоит из различных репрезентаций (образов, проявлений) себя и своих объектов (прежде всего близких людей) и связывающих
    их аффективных состояний.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с расщепление объектов.
- id: B_A3_F2_002
  label: Расщепление
  area: A3
  family: F2
  definition: Якобсон также описала, как когнитивные аспекты аффектов соотносятся с их вкладом в репрезентации “Я” и объектов
    как в Эго, так и в Супер-Эго.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления расщепление объектов.
- id: B_A3_F2_003
  label: Расщепление объектов — аспект 2
  area: A3
  family: F2
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: Когда обсуждения расщепление объектов пациент описывает переживания.
- id: B_A3_F2_004
  label: Расщепление объектов — аспект 3
  area: A3
  family: F2
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: В ходе обсуждения расщепление объектов пациент описывает переживания.
- id: B_A3_F2_005
  label: Расщепление объектов — аспект 4
  area: A3
  family: F2
  definition: Сгущение и смещение как характеристики содержимого Ид отражают связь между аффективно окрашенными репрезентациями
    “Я” и объектов со сходной позитивной или негативной валентностью, образуя таким образом соответствующие агрессивные, либидинальные
    и, позднее, смешанные ряды.
  clinical_observability: умеренный
  example_context: После обсуждения расщепление объектов пациент описывает переживания.
- id: B_A3_F2_006
  label: Расщепление объектов — аспект 5
  area: A3
  family: F2
  definition: Первоначально в этих интернализациях еще отсутствует дифференциация между репрезентациями “Я” и объектов.
  clinical_observability: умеренный
  example_context: При обсуждения расщепление объектов пациент описывает переживания.
- id: B_A3_F3_001
  label: Переключение идеализации и обесценивания
  area: A3
  family: F3
  definition: Сознательное или бессознательное разрушение пациентом всех взаимоотношений, особенно терапевтических, должно
    постоянно прослеживаться, при этом терапевту следует полностью осознавать, что подобное прослеживание, возможно, вызовет
    переключение внешне “спокойных” психопатических отношений переноса на тяжело параноидные и активирует сильнейшую ненависть
    в переносе.
  clinical_observability: умеренный
  example_context: При клинических перверсиях они могут также служить функции создания “неосексуальности” (Mc Dougall, 1985),
    или избегания эдиповой ситуации путем идеализации преэдиповых сексуальных предшественников.
- id: B_A3_F3_002
  label: Переключение
  area: A3
  family: F3
  definition: Если произошло переключение переноса с преимущественно антисоциального на параноидный, показан обычный технический
    подход к тяжелым параноидным регрессиям, характер и способ применения которого я обсуждаю далее (гл.
  clinical_observability: умеренный
  example_context: Примитивная идеализация поверхности тела матери приводит к идеализации ребенком своего собственного тела
    путем ранней интроекции и примитивной идентификации с матерью.
- id: B_A3_F3_003
  label: Переключение идеализации
  area: A3
  family: F3
  definition: Наконец, консолидация патологически грандиозного “Я” в качестве части нарциссической структуры личности приводит
    к процессам идеализации, полностью отличным от нормального нарциссического функционирования в контексте интегрированной
    трехчленной психической структуры.
  clinical_observability: умеренный
  example_context: При работе с пациентами с организованной мазохистической перверсией одной из ранних задач терапии является
    анализ защитных аспектов идеализации ими своего сексуального мазохизма.
- id: B_A3_F3_004
  label: Переключение идеализации и обесценивания — аспект 3
  area: A3
  family: F3
  definition: Кроме того, при нарциссических расстройствах личности преобладают защитные механизмы грандиозности и всемогущества,
    проективной идентификации, идеализации и обесценивания, тогда как при истерических расстройствах личности представлены
    защитные механизмы высокого уровня.
  clinical_observability: умеренный
  example_context: Когда преобладает скорее маниакальная, чем депрессивная симптоматика, опасность проглядеть суицидальный
    потенциал еще выше, поскольку переключение на депрессивную фазу может произойти внезапно.
- id: B_A3_F3_005
  label: Переключение идеализации и обесценивания — аспект 4
  area: A3
  family: F3
  definition: В этом мире, напоминающем “1984” Джорджа Оруэлла (Orwell, 1949), агрессия является преобладающей, но непредсказуемой,
    и эта непредсказуемость предрешает подчинение садистскому тирану и препятствует пациенту в идеализации садистской системы
    ценностей агрессора.
  clinical_observability: умеренный
  example_context: После обсуждения переключение идеализации и обесценивания пациент описывает переживания.
- id: B_A3_F3_006
  label: Переключение идеализации и обесценивания — аспект 5
  area: A3
  family: F3
  definition: Такая невозможность достигнуть какой-либо идеализации объектов отличает антисоциальную личность как таковую
    от “самооправдывающейся” агрессии пациентов со злокачественным нарциссизмом, которые по крайней мере нашли некоторую возможность
    сочетания садизма и идеализации, идентифицируя себя с идеализированным, жестоким тираном.
  clinical_observability: умеренный
  example_context: При обсуждения переключение идеализации и обесценивания пациент описывает переживания.
- id: B_A3_F4_001
  label: Аффективная диссоциация
  area: A3
  family: F4
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: В ходе лечения первоначальная диссоциация между грубой агрессией и самоагрессией, с одной стороны, и поверхностным
    дружелюбием, с другой, была постепенно преодолена.
- id: B_A3_F4_002
  label: Аффективная
  area: A3
  family: F4
  definition: Подобная диссоциация различных компонентов аффектов с защитными целями может производить впечатление, что субъективное
    переживание аффектов отделено от их когнитивных, поведенческих, коммуникативных аспектов, особенно на начальных стадиях
    лечения, когда сопротивление наиболее сильно.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления аффективная диссоциация.
- id: B_A3_F4_003
  label: Аффективная диссоциация — аспект 2
  area: A3
  family: F4
  definition: Такая защитная диссоциация, похоже, иллюстрирует традиционную психологическую точку зрения, что аффект, восприятие,
    познание и действие — это отдельные функции Эго.
  clinical_observability: умеренный
  example_context: Когда обсуждения аффективная диссоциация пациент описывает переживания.
- id: B_A3_F4_004
  label: Аффективная диссоциация — аспект 3
  area: A3
  family: F4
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
  example_context: В ходе обсуждения аффективная диссоциация пациент описывает переживания.
- id: B_A3_F4_005
  label: Аффективная диссоциация — аспект 4
  area: A3
  family: F4
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: После обсуждения аффективная диссоциация пациент описывает переживания.
- id: B_A3_F4_006
  label: Аффективная диссоциация — аспект 5
  area: A3
  family: F4
  definition: Аффективная доминанта сдвигается с другой темы на сам перенос, и это требует от аналитика фокусировки своих
    интерпретаций на переносе, перед тем как переходить к другой теме.
  clinical_observability: умеренный
  example_context: При обсуждения аффективная диссоциация пациент описывает переживания.
- id: B_A3_F5_001
  label: Проекция
  area: A3
  family: F5
  definition: В отличие от этого, на наиболее тяжелом уровне патологической влюбленности, проекция патологически грандиозного
    “Я” создает нарциссические ожидания, имеющие качества самопоражения и впечатляющие наблюдателя как глубоко мазохистские.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с проекция.
- id: B_A3_F5_002
  label: Проекция — аспект 1
  area: A3
  family: F5
  definition: демонстрировал быстрое и почти хаотичное чередование “Я”- и объект-репрезентаций в своих идентификациях со мной
    и своих проекциях на меня, отражающих также и различные аффективные состояния.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления проекция.
- id: B_A3_F5_003
  label: Проекция — аспект 2
  area: A3
  family: F5
  definition: Его длительная проекция материнских запретительных установок на жену по отношению к любым проявлениям сексуальности
    исчезла.
  clinical_observability: умеренный
  example_context: Когда обсуждения проекция пациент описывает переживания.
- id: B_A3_F5_004
  label: Проекция — аспект 3
  area: A3
  family: F5
  definition: А проекция защитного чувства фрагментации г-жи Ж.
  clinical_observability: умеренный
  example_context: В ходе обсуждения проекция пациент описывает переживания.
- id: B_A3_F5_005
  label: Проекция — аспект 4
  area: A3
  family: F5
  definition: 'ПРОЕКЦИЯ И ПРОЕКТИВНАЯ ИДЕНТИФИКАЦИЯ: РАЗВИТИЕ И КЛИНИЧЕСКИЕ АСПЕКТЫ Термин проективная идентификация, первоначально
    описанный Мелани Кляйн (Klein, 1946, 1955) и развитый Розенфельдом (Rosenfeld, 1965) и Бионом (Bion, 1968), как и другие
    психоаналитические понятия, стал расплываться, поскольку его по-разному определяли разные авторы.'
  clinical_observability: умеренный
  example_context: После обсуждения проекция пациент описывает переживания.
- id: B_A3_F5_006
  label: Проекция — аспект 5
  area: A3
  family: F5
  definition: Проекция как таковая — это более зрелая форма защиты, состоящая, во- первых, из вытеснения невыносимого переживания,
    проецирования его затем на объект и, наконец, отделения и дистанцирования себя от объекта, чтобы укрепить защитные усилия.
  clinical_observability: умеренный
  example_context: При обсуждения проекция пациент описывает переживания.
- id: B_A3_F6_001
  label: Проективная идентификация
  area: A3
  family: F6
  definition: Под завистью к объекту и потребностью уничтожить и испортить все хорошее, что может исходить из контактов с
    ним, лежит бессознательная идентификация с первоначально ненавистным — и необходимым — объектом.
  clinical_observability: умеренный
  example_context: Принятие мной комплементарной идентификации в своем контрпереносе было не таким регрессивным проявлением
    с моей стороны, как менее реалистическая контридентификация, упомянутая в связи с г-жой Л.
- id: B_A3_F6_002
  label: Проективная
  area: A3
  family: F6
  definition: Идентификация с предающим объектом приводит на путь мстительного разрушения всех объектных отношений.
  clinical_observability: умеренный
  example_context: При психозе преобладают психотические идентификации, в том числе психотические интроекции и проективная
    идентификация.
- id: B_A3_F6_003
  label: Проективная идентификация — аспект 2
  area: A3
  family: F6
  definition: Следующим шагом является идентификация с объектом, дающая субъекту чувство силы, свободы от страха и ощущения,
    что единственный путь к вступлению в отношения с другими людьми — это удовлетворение собственной агрессии.
  clinical_observability: умеренный
  example_context: Причинение боли другому и идентификация с его эротическим удовольствием от боли есть эротический садизм
    — противоположная сторона эротического мазохизма.
- id: B_A3_F6_004
  label: Проективная идентификация — аспект 3
  area: A3
  family: F6
  definition: Альтернативным путем является принятие фальшивого, циничного способа общения, полностью отрицающего важность
    объектных отношений, превращение в невинного наблюдателя, а не идентификация с жестоким тираном или мазохистское подчинение
    ему.
  clinical_observability: умеренный
  example_context: Примитивные формы проекции, в частности проективная идентификация.
- id: B_A3_F6_005
  label: Проективная идентификация — аспект 4
  area: A3
  family: F6
  definition: “Идентификация с агрессором”, также иллюстрируемая моим примером и теперь понимаемая как последовательная идентификация
    и с “Я”, и с объектом, демонстрирует превращение пассивного импульса в активный.
  clinical_observability: умеренный
  example_context: Когда же пациент рационализирует свою “контрагрессию” как следствие агрессии окружающих, проективная идентификация
    осложняется вторичной рационализацией.
- id: B_A3_F6_006
  label: Проективная идентификация — аспект 5
  area: A3
  family: F6
  definition: Выражение импульса, направленного на “Я”, в противоположность выражению такого импульса, направленного на объект,
    может также пониматься как идентификация с нападающим объектом.
  clinical_observability: умеренный
  example_context: Примитивные же формы проекции, в частности проективная идентификация, есть мощное межличностное оружие,
    с помощью которого можно “перевалить” агрессию на аналитика.
- id: B_A3_F7_001
  label: Индукция ролей в отношениях
  area: A3
  family: F7
  definition: По мере накопления клинического опыта и развития теоретических концепций о ранних отношениях ребенка и матери,
    переносе/контрпереносе, объектных отношениях, аналитической ситуации и т.п.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A3_F7_002
  label: Индукция
  area: A3
  family: F7
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A3_F7_003
  label: Индукция ролей
  area: A3
  family: F7
  definition: Нам необходимо найти такую мотивационную организацию, которая позволит обосновать всю сложную интеграцию аффективного
    развития во взаимоотношениях с родительскими фигурами.
  clinical_observability: умеренный
  example_context: Пациентка двадцати с небольшим лет была “в чудесных отношениях” со своим психотерапевтом в госпитале, с
    которым обсуждала свои детские переживания.
- id: B_A3_F7_004
  label: Индукция ролей в отношениях — аспект 3
  area: A3
  family: F7
  definition: Эти функции включают сдвиг с интереса к телесным функциям на интерес к социальным функциям и разыгрыванию ролей.
  clinical_observability: умеренный
  example_context: В ходе обсуждения индукция ролей в отношениях пациент описывает переживания.
- id: B_A3_F7_005
  label: Индукция ролей в отношениях — аспект 4
  area: A3
  family: F7
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: После обсуждения индукция ролей в отношениях пациент описывает переживания.
- id: B_A3_F7_006
  label: Индукция ролей в отношениях — аспект 5
  area: A3
  family: F7
  definition: Оно представляет собой интрапсихическую структуру высшего порядка, природа которой подтверждается в поведении,
    выражается в формировании характера и в человеческой глубине и моральной определенности в отношениях с другими людьми.
  clinical_observability: умеренный
  example_context: При обсуждения индукция ролей в отношениях пациент описывает переживания.
- id: B_A3_F8_001
  label: Проективное управление объектом
  area: A3
  family: F8
  definition: Разнообразие аффективных состояний, связанных с одним и тем же объектом, обеспечивает нам экономическое обоснование
    того обстоятельства, как аффекты увязываются и преобразуются в занимающие более высокое положение мотивационнные ряды,
    которые становятся сексуальным или агрессивным влечением.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с проективное управление объектом.
- id: B_A3_F8_002
  label: Проективное
  area: A3
  family: F8
  definition: Бешеное усилие воли направляется на восстановление состояния нарциссического равновесия; этот акт самопринуждения
    представляет собой бессознательную идентификацию с идеализированным полностью хорошим объектом.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления проективное управление объектом.
- id: B_A3_F8_003
  label: Проективное управление
  area: A3
  family: F8
  definition: Эта форма ненависти иногда выражает себя в самоубийстве, когда “Я” идентифицируется с ненавидимым объектом и
    самоуничтожение — единственный путь устранения объекта.
  clinical_observability: умеренный
  example_context: Когда обсуждения проективное управление объектом пациент описывает переживания.
- id: B_A3_F8_004
  label: Проективное управление объектом — аспект 3
  area: A3
  family: F8
  definition: В отличие от вышеупомянутой всеобъемлющей формы ненависти для садизма характерно желание не уничтожать объект,
    а поддерживать отношения с ненавистным объектом в форме отыгрывания объектных отношений между активным садистом и его
    парализованной жертвой.
  clinical_observability: умеренный
  example_context: В ходе обсуждения проективное управление объектом пациент описывает переживания.
- id: B_A3_F8_005
  label: Проективное управление объектом — аспект 4
  area: A3
  family: F8
  definition: Еще более мягкая форма ненависти проявляется в страстном желании доминировать над объектом, обладать властью
    над ним, что тоже может включать в себя садистские компоненты, но при этом нападки на объект ограничены требованием подчинения,
    что подразумевает подтверждение свободы и автономии субъекта.
  clinical_observability: умеренный
  example_context: После обсуждения проективное управление объектом пациент описывает переживания.
- id: B_A3_F8_006
  label: Проективное управление объектом — аспект 5
  area: A3
  family: F8
  definition: Под завистью к объекту и потребностью уничтожить и испортить все хорошее, что может исходить из контактов с
    ним, лежит бессознательная идентификация с первоначально ненавистным — и необходимым — объектом.
  clinical_observability: умеренный
  example_context: При обсуждения проективное управление объектом пациент описывает переживания.
- id: B_A3_F9_001
  label: Примитивная идеализация
  area: A3
  family: F9
  definition: Эротическая идеализация, отражающая проекцию Эго-идеала, приводит совсем к другим результатам по сравнению с
    эротической идеализацией, отражающей проекцию патологически грандиозного “Я”.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A3_F9_002
  label: Примитивная
  area: A3
  family: F9
  definition: Самоидеализация, в фантазии связанная с мазохистской патологической влюбленностью, может рассматриваться в качестве
    примера нарциссических последствий [действия] нижележащей мазохистской структуры.
  clinical_observability: умеренный
  example_context: Примитивная ненависть на постоянно интенсивном уровне создает, однако, круговую реакцию, которая не только
    поддерживает, но и патологически усиливает саму ненависть.
- id: B_A3_F9_003
  label: Примитивная идеализация — аспект 2
  area: A3
  family: F9
  definition: Так примитивная патология Супер-Эго и патология любых других интернализованных объектных отношений подкрепляют
    друг друга.
  clinical_observability: умеренный
  example_context: Примитивная идеализация поверхности тела матери приводит к идеализации ребенком своего собственного тела
    путем ранней интроекции и примитивной идентификации с матерью.
- id: B_A3_F9_004
  label: Примитивная идеализация — аспект 3
  area: A3
  family: F9
  definition: Другими словами, то, что я описывал как свою толерантность к ее регрессивному состоянию без преждевременного
    интерпретативного вмешательства, она переживала как защиту от меня, как будто угрожающая примитивная мать пыталась отгородить
    ее от меня.
  clinical_observability: умеренный
  example_context: Примитивная идеализация.
- id: B_A3_F9_005
  label: Примитивная идеализация — аспект 4
  area: A3
  family: F9
  definition: Проективная идентификация, таким образом, это примитивная защитная операция, но она не обязательно связана с
    психозом.
  clinical_observability: умеренный
  example_context: Примитивная идеализация создает оторванные от реальности образы доброты и всемогущества.
- id: B_A3_F9_006
  label: Примитивная идеализация — аспект 5
  area: A3
  family: F9
  definition: В другой области защит примитивная интроекция (когда субъект не способен дифференцировать Я- и объект-репрезентации)
    может рассматриваться в качестве предшественницы проекций, которые возникают в связи с идентификационными характеристиками
    более развитых стадий развития Эго и Супер-Эго.
  clinical_observability: умеренный
  example_context: Примитивная природа переноса пограничного пациента развивает у стремящегося чувствовать эмпатию терапевта
    способность осознавать собственные примитивные эмоциональные реакции.
- id: B_A3_F10_001
  label: Примитивное обесценивание
  area: A3
  family: F10
  definition: Так что примитивное превращение ее страха потери границ “Я” в чувство, что физическая энергия изымается из ее
    тела (т.е.
  clinical_observability: умеренный
  example_context: Пациентам, относящимся к категориям (3) и (4), кроме отличий от (1) и (2), о которых мы сказали, с самого
    начала свойственны грандиозность и обесценивание.
- id: B_A3_F10_002
  label: Примитивное
  area: A3
  family: F10
  definition: В дополнение к этому я считаю, что существует необоснованное неявное обесценивание в области психоаналитической
    психотерапии тех глубоких изменений, к которым может привести создание особой терапевтической среды (например, при умелом
    психотерапевтическом ведении некоторых хронических больных шизофренией).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления примитивное обесценивание.
- id: B_A3_F10_003
  label: Примитивное обесценивание — аспект 2
  area: A3
  family: F10
  definition: На основе прошлого опыта, однако, я остался убежден, что именно это и происходило, и что его яростное обесценивание
    моих интерпретаций отражало завистливое разрушение того, что он получает от меня.
  clinical_observability: умеренный
  example_context: Когда обсуждения примитивное обесценивание пациент описывает переживания.
- id: B_A3_F10_004
  label: Примитивное обесценивание — аспект 3
  area: A3
  family: F10
  definition: Однако обесценивание матерью мужчин и гениталий ее маленького сына может радикально влиять на сексуальное восприятие
    и конфликты ее детей обоих полов.
  clinical_observability: умеренный
  example_context: В ходе обсуждения примитивное обесценивание пациент описывает переживания.
- id: B_A3_F10_005
  label: Примитивное обесценивание — аспект 4
  area: A3
  family: F10
  definition: Обесценивание женской сексуальности и отрицание потребности в зависимости от женщины присоединяется к неспособности
    поддерживать глубокую личностную и сексуальную вовлеченность при отношениях с женщинами.
  clinical_observability: умеренный
  example_context: После обсуждения примитивное обесценивание пациент описывает переживания.
- id: B_A3_F10_006
  label: Примитивное обесценивание — аспект 5
  area: A3
  family: F10
  definition: Оральные компоненты зависти к пенису доминируют у женщин с нарциссической личностной структурой — отсюда их
    мстительное обесценивание мужчин и женщин.
  clinical_observability: умеренный
  example_context: При обсуждения примитивное обесценивание пациент описывает переживания.
- id: B_A3_F11_001
  label: Отрицание
  area: A3
  family: F11
  definition: Отвержение со стороны такого мужчины вызывало тяжелую депрессию, попытки суицида или отрицание того, что она
    была отвергнута.
  clinical_observability: умеренный
  example_context: Пациент сперва пытался отрицать, что то, что происходит между нами, имеет какое-то отношение к его мачехе,
    но его отрицание было достаточно слабым и безрезультатным.
- id: B_A3_F11_002
  label: Отрицание — аспект 1
  area: A3
  family: F11
  definition: Но когда я пытался поделиться этой идеей с г-жой Н., ее возбуждение, отрицание и ужас возрастали.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления отрицание.
- id: B_A3_F11_003
  label: Отрицание — аспект 2
  area: A3
  family: F11
  definition: В терминах Сирлза (Searles, 1961), терапевт способствует превращению состояний “вне контакта” в примитивные
    переносы на любом уровне регрессии, в рамках которых примитивные защитные операции — в частности, проективная идентификация,
    психотическая интроекция, всемогущий контроль, крайние формы расщепления или фрагментации и отрицание — становятся преобладающими.
  clinical_observability: умеренный
  example_context: Когда обсуждения отрицание пациент описывает переживания.
- id: B_A3_F11_004
  label: Отрицание — аспект 3
  area: A3
  family: F11
  definition: Если же остаются существенные возможности для идеализированных отношений, позволяющие установить как идеализированные,
    так и преследующие объектные отношения, то идеализация самого себя и нарциссическое отрицание потребностей в зависимости
    может стать путем развития, альтернативным параноидным страхам.
  clinical_observability: умеренный
  example_context: В ходе обсуждения отрицание пациент описывает переживания.
- id: B_A3_F11_005
  label: Отрицание — аспект 4
  area: A3
  family: F11
  definition: Согласно ее взглядам, всемогущее отрицание различий между полами и между поколениями и всемогущее уравнивание
    гомосексуальности и гетеросексуальности при множественных полиморфных перверсных сексуальных действиях отражает перверсное
    разрушение объектных отношений посредством их анализации.
  clinical_observability: умеренный
  example_context: После обсуждения отрицание пациент описывает переживания.
- id: B_A3_F11_006
  label: Отрицание — аспект 5
  area: A3
  family: F11
  definition: В-четвертых, отрицание различий между полами и поколениями и идеализация прегенитального, перверсного, частичного
    влечения сопровождаются расщеплением, позволяющим в то же время постоянно осознавать реальность.
  clinical_observability: умеренный
  example_context: При обсуждения отрицание пациент описывает переживания.
- id: B_A3_F12_001
  label: Всемогущество
  area: A3
  family: F12
  definition: 'И я, и Клара сильно сопротивлялись этой рекомендации: я думал, что это подкрепит операции расщепления у Ральфа
    и усилит как его регрессивное всемогущество, так и более глубокие страхи деструктивных последствий своей агрессии.'
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с всемогущество.
- id: B_A3_F12_002
  label: Всемогущество — аспект 1
  area: A3
  family: F12
  definition: Она отражает попытку продемонстрировать садистский контроль и всемогущество патологически грандиозного “Я” при
    злокачественном нарциссизме и является выражением “безумной” (Rosenfeld, 1971, 1975), грандиозной структуры “Я”, вызывающей
    наиболее тяжелые негативные терапевтические реакции.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления всемогущество.
- id: B_A3_F12_003
  label: Всемогущество — аспект 2
  area: A3
  family: F12
  definition: Механизм примитивной диссоциации, то есть расщепление и связанные с ним защитные механизмы примитивной идеализации,
    примитивные формы проекции (в частности, проективная идентификация), отрицание, всемогущество и обесценивание, можно выявить
    при диагностическом взаимодействии пациента с терапевтом.
  clinical_observability: умеренный
  example_context: Когда обсуждения всемогущество пациент описывает переживания.
- id: B_A3_F12_004
  label: Всемогущество — аспект 3
  area: A3
  family: F12
  definition: Это можно увидеть во время диагностического интервью, когда терапевт воспринимается пациентом как идеальный
    человек, облеченный всемогуществом, как некое божество, на которое пациент возлагает нереалистичные надежды.
  clinical_observability: умеренный
  example_context: В ходе обсуждения всемогущество пациент описывает переживания.
- id: B_A3_F12_005
  label: Всемогущество — аспект 4
  area: A3
  family: F12
  definition: Как всемогущество, так и обесценивание являются производными защитных операций расщепления, направленных на
    Я- и объект- репрезентации.
  clinical_observability: умеренный
  example_context: После обсуждения всемогущество пациент описывает переживания.
- id: B_A3_F12_006
  label: Всемогущество — аспект 5
  area: A3
  family: F12
  definition: Всемогущество и обесценивание проявляется в том, как пациент описывает значимых других, и в его поведении при
    взаимодействии с терапевтом.
  clinical_observability: умеренный
  example_context: При обсуждения всемогущество пациент описывает переживания.
- id: B_A3_F13_001
  label: Магическое мышление
  area: A3
  family: F13
  definition: Субъективность также подразумевает мышление и поэтому требует, как минимум, способности манипулировать символами.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с магическое мышление.
- id: B_A3_F13_002
  label: Магическое
  area: A3
  family: F13
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления магическое мышление.
- id: B_A3_F13_003
  label: Магическое мышление — аспект 2
  area: A3
  family: F13
  definition: Имеющее характер мести разрушение этого плохого объекта направлено на магическое восстановление абсолютно хорошего,
    но процесс мести ведет к разрушению самой способности “Я” к отношениям с объектом.
  clinical_observability: умеренный
  example_context: Когда обсуждения магическое мышление пациент описывает переживания.
- id: B_A3_F13_004
  label: Магическое мышление — аспект 3
  area: A3
  family: F13
  definition: Только после Джонсона и Шурека (Johnson, 1949; Johnson and Szurek, 1952), описавших пробелы в Супер-Эго, психоаналитическое
    мышление стало обращать внимание на структурные, а не на динамические аспекты антисоциальных личностей.
  clinical_observability: умеренный
  example_context: В ходе обсуждения магическое мышление пациент описывает переживания.
- id: B_A3_F13_005
  label: Магическое мышление — аспект 4
  area: A3
  family: F13
  definition: И не аналогичная ли путаница нарушает также и мышление аналитика?
  clinical_observability: умеренный
  example_context: После обсуждения магическое мышление пациент описывает переживания.
- id: B_A3_F13_006
  label: Магическое мышление — аспект 5
  area: A3
  family: F13
  definition: Можно спекулировать по поводу того, что если бы я не так боялся активации своих сексуальных фантазий о ней и
    в то же самое время осознавал ее нарциссичекую соблазнительность, то я мог бы выдерживать свои сексуальные фантазии, оставаться
    бдительным к соблазняющему поведению Лусии и сохранять контроль над своим независимым мышлением.
  clinical_observability: умеренный
  example_context: При обсуждения магическое мышление пациент описывает переживания.
- id: B_A3_F14_001
  label: Вытеснение
  area: A3
  family: F14
  definition: Вытеснение пиковых аффективных переживаний, имеющих приятный характер — в особенности состояний сексуального
    возбуждения, связанных с неприемлемыми фантазиями, включающими родительские объекты, — идет вслед за более ранними агрессивными
    желаниями и фантазиями динамического бессознательного.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с вытеснение.
- id: B_A3_F14_002
  label: Вытеснение — аспект 1
  area: A3
  family: F14
  definition: В сексуальной жизни сценической личности существует меньше особенностей, связанных с вытеснением, но гораздо
    больше общих диссоциативных особенностей, таких как чередование противоречивых сексуальных фантазий и поведения (выражающихся
    в полиморфной инфантильной сексуальности).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления вытеснение.
- id: B_A3_F14_003
  label: Вытеснение — аспект 2
  area: A3
  family: F14
  definition: Взгляд с точки зрения развития Я предполагаю, что линия развития защит ведет от проективной идентификации, основанной
    на структуре Эго, которая образуется благодаря расщеплению (примитивной диссоциации) как главной присущей этой структуре
    защите, к проекции, основанной на структуре Эго, образованной вытеснением как базовой защитой.
  clinical_observability: умеренный
  example_context: Когда обсуждения вытеснение пациент описывает переживания.
- id: B_A3_F14_004
  label: Вытеснение — аспект 3
  area: A3
  family: F14
  definition: Ее вытеснение и проекция сексуальных чувств в переносе уменьшились, и появились прямые эдиповы фантазии обо
    мне.
  clinical_observability: умеренный
  example_context: В ходе обсуждения вытеснение пациент описывает переживания.
- id: B_A3_F14_005
  label: Вытеснение — аспект 4
  area: A3
  family: F14
  definition: Вытеснение и проекция были доминирующими защитами, в дополнение к другим типичным невротическим защитам, таким
    как интеллектуализация, реактивные образования и возражение.
  clinical_observability: умеренный
  example_context: После обсуждения вытеснение пациент описывает переживания.
- id: B_A3_F14_006
  label: Вытеснение — аспект 5
  area: A3
  family: F14
  definition: Короче говоря, в этой формулировке перверсии характеризуются регрессивной анализацией, отрицанием различий между
    полами и поколениями, защитной идеализацией анальности, упорным признанием реальности и расщеплением (как отрицанием,
    так и признанием половых различий), накладывающимся на вытеснение.
  clinical_observability: умеренный
  example_context: При обсуждения вытеснение пациент описывает переживания.
- id: B_A3_F15_001
  label: Интеллектуализация
  area: A3
  family: F15
  definition: Вытеснение и проекция были доминирующими защитами, в дополнение к другим типичным невротическим защитам, таким
    как интеллектуализация, реактивные образования и возражение.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с интеллектуализация.
- id: B_A3_F15_002
  label: Интеллектуализация — аспект 1
  area: A3
  family: F15
  definition: Невротические защиты (такие, как рационализация, интеллектуализация и отвержение) могут ослабить эмоциональную
    интроспекцию даже у пациентов с твердой Эго-идентичностью и блестящей проверкой реальности.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интеллектуализация.
- id: B_A3_F15_003
  label: Интеллектуализация — аспект 2
  area: A3
  family: F15
  definition: Вытеснение и другие защиты сравнительно высокого уровня — такие как формирование реакции, изоляция, уничтожение
    (undoing), интеллектуализация и рационализация, — оберегают Эго от интрапсихического конфликта путем отторжения влечения,
    всех связанных с ним действий и представлений от сознательного Эго.
  clinical_observability: умеренный
  example_context: Когда обсуждения интеллектуализация пациент описывает переживания.
- id: B_A3_F15_004
  label: Интеллектуализация — аспект 3
  area: A3
  family: F15
  definition: Не всякое интеллектуальное знание есть “интеллектуализация”; настоящее знание усиливает эмоциональный рост и
    сопутствует ему.
  clinical_observability: умеренный
  example_context: В ходе обсуждения интеллектуализация пациент описывает переживания.
- id: B_A3_F15_005
  label: Интеллектуализация — аспект 4
  area: A3
  family: F15
  definition: Ситуация сильно отличается от работы с обсессивным пациентом, которому интеллектуализация, рационализация, реактивное
    образование или другие защиты высшего уровня мешают выражать эмоции, при том, что сам пациент глубоко погружен в перенос.
  clinical_observability: умеренный
  example_context: После обсуждения интеллектуализация пациент описывает переживания.
- id: B_A3_F15_006
  label: Интеллектуализация — аспект 5
  area: A3
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Интеллектуализация» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения интеллектуализация пациент описывает переживания.
- id: B_A3_F16_001
  label: Рационализация
  area: A3
  family: F16
  definition: Ненависть также укоренена в характере, что выражается в мощных рационализациях и соответствующих искажениях
    деятельности Эго и Супер-Эго.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с рационализация.
- id: B_A3_F16_002
  label: Рационализация — аспект 1
  area: A3
  family: F16
  definition: Конкурентность этих женщин по отношению к мужчинам и женщинам принимает преимущественно интеллектуальную форму,
    придавая псевдообсессивный характер их рационализациям и использованию интеллектуализации.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления рационализация.
- id: B_A3_F16_003
  label: Рационализация — аспект 2
  area: A3
  family: F16
  definition: Я думаю, что не следует включать в перенос в качестве его части действительные аспекты поведения аналитика,
    которые запускают перенос пациента или служат его рационализациями.
  clinical_observability: умеренный
  example_context: Когда обсуждения рационализация пациент описывает переживания.
- id: B_A3_F16_004
  label: Рационализация — аспект 3
  area: A3
  family: F16
  definition: Такая зыбкая рационализация ее решения начать у меня лечение скоро обратилась для нее в источник огромной тревоги,
    поскольку она начала бояться, что я стану сильно завидовать ее способности к рисованию и это будет угрожать ее лечению
    у меня.
  clinical_observability: умеренный
  example_context: В ходе обсуждения рационализация пациент описывает переживания.
- id: B_A3_F16_005
  label: Рационализация — аспект 4
  area: A3
  family: F16
  definition: Это является той основой, на которой самоизвиняющая групповая идеология, предлагаемая нарциссическим лидером,
    и рационализация агрессии, обеспечиваемая параноидным лидером, подкрепляют моральное разложение регрессивных больших групп.
  clinical_observability: умеренный
  example_context: После обсуждения рационализация пациент описывает переживания.
- id: B_A3_F16_006
  label: Рационализация — аспект 5
  area: A3
  family: F16
  definition: Невротические защиты (такие, как рационализация, интеллектуализация и отвержение) могут ослабить эмоциональную
    интроспекцию даже у пациентов с твердой Эго-идентичностью и блестящей проверкой реальности.
  clinical_observability: умеренный
  example_context: При обсуждения рационализация пациент описывает переживания.
- id: B_A3_F17_001
  label: Реактивные образования
  area: A3
  family: F17
  definition: Дуалистическая теория влечений — сексуальности и агрессивности (Freud, 1920) — представляет собой его окончательную
    классификацию влечений как глубинных источников бессознательного психического конфликта и образования психических структур.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с реактивные образования.
- id: B_A3_F17_002
  label: Реактивные
  area: A3
  family: F17
  definition: Более того, аффект в психоаналитической ситуации либо отражает, либо дополняет реактивные внутренние объектные
    отношения.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления реактивные образования.
- id: B_A3_F17_003
  label: Реактивные образования — аспект 2
  area: A3
  family: F17
  definition: Однако все невротические характерологические образования имеют такую нарциссическую функцию; здесь нет исключительной
    связи между мазохизмом и нарциссизмом.
  clinical_observability: умеренный
  example_context: Когда обсуждения реактивные образования пациент описывает переживания.
- id: B_A3_F17_004
  label: Реактивные образования — аспект 3
  area: A3
  family: F17
  definition: Я также нахожу полезной мысль Фэйрберна (Fairbairn, 1954) об установлении “моральной защиты от плохих объектов”
    в форме внутрипсихического преобразования интернализованных отношений с плохими первичными объектами.
  clinical_observability: умеренный
  example_context: В ходе обсуждения реактивные образования пациент описывает переживания.
- id: B_A3_F17_005
  label: Реактивные образования — аспект 4
  area: A3
  family: F17
  definition: на описанных Фрейдом (Freud, 1916) “преступниках из [бессознательного] чувства вины”, приводил к интерпретации
    антисоциального поведения (наивной, как я теперь думаю) как реактивного образования против бессознательной вины, а не
    как проявления дефицита в развитии Супер-Эго.
  clinical_observability: умеренный
  example_context: После обсуждения реактивные образования пациент описывает переживания.
- id: B_A3_F17_006
  label: Реактивные образования — аспект 5
  area: A3
  family: F17
  definition: Структурные изменения традиционно определяются как существенные изменения бессознательных интрапсихических конфликтов,
    лежащих в основе образования симптомов.
  clinical_observability: умеренный
  example_context: При обсуждения реактивные образования пациент описывает переживания.
- id: B_A3_F18_001
  label: Изоляция аффекта
  area: A3
  family: F18
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A3_F18_002
  label: Изоляция
  area: A3
  family: F18
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A3_F18_003
  label: Изоляция аффекта — аспект 2
  area: A3
  family: F18
  definition: Фрейд понимал влечение как переход между физическим и психическим, как психический процесс, укорененный в биологии;
    он предполагал (Freud, 1915b, 1915c), что единственный способ, с помощью которого мы можем узнать о влечениях, это обращение
    к их психическим реперезентациям — идеям и аффектам.
  clinical_observability: умеренный
  example_context: Когда обсуждения изоляция аффекта пациент описывает переживания.
- id: B_A3_F18_004
  label: Изоляция аффекта — аспект 3
  area: A3
  family: F18
  definition: 3Рапапорт (Rapaport, 1953) описывает, как с течением времени у Фрейда менялось представление об аффектах.
  clinical_observability: умеренный
  example_context: В ходе обсуждения изоляция аффекта пациент описывает переживания.
- id: B_A3_F18_005
  label: Изоляция аффекта — аспект 4
  area: A3
  family: F18
  definition: Аффекты и влечения В первой теории аффектов Фрейда понятия аффекта и влечения были практически взаимозаменимы.
  clinical_observability: умеренный
  example_context: После обсуждения изоляция аффекта пациент описывает переживания.
- id: B_A3_F18_006
  label: Изоляция аффекта — аспект 5
  area: A3
  family: F18
  definition: Аффекты, постулировал Фрейд, являются процессами разрядки, которые могут достигать сознания, но не подвержены
    вытеснению; только психические реперезентации влечений вытесняются вместе с памятью о чем-либо или склонностью к возникновению
    соответствующего аффекта (Freud, 1915b,1915c).
  clinical_observability: умеренный
  example_context: При обсуждения изоляция аффекта пациент описывает переживания.
