- id: B_A7_F1_001
  label: Эмпатия
  area: A7
  family: F1
  definition: Контрперенос, эмпатия, память и желание Свои взгляды на контрперенос я уже высказал в предыдущих работах (1975,
    1984).
  clinical_observability: умеренный
  example_context: Терапевтическая эмпатия, таким образом, выходит за 82 рамки обыкновенного общения людей.
- id: B_A7_F1_002
  label: Эмпатия — аспект 1
  area: A7
  family: F1
  definition: Как я подчеркивал в одной из предыдущих работ (1975), эмпатия поэтому должна включать не только конкордантную
    идентификацию с эго-синтонным, центральным субъективным переживанием пациента, но также и комплементарную идентификацию
    с диссоциированным, вытесненным или проецируемым аспектом Я- концепции пациента или его объект-репрезентации.
  clinical_observability: умеренный
  example_context: Когда пациент осознает спроецированный импульс (эмпатия к агрессии “других”), это свидетельствует об отсутствии
    или недостатке работы вытеснения (характерного для проекции более высокого уровня).
- id: B_A7_F1_003
  label: Эмпатия — аспект 2
  area: A7
  family: F1
  definition: Обоюдная эмпатия и имплицитное соглашение о таких сексуальных проявлениях — оборотная сторона эмпатии и соглашения
    в связи с сильным гневом, нападением и отвержением в отношениях.
  clinical_observability: умеренный
  example_context: Когда обсуждения эмпатия пациент описывает переживания.
- id: B_A7_F1_004
  label: Эмпатия — аспект 3
  area: A7
  family: F1
  definition: Другими качественными аспектами являются эмпатия, понимание и способность сохранять взаимоотношения в периоды
    конфликтов или фрустраций.
  clinical_observability: умеренный
  example_context: В ходе обсуждения эмпатия пациент описывает переживания.
- id: B_A7_F1_005
  label: Эмпатия — аспект 4
  area: A7
  family: F1
  definition: Эмпатия терапевта, пытающегося смотреть на события жизни пациента и на его отношение к этим событиям как на
    нормальные человеческие переживания, часто открывает пациенту резкий контраст между такой эмпатией и его собственным равнодушием
    и бесчувственностью по отношению к себе или к значимым другим.
  clinical_observability: умеренный
  example_context: После обсуждения эмпатия пациент описывает переживания.
- id: B_A7_F1_006
  label: Эмпатия — аспект 5
  area: A7
  family: F1
  definition: Но они совершенно не способны ответить на открытый вопрос, поскольку для этого требуется эмпатия по отношению
    к обычным аспектам социальной реальности (например, к интересу терапевта по отношению к их личности).
  clinical_observability: умеренный
  example_context: При обсуждения эмпатия пациент описывает переживания.
- id: B_A7_F2_001
  label: Сочувствие
  area: A7
  family: F2
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сочувствие» в контексте объектных отношений и защит
    (Кернберг).
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с сочувствие.
- id: B_A7_F2_002
  label: Сочувствие — аспект 1
  area: A7
  family: F2
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сочувствие» в контексте объектных отношений и защит
    (Кернберг).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления сочувствие.
- id: B_A7_F2_003
  label: Сочувствие — аспект 2
  area: A7
  family: F2
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сочувствие» в контексте объектных отношений и защит
    (Кернберг).
  clinical_observability: умеренный
  example_context: Когда обсуждения сочувствие пациент описывает переживания.
- id: B_A7_F2_004
  label: Сочувствие — аспект 3
  area: A7
  family: F2
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сочувствие» в контексте объектных отношений и защит
