  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A1_F10_004
  label: Потребность в зависимости — аспект 3
  area: A1
  family: F10
  definition: С клинической точки зрения, эти пациенты иллюстрируют самодеструктивность, находящуюся в зависимости от интенсивности
    примитивной агрессии, примитивизации всех интрапсихических структур, недостаточного развития Супер-Эго и использования
