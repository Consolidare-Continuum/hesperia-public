  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с импульсы привязанности.
- id: B_A1_F11_002
  label: Импульсы
  area: A1
  family: F11
  definition: Мазохистское поведение, непосредственно выражающее бессознательные чувства вины за эдиповы импульсы, связывает
    депрессивно-мазохистское и истерическое расстройства личности (см.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления импульсы привязанности.
- id: B_A1_F11_003
  label: Импульсы привязанности — аспект 2
  area: A1
  family: F11
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
