- id: B_A8_F9_004
  label: Оценка эмпатии — аспект 3
  area: A8
  family: F9
  definition: Реальная оценка такой возможности и реалистическое структурирование ситуации лечения для защиты пациента, терапевта
    и других людей от чрезмерных и опасных потенциально необратимых последствий агрессивных действий вовне являются предварительным
