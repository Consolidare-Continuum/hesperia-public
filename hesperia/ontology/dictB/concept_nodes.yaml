- id: B_A6_F13_001
  label: Поддержание образа Я
  area: A6
  family: F13
  definition: Вслед за этим развитием в переносе возникли интенсивные амбивалентные отношения с могущественным отцом с проекцией
    на меня образа садистского, контролирующего, жестокого отца, которому отвратительны сексуальные фантазии и желания пациента.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с поддержание образа я.
- id: B_A6_F13_002
  label: Поддержание
  area: A6
  family: F13
  definition: Интерпретации бессознательного значения этого паттерна постепенно привели к его разрешению и сдвигу переноса
    на развитие сильных желаний зависимости от меня как от образа отца.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления поддержание образа я.
- id: B_A6_F13_003
  label: Поддержание образа
  area: A6
  family: F13
  definition: сталкивалась с чрезвычайными трудностями в обрисовке реалистического образа своих родителей и двух сестер.
  clinical_observability: умеренный
  example_context: Когда обсуждения поддержание образа я пациент описывает переживания.
- id: B_A6_F13_004
  label: Поддержание образа Я — аспект 3
  area: A6
  family: F13
  definition: на мать приводила к фрагментации образа матери и служила эффективной защитой от страхов матери.
  clinical_observability: умеренный
  example_context: В ходе обсуждения поддержание образа я пациент описывает переживания.
- id: B_A6_F13_005
  label: Поддержание образа Я — аспект 4
  area: A6
  family: F13
  definition: между идентификацией с “ведьмой” и проекцией образа ведьмы на меня иллюстрирует этот процесс.
  clinical_observability: умеренный
  example_context: После обсуждения поддержание образа я пациент описывает переживания.
- id: B_A6_F13_006
  label: Поддержание образа Я — аспект 5
  area: A6
  family: F13
  definition: Твердое поддержание аналитиком технической нейтральности, избегание коммуникации с пациентом контрпереноса,
    избегание установления параметров техники, первоначально незапланированные для этого лечения, — все это может увеличить
    его внутреннюю свободу для фантазирования во время сеансов вместе с пациентом, так же как и за пределами сеансов.
  clinical_observability: умеренный
  example_context: При обсуждения поддержание образа я пациент описывает переживания.
