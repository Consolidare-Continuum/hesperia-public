  example_context: Терапевт отмечает в материале сессии проявления диагностические гипотезы.
- id: B_A8_F17_003
  label: Диагностические гипотезы — аспект 2
  area: A8
  family: F17
  definition: Такие начальные гипотезы обычно связывают нынешнюю психопатологию с предполагаемыми бессознательными внутрипсихическими
    конфликтами, а те, в свою очередь, с их предполагаемыми предшественниками — патогенными инфантильными конфликтами с родительскими
    объектами.
  clinical_observability: умеренный
  example_context: Когда обсуждения диагностические гипотезы пациент описывает переживания.
