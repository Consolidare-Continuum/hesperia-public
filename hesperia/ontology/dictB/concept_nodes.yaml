- id: B_A1_F1_001
  label: Первичные аффективные системы
  area: A1
  family: F1
  definition: Влечения и инстинкты Хотя Фрейд считал, что влечения, которые он признавал основой системы психической мотивации,
    имеют биологические источники, он постоянно указывал на недостаточность достоверных сведений о процессах, которые приводят
    к превращению этих биологических инстинктов в психологическую мотивацию.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с первичные аффективные системы.
- id: B_A1_F1_002
  label: Первичные
  area: A1
  family: F1
  definition: С моей точки зрения, понимание влечений как высшей ступени в иереархии психической мотивационной системы является
    правильным, и дуалистическая теория влечений Фрейда служит удовлетворительным объяснением этой мотивации.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления первичные аффективные системы.
- id: B_A1_F1_003
  label: Первичные аффективные
  area: A1
  family: F1
  definition: Инстинкты, согласно этой точке зрения, это иерархически организованные биологические мотивационные системы.
  clinical_observability: умеренный
  example_context: Когда обсуждения первичные аффективные системы пациент описывает переживания.
- id: B_A1_F1_004
  label: Первичные аффективные системы — аспект 3
  area: A1
  family: F1
  definition: Если они включают как когнитивные, так и аффективные черты, что же еще тогда содержится в более широком понятии
    влечения, чего бы не было в понятии аффекта?
  clinical_observability: умеренный
  example_context: В ходе обсуждения первичные аффективные системы пациент описывает переживания.
- id: B_A1_F1_005
  label: Первичные аффективные системы — аспект 4
  area: A1
  family: F1
  definition: Она пришла к заключению, что аффективные вклады этих репрезентаций образуют клинические проявления влечений.
  clinical_observability: умеренный
  example_context: После обсуждения первичные аффективные системы пациент описывает переживания.
- id: B_A1_F1_006
  label: Первичные аффективные системы — аспект 5
  area: A1
  family: F1
  definition: Различные аффективные состояния по отношению к тому же самому объекту активируются под влиянием различных задач
    развития и биологически активируемых инстинктивных паттернов поведения.
  clinical_observability: умеренный
  example_context: При обсуждения первичные аффективные системы пациент описывает переживания.
- id: B_A1_F2_001
  label: Либидинозное стремление к объекту
  area: A1
  family: F2
  definition: И всегда, когда аффективное состояние пациента подвергается исследованию, обнаруживается его когнитивный аспект,
    обычно отношение “Я” к объекту под воздействием аффективного состояния.
  clinical_observability: умеренный
  example_context: Терапевт, как он считает, должен возненавидеть его за такое отношение или относиться к нему как к “объекту”,
    который теперь защищается.
- id: B_A1_F2_002
  label: Либидинозное
  area: A1
  family: F2
  definition: Различные аффективные состояния по отношению к тому же самому объекту активируются под влиянием различных задач
    развития и биологически активируемых инстинктивных паттернов поведения.
  clinical_observability: умеренный
  example_context: При сексуальной страсти преодоление временных границ Я также происходит под знаком принятия обязательств
    на будущее по отношению к объекту любви как к идеалу, придающему жизни личный смысл.
- id: B_A1_F2_003
  label: Либидинозное стремление
  area: A1
  family: F2
  definition: “Вожделение” (desire) выражает более общее мотивациоииое стремление, чем “желание” (wish).
  clinical_observability: умеренный
  example_context: При более мягких обстоятельствах порок (стремление заставить любовь служить агрессии) трансформирует сильное
    сексуальное желание в механический секс.
- id: B_A1_F2_004
  label: Либидинозное стремление к объекту — аспект 3
  area: A1
  family: F2
  definition: Постоянство, стабильность и характерологическая укорененность ненависти сочетаются со страстным желанием причинять
    боль объекту, характерологическим — и иногда сексуальным — садизмом и жестокостью.
  clinical_observability: умеренный
  example_context: Когда происходит дифференциация Я и объекта, отношение к (инвестиция в) внешнему объекту воспринимается
    как продолжение отношения к его более ранней недифференцированной версии.
- id: B_A1_F2_005
  label: Либидинозное стремление к объекту — аспект 4
  area: A1
  family: F2
  definition: Подоплекой этой потребности в разрушении реальности и общения в близких отношениях является, по моему мнению,
    бессознательная и сознательная зависть к объекту, особенно к такому объекту, который сам внутренне не охвачен подобной
    ненавистью.
  clinical_observability: умеренный
  example_context: После обсуждения либидинозное стремление к объекту пациент описывает переживания.
- id: B_A1_F2_006
  label: Либидинозное стремление к объекту — аспект 5
  area: A1
  family: F2
  definition: Мелани Кляйн (1957) была первой, кто указал на зависть к хорошему объекту как на важную характеристику пациента
    с тяжелой нарциссической психопатологией.
  clinical_observability: умеренный
  example_context: При обсуждения либидинозное стремление к объекту пациент описывает переживания.
- id: B_A1_F3_001
  label: Агрессивные импульсы
  area: A1
  family: F3
  definition: И наоборот, реакции гнева на фрустрации в оральный период и борьба за власть в анальный период могут соединить
    созвучные агрессивные аффективные состояния, приводя таким образом к интеграции агрессивного влечения.
  clinical_observability: умеренный
  example_context: Последующая психофизиологическая активация ранних неблагополучия, гнева, страха, а позже депрессии и чувства
    вины формирует соответствующие агрессивные составляющие Я и объекта.
- id: B_A1_F3_002
  label: Агрессивные
  area: A1
  family: F3
  definition: Сгущение и смещение как характеристики содержимого Ид отражают связь между аффективно окрашенными репрезентациями
    “Я” и объектов со сходной позитивной или негативной валентностью, образуя таким образом соответствующие агрессивные, либидинальные
    и, позднее, смешанные ряды.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления агрессивные импульсы.
- id: B_A1_F3_003
  label: Агрессивные импульсы — аспект 2
  area: A1
  family: F3
  definition: Это сложный аффект, являющийся главным компонентом агрессивного влечения и перекрывающий собой другие имеющие
    всеобщее распространение агрессивные аффекты, такие, как зависть или отвращение.
  clinical_observability: умеренный
  example_context: Когда обсуждения агрессивные импульсы пациент описывает переживания.
- id: B_A1_F3_004
  label: Агрессивные импульсы — аспект 3
  area: A1
  family: F3
  definition: Мазохистское поведение, непосредственно выражающее бессознательные чувства вины за эдиповы импульсы, связывает
    депрессивно-мазохистское и истерическое расстройства личности (см.
  clinical_observability: умеренный
  example_context: В ходе обсуждения агрессивные импульсы пациент описывает переживания.
- id: B_A1_F3_005
  label: Агрессивные импульсы — аспект 4
  area: A1
  family: F3
  definition: 'Рассмотренные случаи объединяют: 1) сильные, примитивные агрессивные импульсы, 2) тяжелую патологию объектных
    отношений, 3) преобладание доэдиповых конфликтов и целей в сексуальном мазохистском сценарии и 4) недостаточную интеграцию
    функций Супер-Эго.'
  clinical_observability: умеренный
  example_context: После обсуждения агрессивные импульсы пациент описывает переживания.
- id: B_A1_F3_006
  label: Агрессивные импульсы — аспект 5
  area: A1
  family: F3
  definition: Сексуальные и агрессивные влечения всегда возникают в контексте интернализованных объектных отношений, организованных
    аффективными состояниями, о чем, в то же самое время, сигнализируют эти (иерархически вышестоящие) влечения.
  clinical_observability: умеренный
  example_context: При обсуждения агрессивные импульсы пациент описывает переживания.
- id: B_A1_F4_001
  label: Мотивация удовольствия
  area: A1
  family: F4
  definition: Я бы добавил, что перевод Стречи вызвал неудачные последствия, слишком близко связав теорию влечений Фрейда
    с биологией, затормозив психоаналитические исследования природы промежуточных процессов, связывающих биологические инстинкты
    с влечениями, которые были определены как чисто психическая мотивация.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с мотивация удовольствия.
- id: B_A1_F4_002
  label: Мотивация
  area: A1
  family: F4
  definition: Эти субъективные переживания удовольствия и боли обычно, хотя и не всегда, отделены друг от друга.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления мотивация удовольствия.
- id: B_A1_F4_003
  label: Мотивация удовольствия — аспект 2
  area: A1
  family: F4
  definition: Аффекты и ранний субъективный опыт Какие у нас есть доказательства, что проявление аффектов у младенца сопровождается
    субъективным переживанием боли или удовольствия?
  clinical_observability: умеренный
  example_context: Когда обсуждения мотивация удовольствия пациент описывает переживания.
- id: B_A1_F4_004
  label: Мотивация удовольствия — аспект 3
  area: A1
  family: F4
  definition: Существует также доказательство того, что диэнцефальные центры, являющиеся медиаторами переживания отталкивающего
    или притягивающего характера восприятий, уже полностью созрели к моменту рождения, что подтверждает наше предположение
    ранней способности младенца к переживанию удовольствия и боли.
  clinical_observability: умеренный
  example_context: В ходе обсуждения мотивация удовольствия пациент описывает переживания.
- id: B_A1_F4_005
  label: Мотивация удовольствия — аспект 4
  area: A1
  family: F4
  definition: Если мы примем за данное, что аффективные, а также перцептивные и моторные схемы действуют с самого рождения,
    то субъективные переживания удовольствия и боли (субъективность), как мы можем предположить, образуют первую фазу развития
    сознания и, таким образом, становятся первой фазой в развитии “Я”.
  clinical_observability: умеренный
  example_context: После обсуждения мотивация удовольствия пациент описывает переживания.
- id: B_A1_F4_006
  label: Мотивация удовольствия — аспект 5
  area: A1
  family: F4
  definition: 'Возможно, особенно важным здесь является постепенное развитие двух параллельных рядов абсолютно хороших и абсолютно
    плохих фантазийных характеристик этого символического мира: удовольствия, связанного с присутствием “хорошей” кормящей
    матери, находящегося в полной противоположности к боли, связанной с “плохой” матерью, в ситуации, когда ребенка фрустрируют,
    расстраивают или злят.'
  clinical_observability: умеренный
  example_context: При обсуждения мотивация удовольствия пациент описывает переживания.
- id: B_A1_F5_001
  label: Реакции фрустрации
  area: A1
  family: F5
  definition: И наоборот, реакции гнева на фрустрации в оральный период и борьба за власть в анальный период могут соединить
    созвучные агрессивные аффективные состояния, приводя таким образом к интеграции агрессивного влечения.
  clinical_observability: умеренный
  example_context: Пациент представляет типичный случай обсессивной личности с ярко выраженным формированием реакции на агрессию
    в виде стойкой сверхвежливости и педантичности в самовыражении.
- id: B_A1_F5_002
  label: Реакции
  area: A1
  family: F5
  definition: На еще более поздней стадии развития реакции ярости могут выполнять функцию последнего усилия по восстановлению
    чувства автономии перед лицом ситуаций сильной фрустрации, бессознательно воспринимаемых как угрожающая активация абсолютно
    плохих, преследующих объектных отношений.
  clinical_observability: умеренный
  example_context: Примитивная природа переноса пограничного пациента развивает у стремящегося чувствовать эмпатию терапевта
    способность осознавать собственные примитивные эмоциональные реакции.
- id: B_A1_F5_003
  label: Реакции фрустрации — аспект 2
  area: A1
  family: F5
  definition: 'С клинической точки зрения, интенсивность агрессивных аффектов — раздражения, злости или ярости — в целом коррелирует
    с их психологической функцией: отстаивания автономии, удаления препятствий или барьеров на пути желаемого уровня удовлетворения,
    либо удаления или разрушения источника глубокой боли или фрустрации.'
  clinical_observability: умеренный
  example_context: Терапевт все настойчивее пытается помочь пациенту, несмотря на отсутствие реакции со стороны последнего
    или даже на ухудшение его состояния.
- id: B_A1_F5_004
  label: Реакции фрустрации — аспект 3
  area: A1
  family: F5
  definition: Важно интерпретировать параноидные реакции пациента как часть интерпретаций антисоциального переноса в целом.
  clinical_observability: умеренный
  example_context: Терапевт должен сдерживать эти реакции, используя их для понимания.
- id: B_A1_F5_005
  label: Реакции фрустрации — аспект 4
  area: A1
  family: F5
  definition: В одной из предыдущих работ я давал определение негативной терапевтической реакции как ухудшения состояния пациента,
    особенно когда он “сознательно или бессознательно воспринимает терапевта как хороший объект, пытающийся оказать ему важную
    помощь” (1984).
  clinical_observability: умеренный
  example_context: Пациенты быстро становятся специалистами по особенностям характера аналитика, и первые реакции переноса
    возникают в этом контексте.
- id: B_A1_F5_006
  label: Реакции фрустрации — аспект 5
  area: A1
  family: F5
  definition: В свете представленных здесь находок, я бы хотел сейчас дать новую формулировку первому и наиболее легкому уровню
    негативной терапевтической реакции — исходящей из бессознательного чувства вины, — который действительно типичен для депрессивно-мазохистской
    структуры личности и может также возникать при психоанализе лиц с мазохистской перверсией невротического уровня.
  clinical_observability: умеренный
  example_context: При злокачественном разрушении источников помощи используется, в частности, тот факт, что всякая интерпретация
    гипотетична и ее достоверность проверяется по бессознательной реакции пациента.
- id: B_A1_F6_001
  label: Регуляция интенсивности аффекта
  area: A1
  family: F6
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A1_F6_002
  label: Регуляция
  area: A1
  family: F6
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: Примитивные аффекты появляются в течение первых двух-трех лет жизни и обладают качествами интенсивности
    и глобальности, а также диффузным, недифференцированным когнитивным элементом.
- id: B_A1_F6_003
  label: Регуляция интенсивности
  area: A1
  family: F6
  definition: Фрейд понимал влечение как переход между физическим и психическим, как психический процесс, укорененный в биологии;
    он предполагал (Freud, 1915b, 1915c), что единственный способ, с помощью которого мы можем узнать о влечениях, это обращение
    к их психическим реперезентациям — идеям и аффектам.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A1_F6_004
  label: Регуляция интенсивности аффекта — аспект 3
  area: A1
  family: F6
  definition: 3Рапапорт (Rapaport, 1953) описывает, как с течением времени у Фрейда менялось представление об аффектах.
  clinical_observability: умеренный
  example_context: В ходе обсуждения регуляция интенсивности аффекта пациент описывает переживания.
- id: B_A1_F6_005
  label: Регуляция интенсивности аффекта — аспект 4
  area: A1
  family: F6
  definition: Аффекты и влечения В первой теории аффектов Фрейда понятия аффекта и влечения были практически взаимозаменимы.
  clinical_observability: умеренный
  example_context: После обсуждения регуляция интенсивности аффекта пациент описывает переживания.
- id: B_A1_F6_006
  label: Регуляция интенсивности аффекта — аспект 5
  area: A1
  family: F6
  definition: Аффекты, постулировал Фрейд, являются процессами разрядки, которые могут достигать сознания, но не подвержены
    вытеснению; только психические реперезентации влечений вытесняются вместе с памятью о чем-либо или склонностью к возникновению
    соответствующего аффекта (Freud, 1915b,1915c).
  clinical_observability: умеренный
  example_context: При обсуждения регуляция интенсивности аффекта пациент описывает переживания.
- id: B_A1_F7_001
  label: Дифференциация аффектов
  area: A1
  family: F7
  definition: Предлагаемые мной изменения заключаются в признании ведущей роли аффектов в структуре влечений и в соединении
    нейропсихологических детерминант аффекта с наиболее ранним межличностным опытом младенчества и детства, который определяет
    развитие личности.
  clinical_observability: умеренный
  example_context: Принимая во внимание последние достижения в исследовании аффектов, я, не отвергая теории влечений Фрейда
    в целом, вношу в нее некоторые изменения.
- id: B_A1_F7_002
  label: Дифференциация
  area: A1
  family: F7
  definition: Часть I РОЛЬ АФФЕКТОВ В ПСИХОАНАЛИТИЧЕСКОЙ ТЕОРИИ 1.
  clinical_observability: умеренный
  example_context: Когда устанавливается дифференциация Я-репрезентаций и репрезентаций объекта, тогда дифференцируются и
    либидинальные инвестиции Я- и объект-репрезентаций.
- id: B_A1_F7_003
  label: Дифференциация аффектов — аспект 2
  area: A1
  family: F7
  definition: НОВОЕ В ПСИХОАНАЛИТИЧЕСКОЙ ТЕОРИИ ВЛЕЧЕНИЙ Марджори Брирли (Brierley, 1937) была первой, кто указал на странный
    парадокс, касающийся роли аффектов в психоаналитической теории и практике.
  clinical_observability: умеренный
  example_context: Когда происходит дифференциация Я и объекта, отношение к (инвестиция в) внешнему объекту воспринимается
    как продолжение отношения к его более ранней недифференцированной версии.
- id: B_A1_F7_004
  label: Дифференциация аффектов — аспект 3
  area: A1
  family: F7
  definition: Вновь изучив связи между аффектами и влечениями в психоаналитической теории, включая меняющиеся взгляды Фрейда
    на влечения и аффекты и современные психоаналитические исследования, а также мои собственные, я предлагаю пересмотренную
    психоаналитическую теорию аффектов и влечений.
  clinical_observability: умеренный
  example_context: В ходе обсуждения дифференциация аффектов пациент описывает переживания.
- id: B_A1_F7_005
  label: Дифференциация аффектов — аспект 4
  area: A1
  family: F7
  definition: Затем я исследую природу аффектов, возникающих в психоаналитической ситуации, и их искажения под влиянием защитных
    процессов.
  clinical_observability: умеренный
  example_context: После обсуждения дифференциация аффектов пациент описывает переживания.
- id: B_A1_F7_006
  label: Дифференциация аффектов — аспект 5
  area: A1
  family: F7
  definition: Наконец, я предлагаю модель развития аффектов и влечений, основанную на собственных концепциях.
  clinical_observability: умеренный
  example_context: При обсуждения дифференциация аффектов пациент описывает переживания.
- id: B_A1_F8_001
  label: Аффективное возбуждение
  area: A1
  family: F8
  definition: Якобсон (Jacobson, 1953) привлекла внимание к тому факту, что состояния напряжения (например, сексуальное возбуждение)
    могут быть приятными, а состояния разрядки (тревога) могут быть неприятными.
  clinical_observability: умеренный
  example_context: Когда аффективное состояние прерывается, нарушаются доминирующие в переносе объектные отношения и ограничивается
    полнота осознания пациентом собственного субъективного опыта.
- id: B_A1_F8_002
  label: Аффективное
  area: A1
  family: F8
  definition: И всегда, когда аффективное состояние пациента подвергается исследованию, обнаруживается его когнитивный аспект,
    обычно отношение “Я” к объекту под воздействием аффективного состояния.
  clinical_observability: умеренный
  example_context: При нормальных обстоятельствах сексуальное возбуждение зрелого индивида активируется в контексте эротического
    желания.
- id: B_A1_F8_003
  label: Аффективное возбуждение — аспект 2
  area: A1
  family: F8
  definition: Аффект и объект Я предполагаю, что раннее аффективное развитие основано на прямой фиксации ранних аффективно
    заряженных объектных отношений в форме аффективной памяти.
  clinical_observability: умеренный
  example_context: Пациенты, о которых пойдет речь, не способны испытывать сексуальное возбуждение, несмотря на совершенно
    нормально функционирующий биологический аппарат.
- id: B_A1_F8_004
  label: Аффективное возбуждение — аспект 3
  area: A1
  family: F8
  definition: Этот опыт включает активацию сильного сексуального возбуждения в подростковый и юношеский период, когда эротически
    окрашенные аффективные состояния интегрируются с генитальным возбуждением и с эротически наполненными эмоциямми и фантазиями,
    идущими от эдиповой стадии развития.
  clinical_observability: умеренный
  example_context: При садистических перверсиях мы видим открытое садистическое поведение — связанное или не связанное с сексуальными
    действиями, — которое несет в себе мощное возбуждение и удовлетворение.
- id: B_A1_F8_005
  label: Аффективное возбуждение — аспект 4
  area: A1
  family: F8
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: После обсуждения аффективное возбуждение пациент описывает переживания.
- id: B_A1_F8_006
  label: Аффективное возбуждение — аспект 5
  area: A1
  family: F8
  definition: Психоаналитическая ситуация обеспечивает нам уникальный способ исследования аффектов любого рода — начиная от
    примитивных (ярость или сексуальное возбуждение) и до когнитивно дифференцированных, имеющих сложное строение.
  clinical_observability: умеренный
  example_context: При обсуждения аффективное возбуждение пациент описывает переживания.
- id: B_A1_F9_001
  label: Желание и влечение к объекту
  area: A1
  family: F9
  definition: Он понимал либидо, или сексуальное влечение, как иерархически соподчиненную организацию частичных влечений,
    принадлежащих более ранним фазам развития.
  clinical_observability: умеренный
  example_context: Терапевт, как он считает, должен возненавидеть его за такое отношение или относиться к нему как к “объекту”,
    который теперь защищается.
- id: B_A1_F9_002
  label: Желание
  area: A1
  family: F9
  definition: Либидо — это влечение, голод — инстинкт.
  clinical_observability: умеренный
  example_context: При сексуальной страсти преодоление временных границ Я также происходит под знаком принятия обязательств
    на будущее по отношению к объекту любви как к идеалу, придающему жизни личный смысл.
- id: B_A1_F9_003
  label: Желание и
  area: A1
  family: F9
  definition: Фрейд понимал влечение как переход между физическим и психическим, как психический процесс, укорененный в биологии;
    он предполагал (Freud, 1915b, 1915c), что единственный способ, с помощью которого мы можем узнать о влечениях, это обращение
    к их психическим реперезентациям — идеям и аффектам.
  clinical_observability: умеренный
  example_context: При более мягких обстоятельствах порок (стремление заставить любовь служить агрессии) трансформирует сильное
    сексуальное желание в механический секс.
- id: B_A1_F9_004
  label: Желание и влечение к объекту — аспект 3
  area: A1
  family: F9
  definition: Частичные сексуальные влечения, с этой точки зрения, это более ограниченные, урезанные интеграции соответствующих
    аффективных состояний, а либидо как влечение является их иерархически высшей интеграцией, т.е.
  clinical_observability: умеренный
  example_context: Пациент уехал в длительное путешествие в другой штат, отец поддержал это его желание и дал ему денег, не
    беспокоясь о каких-либо планах относительно работы или учебы сына.
- id: B_A1_F9_005
  label: Желание и влечение к объекту — аспект 4
  area: A1
  family: F9
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Когда происходит дифференциация Я и объекта, отношение к (инвестиция в) внешнему объекту воспринимается
    как продолжение отношения к его более ранней недифференцированной версии.
- id: B_A1_F9_006
  label: Желание и влечение к объекту — аспект 5
  area: A1
  family: F9
  definition: И всегда, когда аффективное состояние пациента подвергается исследованию, обнаруживается его когнитивный аспект,
    обычно отношение “Я” к объекту под воздействием аффективного состояния.
  clinical_observability: умеренный
  example_context: Пациент, который заведовал исследовательской физической лабораторией, испытывал навязчивое желание фальсифицировать
    данные исследования, чтобы они соответствовали желанным результатам.
- id: B_A1_F10_001
  label: Потребность в зависимости
  area: A1
  family: F10
  definition: Такая зависть осложнена потребностью пациента разрушить собственное осознание этой зависти, чтобы не почувствовать
    весь ужас бешеной зависти, которую он испытывает к тому, что ему дорого и ценно в объекте.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A1_F10_002
  label: Потребность
  area: A1
  family: F10
  definition: Под завистью к объекту и потребностью уничтожить и испортить все хорошее, что может исходить из контактов с
    ним, лежит бессознательная идентификация с первоначально ненавистным — и необходимым — объектом.
  clinical_observability: умеренный
  example_context: Когда пациент отыгрывает вовне свою потребность во всемогущем контроле в кабинете терапевта, это ограничивает
    способность терапевта действовать независимо.
- id: B_A1_F10_003
  label: Потребность в
  area: A1
  family: F10
  definition: В то же время возникает потребность в поиске других объектов, на которые проецируется атакуемое, презираемое
