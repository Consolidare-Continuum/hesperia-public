  family: F6
  definition: Вуайеристские, эксгибиционистские, садистские и мазохистские фантазии и желания любящей пары, гомосексуальный
    смысл их идентификации с возбуждением и оргазмом партнера приводят к символически выраженному преодолению эдиповых запретов.
  clinical_observability: умеренный
  example_context: В ходе обсуждения вуайеристские сценарии пациент описывает переживания.
- id: B_A5_F6_005
  label: Вуайеристские сценарии — аспект 4
  area: A5
  family: F6
  definition: Из клинического опыта выяснилось, что путем взаимной проективной идентификации пара “отыгрывает” свои прошлые
    “сценарии” (бессознательные переживания и фантазии) в своих отношениях и что фантазийные и реальные взаимные “приставания”,
    происходящие из инфантильного Супер-Эго и связанного с ним Я- идеала, оказывают мощнейшее влияние на жизнь пары.
  clinical_observability: умеренный
  example_context: После обсуждения вуайеристские сценарии пациент описывает переживания.
- id: B_A5_F6_006
  label: Вуайеристские сценарии — аспект 5
  area: A5
  family: F6
  definition: Эти специфичные, пугающие и желаемые, бессознательные сценарии постепенно выстраиваются с помощью накопленного
    эффекта диссоциативного поведения.
  clinical_observability: умеренный
  example_context: При обсуждения вуайеристские сценарии пациент описывает переживания.
- id: B_A5_F7_001
  label: Экзибиционистские сценарии
  area: A5
  family: F7
  definition: Бессознательные сценарии также включают отыгрывание конфликтных идентификаций с другим полом и идентификации
    с наказывающим, садистским инцестуозным объектом.
  clinical_observability: умеренный
  example_context: При наихудшем сценарии возникает удушающее чувство несвободы и преследования со стороны другого.
- id: B_A5_F7_002
  label: Экзибиционистские
  area: A5
  family: F7
  definition: 'Рассмотренные случаи объединяют: 1) сильные, примитивные агрессивные импульсы, 2) тяжелую патологию объектных
    отношений, 3) преобладание доэдиповых конфликтов и целей в сексуальном мазохистском сценарии и 4) недостаточную интеграцию
    функций Супер-Эго.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления экзибиционистские сценарии.
- id: B_A5_F7_003
  label: Экзибиционистские сценарии — аспект 2
  area: A5
  family: F7
  definition: 'Следующий аспект является еще более незаметным и присутствует всегда: это аспект разыгрывания роли во внутреннем
    сценарии патологических объектных отношений, активизирующихся и отыгрываемых в больнице.'
  clinical_observability: умеренный
  example_context: Когда обсуждения экзибиционистские сценарии пациент описывает переживания.
- id: B_A5_F7_004
  label: Экзибиционистские сценарии — аспект 3
  area: A5
  family: F7
  definition: Из клинического опыта выяснилось, что путем взаимной проективной идентификации пара “отыгрывает” свои прошлые
    “сценарии” (бессознательные переживания и фантазии) в своих отношениях и что фантазийные и реальные взаимные “приставания”,
    происходящие из инфантильного Супер-Эго и связанного с ним Я- идеала, оказывают мощнейшее влияние на жизнь пары.
  clinical_observability: умеренный
  example_context: В ходе обсуждения экзибиционистские сценарии пациент описывает переживания.
- id: B_A5_F7_005
  label: Экзибиционистские сценарии — аспект 4
  area: A5
  family: F7
  definition: Эти специфичные, пугающие и желаемые, бессознательные сценарии постепенно выстраиваются с помощью накопленного
    эффекта диссоциативного поведения.
  clinical_observability: умеренный
  example_context: После обсуждения экзибиционистские сценарии пациент описывает переживания.
- id: B_A5_F7_006
  label: Экзибиционистские сценарии — аспект 5
  area: A5
  family: F7
  definition: Здесь я имею в виду эдиповы сценарии, представляющие собой вторжение в отношения пары исключенной третьей стороны
    в качестве основной прерывающей силы, а также различные воображаемые близнецовые отношения, выступающие как деструктивный
    центростремительный поток или отчуждающая сила.
  clinical_observability: умеренный
  example_context: При обсуждения экзибиционистские сценарии пациент описывает переживания.
- id: B_A5_F8_001
  label: Объектификация партнёра
  area: A5
  family: F8
  definition: Наблюдаемое клиническое проявление, связанное с областью «Объектификация партнёра» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с объектификация партнёра.
- id: B_A5_F8_002
  label: Объектификация
  area: A5
  family: F8
  definition: Наблюдаемое клиническое проявление, связанное с областью «Объектификация партнёра» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления объектификация партнёра.
- id: B_A5_F8_003
  label: Объектификация партнёра — аспект 2
  area: A5
  family: F8
  definition: Наблюдаемое клиническое проявление, связанное с областью «Объектификация партнёра» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Когда обсуждения объектификация партнёра пациент описывает переживания.
