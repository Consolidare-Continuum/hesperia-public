  clinical_observability: умеренный
  example_context: После обсуждения наблюдение контрпереноса пациент описывает переживания.
- id: B_A8_F16_006
  label: Наблюдение контрпереноса — аспект 5
  area: A8
  family: F16
  definition: Обычно при лечении пациентов с невротической организацией личности вербальные и невербальные каналы коммуникации
