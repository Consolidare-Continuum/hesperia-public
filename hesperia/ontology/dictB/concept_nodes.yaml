  label: Изменения отношений — аспект 4
  area: A10
  family: F17
  definition: Пытаясь прояснить взаимоотношения между аффектами и настроениями, Якобсон (Jacobson1957b) определяет настроения
    как временную фиксацию и генерализацию аффектов по отношению ко всему миру интернализованных объектных отношений, т.е.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
