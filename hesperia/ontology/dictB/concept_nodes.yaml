- id: B_A1_F12_002
  label: Сексуальное
  area: A1
  family: F12
  definition: Якобсон (Jacobson, 1953) привлекла внимание к тому факту, что состояния напряжения (например, сексуальное возбуждение)
    могут быть приятными, а состояния разрядки (тревога) могут быть неприятными.
  clinical_observability: умеренный
  example_context: Пациенты, о которых пойдет речь, не способны испытывать сексуальное возбуждение, несмотря на совершенно
    нормально функционирующий биологический аппарат.
- id: B_A1_F12_003
  label: Сексуальное возбуждение — аспект 2
  area: A1
  family: F12
  definition: Этот опыт включает активацию сильного сексуального возбуждения в подростковый и юношеский период, когда эротически
    окрашенные аффективные состояния интегрируются с генитальным возбуждением и с эротически наполненными эмоциямми и фантазиями,
    идущими от эдиповой стадии развития.
  clinical_observability: умеренный
  example_context: При более мягких обстоятельствах порок (стремление заставить любовь служить агрессии) трансформирует сильное
    сексуальное желание в механический секс.
- id: B_A1_F12_004
  label: Сексуальное возбуждение — аспект 3
  area: A1
  family: F12
  definition: Психоаналитическая ситуация обеспечивает нам уникальный способ исследования аффектов любого рода — начиная от
    примитивных (ярость или сексуальное возбуждение) и до когнитивно дифференцированных, имеющих сложное строение.
  clinical_observability: умеренный
  example_context: При садистических перверсиях мы видим открытое садистическое поведение — связанное или не связанное с сексуальными
    действиями, — которое несет в себе мощное возбуждение и удовлетворение.
- id: B_A1_F12_005
  label: Сексуальное возбуждение — аспект 4
  area: A1
  family: F12
  definition: Раньше (Kernberg, 1991b) я уже описывал агрессивный компонент, входящий в сексуальное возбуждение — агрессивный
    компонент проникновения и принятия в себя — как принятие агрессии на службу любви, использующее эрогенный потенциал переживания
    боли как важнейший вклад в удовлетворяющее слияние с другим в сексуальном возбуждении и оргазме.
  clinical_observability: умеренный
  example_context: После обсуждения сексуальное возбуждение пациент описывает переживания.
- id: B_A1_F12_006
  label: Сексуальное возбуждение — аспект 5
  area: A1
  family: F12
  definition: Эта нормальная способность к трансформации боли в эротическое возбуждение страдает в случаях, когда отношения
    матери и младенца характеризуются сильной агрессией, и является, по-видимому, главным мостом, ведущим к эротическому возбуждению
    от вызывания страданий у других людей, что приводит к консолидации приятных характеристик садистской ненависти.
  clinical_observability: умеренный
  example_context: При обсуждения сексуальное возбуждение пациент описывает переживания.
- id: B_A1_F13_001
  label: Телесное удовольствие
  area: A1
  family: F13
  definition: (Freud, 1915b, 1915c) он рассматривал их (в частности, их связь с удовольствием или болью, психомоторные и нейровегетативные
    аспекты) как процессы разрядки влечений; наконец, в 1926 г.
  clinical_observability: умеренный
  example_context: Пациент глубоко и полностью убежден, что только его собственная сила является надежной и что удовольствие
    садистского контроля является единственной альтернативой страданию и разрушению слабого.
- id: B_A1_F13_002
  label: Телесное
  area: A1
  family: F13
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: Пациент стал испытывать более непосредственное удовольствие от своего деструктивного поведения по отношению
    ко мне.
- id: B_A1_F13_003
  label: Телесное удовольствие — аспект 2
  area: A1
  family: F13
  definition: Было бы обоснованным предположить, что трехмесячный младенец способен переживать эмоции так же, как он способен
    к поведению, показывающему удовольствие, ярость или разочарование (Izard, 1978), это та идея, которую долго развивали
    Плучик и Келлерман (Plutchik and Kellerman, 1983).
  clinical_observability: умеренный
  example_context: Причинение боли другому и идентификация с его эротическим удовольствием от боли есть эротический садизм
    — противоположная сторона эротического мазохизма.
- id: B_A1_F13_004
  label: Телесное удовольствие — аспект 3
  area: A1
  family: F13
  definition: Аффекты связывают ряды недифференцированных Я- и объект-репрезентаций таким образом, что постепенно создается
    сложный мир интернализованных объектных отношений, окрашенных удовольствием или неудовольствием.
  clinical_observability: умеренный
  example_context: В ходе обсуждения телесное удовольствие пациент описывает переживания.
- id: B_A1_F13_005
  label: Телесное удовольствие — аспект 4
  area: A1
  family: F13
  definition: Несколько менее тяжелый уровень ненависти проявляется в садистских склонностях и желаниях; такой пациент ощущает
    бессознательное или сознательное вожделение заставить свой объект страдать вместе, вожделение ощутить сознательное или
    бессознательное удовольствие от этого страдания.
  clinical_observability: умеренный
  example_context: После обсуждения телесное удовольствие пациент описывает переживания.
- id: B_A1_F13_006
  label: Телесное удовольствие — аспект 5
  area: A1
  family: F13
  definition: Страстное желание причинять боль и ощущение удовольствие от этого занимают здесь главное место, представляя
    собой тайный сгусток агрессии и либидинального возбуждения при причинении страданий.
  clinical_observability: умеренный
  example_context: При обсуждения телесное удовольствие пациент описывает переживания.
- id: B_A1_F14_001
  label: Конфликт либидо и агрессии
  area: A1
  family: F14
  definition: ISBN 5-86375-103-7 (РФ) Книга Отто Кернберга, одного из крупнейших специалистов в области тяжелых неврозов,
    автора современной психоаналитической теории личности, посвящена исследованию проблем агрессии при различных психических
    расстройствах и на различных уровнях организации личности.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A1_F14_002
  label: Конфликт
  area: A1
  family: F14
  definition: Сделанные теоретические выводы, касающиеся агрессии и ненависти, автор применяет для создания новых технических
    подходов в работе с тяжелыми расстройствами личности в рамках психоанализа.
  clinical_observability: умеренный
  example_context: Последняя часть книги посвящена перверсиям — еще одной области приложения исследований, указывающих на
    первичность особенностей психической структуры и агрессии в происхождении психопатологии.
- id: B_A1_F14_003
  label: Конфликт либидо
  area: A1
  family: F14
  definition: Лишь тогда терапевт может обратиться к анализу невротических, “Эдиповых”, конфликтов пациента и интерпретациям
    там-и- тогда — касающимся текущей жизни пациента и его прошлого — и более твердому соблюдению технической нейтральности.
  clinical_observability: умеренный
  example_context: Пациенты данной категории сталкиваются с трудностями в выражении агрессии и склонны чувствовать депрессию
    в условиях, которые в норме вызывают злость или ярость.
- id: B_A1_F14_004
  label: Конфликт либидо и агрессии — аспект 3
  area: A1
  family: F14
  definition: Его также интересуют вопросы агрессии, деструктивности и ненависти и, одновременно, любви и сексуальности в
    норме и патологии.
  clinical_observability: умеренный
  example_context: Примитивные самодеструктивность и самоповреждение В более ранних работах (1975) я описывал группу пациентов,
    склонных к разрядке агрессии, безразлично — либо вовне, либо на собственное тело.
- id: B_A1_F14_005
  label: Конфликт либидо и агрессии — аспект 4
  area: A1
  family: F14
  definition: Книга, предлагаемая вашему вниманию, — это глубокое и разностороннее клиническое и теоретическое исследование
    проблемы агрессии, исследование обстоятельств ее проявления при различных психических расстройствах и на различных уровнях
    организации личности.
  clinical_observability: умеренный
  example_context: Пациенты с невротической организацией личности демонстрируют преимущественно межсистемные конфликты.
- id: B_A1_F14_006
  label: Конфликт либидо и агрессии — аспект 5
  area: A1
  family: F14
  definition: Эта книга об агрессии и не только о ней.
  clinical_observability: умеренный
  example_context: Пациент с пограничной организацией личности, наоборот, демонстрирует преобладание преэдиповых конфликтов
    и психических репрезентаций преэдиповых конфликтов, смешанных с репрезентациями эдиповой фазы.
- id: B_A1_F15_001
  label: Импульсивная разрядка
  area: A1
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Импульсивная разрядка» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с импульсивная разрядка.
- id: B_A1_F15_002
  label: Импульсивная
  area: A1
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Импульсивная разрядка» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления импульсивная разрядка.
- id: B_A1_F15_003
  label: Импульсивная разрядка — аспект 2
  area: A1
  family: F15
  definition: Наблюдаемое клиническое проявление, связанное с областью «Импульсивная разрядка» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Когда обсуждения импульсивная разрядка пациент описывает переживания.
