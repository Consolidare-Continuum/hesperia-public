  clinical_observability: умеренный
  example_context: При обсуждения диагностические гипотезы пациент описывает переживания.
- id: B_A8_F18_001
  label: Классификация структуры личности
  area: A8
  family: F18
  definition: Кернберг АГРЕССИЯ ПРИ РАССТРОЙСТВАХ ЛИЧНОСТИ И ПЕРВЕРСИЯХ Перевод с английского и научная редакция А.Ф.
  clinical_observability: умеренный
  example_context: Последняя часть книги посвящена перверсиям — еще одной области приложения исследований, указывающих на
