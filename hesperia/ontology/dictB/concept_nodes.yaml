- id: B_A8_F9_005
  label: Оценка эмпатии — аспект 4
  area: A8
  family: F9
  definition: Способность таких пациентов к пониманию, дифференциации и эмпатии по отношению к объектам любви является замечательно
    высокой в контрасте с неспособностью к этому, проявляемой лицами с нарциссическим расстройством личности.
  clinical_observability: умеренный
  example_context: После обсуждения оценка эмпатии пациент описывает переживания.
- id: B_A8_F9_006
  label: Оценка эмпатии — аспект 5
  area: A8
  family: F9
  definition: Затем, если очевиден диагноз нарциссической структуры личности, ключевой диагностической задачей становится
    оценка тяжести всех представленных антисоциальных особенностей, их прошлой истории и детских источников и сохранившихся
    у пациента способности к объектным отношениям и функционирования Супер-Эго.
  clinical_observability: умеренный
  example_context: При обсуждения оценка эмпатии пациент описывает переживания.
- id: B_A8_F10_001
  label: Оценка способности к любви
  area: A8
  family: F10
  definition: Его также интересуют вопросы агрессии, деструктивности и ненависти и, одновременно, любви и сексуальности в
