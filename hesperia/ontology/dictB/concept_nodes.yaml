- id: B_A2_F13_001
  label: Представления покинутости
  area: A2
  family: F13
  definition: Эта идея находится в сооответствии с его представлениями о психической природе влечений.
  clinical_observability: умеренный
  example_context: Терапевт, который пытается использовать в поддерживающей терапии магические представления пациента и связанную
    с ними диссоциированную идеализацию, обычно за это расплачивается.
- id: B_A2_F13_002
  label: Представления
  area: A2
  family: F13
  definition: Шапиро (Shapiro, 1965) и Горовиц (Horowitz, 1977) описывают когнитивный стиль истерических пациентов, который
    характеризуется склонностью к глобальному (по сравнению с детальным) восприятию, избирательным невниманием и скорее импрессионистическими,
    нежели точными представлениями.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления представления покинутости.
- id: B_A2_F13_003
  label: Представления покинутости — аспект 2
  area: A2
  family: F13
  definition: Я использовал описанную мной ранее (1984) технику представления, как вел бы себя на определенном сеансе “нормальный”
    пациент, чтобы сосредоточить внимание на конкретных проявлениях искусственности в отношениях со мной этого человека.
  clinical_observability: умеренный
  example_context: Когда обсуждения представления покинутости пациент описывает переживания.
- id: B_A2_F13_004
  label: Представления покинутости — аспект 3
  area: A2
  family: F13
  definition: Фрейд предполагал (1915 b,c,d), что влечения проявляются через психические образы или представления — то есть
    когнитивное проявление влечения — и аффекты.
  clinical_observability: умеренный
  example_context: В ходе обсуждения представления покинутости пациент описывает переживания.
- id: B_A2_F13_005
  label: Представления покинутости — аспект 4
  area: A2
  family: F13
  definition: Шассге-Смиржель (1974), придерживаясь теории Хорни (1967), предполагает, что фантазии маленьких мальчиков по
    поводу фаллической матери не только успокаивают или служат отрицанием женских гениталий как продукта кастрации, но также
    отвлекают от представления о вагине взрослой женщины, которая доказывала бы неадекватность его маленьких гениталий.
  clinical_observability: умеренный
  example_context: После обсуждения представления покинутости пациент описывает переживания.
- id: B_A2_F13_006
  label: Представления покинутости — аспект 5
  area: A2
  family: F13
  definition: (Спустя некоторое время после завершения анализа она вышла за него замуж.) Поскольку то, что она оказалась способной
    достичь полноценного сексуального удовлетворения с этим человеком, обозначило существенные изменения в отношениях с ним,
    с аналитиком, с ее семьей и с общими представлениями о жизни, я хотел бы более подробно остановиться на этом эпизоде.
  clinical_observability: умеренный
  example_context: При обсуждения представления покинутости пациент описывает переживания.
- id: B_A2_F14_001
  label: Представления зависимости
  area: A2
  family: F14
  definition: Эта идея находится в сооответствии с его представлениями о психической природе влечений.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A2_F14_002
  label: Представления
  area: A2
  family: F14
  definition: С клинической точки зрения, эти пациенты иллюстрируют самодеструктивность, находящуюся в зависимости от интенсивности
    примитивной агрессии, примитивизации всех интрапсихических структур, недостаточного развития Супер-Эго и использования
    либидинальных и эротических стремлений на службе агрессии.
  clinical_observability: умеренный
  example_context: Терапевт, который пытается использовать в поддерживающей терапии магические представления пациента и связанную
    с ними диссоциированную идеализацию, обычно за это расплачивается.
- id: B_A2_F14_003
  label: Представления зависимости — аспект 2
  area: A2
  family: F14
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
    и сострадания у самих себя и у окружающих.
  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A2_F14_004
  label: Представления зависимости — аспект 3
  area: A2
  family: F14
  definition: Эта экстраверсия проявляется в легкости социальных контактов и окрашена тенденцией к эксгибиционизму и чрезмерной
    зависимости от окружающих.
  clinical_observability: умеренный
  example_context: В ходе обсуждения представления зависимости пациент описывает переживания.
- id: B_A2_F14_005
  label: Представления зависимости — аспект 4
  area: A2
  family: F14
  definition: Шапиро (Shapiro, 1965) и Горовиц (Horowitz, 1977) описывают когнитивный стиль истерических пациентов, который
    характеризуется склонностью к глобальному (по сравнению с детальным) восприятию, избирательным невниманием и скорее импрессионистическими,
    нежели точными представлениями.
  clinical_observability: умеренный
  example_context: После обсуждения представления зависимости пациент описывает переживания.
- id: B_A2_F14_006
  label: Представления зависимости — аспект 5
  area: A2
  family: F14
  definition: Один из паттернов характеризуется качеством псевдогипермаскулинности, театральным преувеличением принятого в
    культуре маскулинного поведения, обычно с акцентом на независимости, и установку на доминирование и превосходство над
    женщинами в сочетании с детской надутостью, если эти ожидания не сбываются.
  clinical_observability: умеренный
  example_context: При обсуждения представления зависимости пациент описывает переживания.
- id: B_A2_F15_001
  label: Внутренние ролевые отношения
  area: A2
  family: F15
  definition: По мере накопления клинического опыта и развития теоретических концепций о ранних отношениях ребенка и матери,
    переносе/контрпереносе, объектных отношениях, аналитической ситуации и т.п.
  clinical_observability: умеренный
  example_context: Когда аффективное состояние прерывается, нарушаются доминирующие в переносе объектные отношения и ограничивается
    полнота осознания пациентом собственного субъективного опыта.
- id: B_A2_F15_002
  label: Внутренние
  area: A2
  family: F15
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A2_F15_003
  label: Внутренние ролевые
  area: A2
  family: F15
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A2_F15_004
  label: Внутренние ролевые отношения — аспект 3
  area: A2
  family: F15
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: В ходе этого процесса прежде неосознаваемые, отрицаемые, вытесненные, проецируемые или диссоциированные
    объектные отношения могут стать полностью осознанными и эго-дистонными.
- id: B_A2_F15_005
  label: Внутренние ролевые отношения — аспект 4
  area: A2
  family: F15
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
