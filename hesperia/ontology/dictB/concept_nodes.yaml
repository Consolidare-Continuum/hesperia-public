  example_context: В ходе обсуждения наблюдение контрпереноса пациент описывает переживания.
- id: B_A8_F16_005
  label: Наблюдение контрпереноса — аспект 4
  area: A8
  family: F16
  definition: (“Первый канал” соответствует сообщению пациентом своих субъективных переживаний; “второй канал” — это наблюдение
