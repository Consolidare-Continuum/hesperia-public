    агрессия пациента.
  clinical_observability: умеренный
  example_context: После обсуждения саморазрушительная агрессия пациент описывает переживания.
- id: B_A4_F13_006
  label: Саморазрушительная агрессия — аспект 5
  area: A4
  family: F13
  definition: Еще раз хочу подчеркнуть, что наиболее нежелательными пациентами являются те, у кого интенсивная агрессия сочетается
    с глубокой психопатологией функционирования Супер-Эго, так что внутренние ограничители против опасного отыгрывания агрессии
    теряются, и терапевт может реально опасаться, что освободившиеся разрушительные силы могут превзойти возможности лечения,
    направленного на их удержание.
  clinical_observability: умеренный
  example_context: При обсуждения саморазрушительная агрессия пациент описывает переживания.
- id: B_A4_F14_001
  label: Аутоагрессивные импульсы
  area: A4
  family: F14
  definition: Мазохистское поведение, непосредственно выражающее бессознательные чувства вины за эдиповы импульсы, связывает
    депрессивно-мазохистское и истерическое расстройства личности (см.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с аутоагрессивные импульсы.
- id: B_A4_F14_002
  label: Аутоагрессивные
  area: A4
  family: F14
  definition: 'Рассмотренные случаи объединяют: 1) сильные, примитивные агрессивные импульсы, 2) тяжелую патологию объектных
    отношений, 3) преобладание доэдиповых конфликтов и целей в сексуальном мазохистском сценарии и 4) недостаточную интеграцию
    функций Супер-Эго.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления аутоагрессивные импульсы.
- id: B_A4_F14_003
  label: Аутоагрессивные импульсы — аспект 2
  area: A4
  family: F14
  definition: Мое представление отличается от этого предположения тем, что на основе данных, относящихся к психопатологии
    пограничных состояний (Kernberg, 1976, 1984), я считаю, что импульсы и защиты необходимо исследовать в терминах паттернов
    интернализованных объектных отношений — строительных блоков трехчленной структуры.
  clinical_observability: умеренный
  example_context: Когда обсуждения аутоагрессивные импульсы пациент описывает переживания.
- id: B_A4_F14_004
  label: Аутоагрессивные импульсы — аспект 3
  area: A4
  family: F14
  definition: Но, хотя самодеструктивные импульсы пациентки стали меньше угрожать ее жизни (прижигание сигаретами стало более
    поверхностным, а суицидальные попытки не такими частыми и тяжелыми), ее тенденция лгать и манипулировать другими сохранилась.
  clinical_observability: умеренный
  example_context: В ходе обсуждения аутоагрессивные импульсы пациент описывает переживания.
- id: B_A4_F14_005
  label: Аутоагрессивные импульсы — аспект 4
  area: A4
  family: F14
  definition: Эти импульсы находили свое выражение в мстительном и радостном отвержении любого понимания со стороны терапевта.
  clinical_observability: умеренный
  example_context: После обсуждения аутоагрессивные импульсы пациент описывает переживания.
- id: B_A4_F14_006
  label: Аутоагрессивные импульсы — аспект 5
  area: A4
  family: F14
  definition: На новом этапе боязни своих сексуальных импульсов стало ясно, что его гомосексуальные чувства включали в себя
    также гетеросексуальные импульсы, которые были неприемлемы для его матери, и сексуальные чувства, перемещенные с нее на
    отца, что, в свою очередь, необходимо было отвергнуть, так как фантазийным последствием того, чтобы стать гомосексуалистом,
    означало быть кастрированным.
  clinical_observability: умеренный
  example_context: При обсуждения аутоагрессивные импульсы пациент описывает переживания.
- id: B_A4_F15_001
  label: Аффективная эскалация
  area: A4
  family: F15
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с аффективная эскалация.
- id: B_A4_F15_002
  label: Аффективная
  area: A4
  family: F15
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления аффективная эскалация.
- id: B_A4_F15_003
  label: Аффективная эскалация — аспект 2
  area: A4
  family: F15
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: Когда обсуждения аффективная эскалация пациент описывает переживания.
- id: B_A4_F15_004
  label: Аффективная эскалация — аспект 3
  area: A4
  family: F15
  definition: Аффективная доминанта сдвигается с другой темы на сам перенос, и это требует от аналитика фокусировки своих
    интерпретаций на переносе, перед тем как переходить к другой теме.
  clinical_observability: умеренный
  example_context: В ходе обсуждения аффективная эскалация пациент описывает переживания.
- id: B_A4_F15_005
  label: Аффективная эскалация — аспект 4
  area: A4
  family: F15
  definition: С исчезновением аналитического пространства доминирующая аффективная тема становится заметной благодаря его
    отсутствию.
  clinical_observability: умеренный
  example_context: После обсуждения аффективная эскалация пациент описывает переживания.
- id: B_A4_F15_006
  label: Аффективная эскалация — аспект 5
  area: A4
  family: F15
  definition: Несомненно, аффективная коммуникация увеличивает опасность выражения взаимных проекций принадлежащих Супер-Эго
    негативных аспектов нормальной амбивалентности, неконтролируемых или недоступных ему.
  clinical_observability: умеренный
  example_context: При обсуждения аффективная эскалация пациент описывает переживания.
- id: B_A4_F16_001
  label: Унижение зависимости
  area: A4
  family: F16
  definition: 'Лапланш и Понталис (Laplanche and Pontalis, 1973) дали наиболее краткое и, на мой взгляд, наиболее удачное
    определение мазохизма во всей психоаналитической литературе: “Сексуальная перверсия, при которой удовольствие связано
    со страданием или унижением, которому подвергается субъект”.'
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A4_F16_002
  label: Унижение
  area: A4
  family: F16
  definition: С клинической точки зрения, эти пациенты иллюстрируют самодеструктивность, находящуюся в зависимости от интенсивности
    примитивной агрессии, примитивизации всех интрапсихических структур, недостаточного развития Супер-Эго и использования
    либидинальных и эротических стремлений на службе агрессии.
  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A4_F16_003
  label: Унижение зависимости — аспект 2
  area: A4
  family: F16
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
    и сострадания у самих себя и у окружающих.
  clinical_observability: умеренный
  example_context: Когда обсуждения унижение зависимости пациент описывает переживания.
- id: B_A4_F16_004
  label: Унижение зависимости — аспект 3
  area: A4
  family: F16
  definition: Важно провести различие между такими невозможными романами и мазохистской сексуальной перверсией, при которой
    объект любви приносит сексуальное удовлетворение вместе с физической болью, подчинением или унижением.
  clinical_observability: умеренный
  example_context: В ходе обсуждения унижение зависимости пациент описывает переживания.
- id: B_A4_F16_005
  label: Унижение зависимости — аспект 4
  area: A4
  family: F16
  definition: Эта экстраверсия проявляется в легкости социальных контактов и окрашена тенденцией к эксгибиционизму и чрезмерной
    зависимости от окружающих.
  clinical_observability: умеренный
  example_context: После обсуждения унижение зависимости пациент описывает переживания.
- id: B_A4_F16_006
  label: Унижение зависимости — аспект 5
  area: A4
  family: F16
  definition: Один из паттернов характеризуется качеством псевдогипермаскулинности, театральным преувеличением принятого в
    культуре маскулинного поведения, обычно с акцентом на независимости, и установку на доминирование и превосходство над
    женщинами в сочетании с детской надутостью, если эти ожидания не сбываются.
  clinical_observability: умеренный
  example_context: При обсуждения унижение зависимости пациент описывает переживания.
- id: B_A4_F17_001
  label: Ненависть к уязвимости
  area: A4
  family: F17
  definition: Таким образом, любовь и ненависть становятся стабильными интрапсихическими структурами, представляя собой две
    динамически детерминированные, внутренне согласованные, стабильные рамки организации психического опыта и поведенческого
    контроля в своей генетической преемственности на всех стадиях развития человека.
  clinical_observability: умеренный
  example_context: Придерживаясь этих общих представлений об аффектах, я уделяю особое внимание агрессии, пытаясь прояснить
    связь между агрессией и яростью, между яростью и ненавистью.
- id: B_A4_F17_002
  label: Ненависть
  area: A4
  family: F17
  definition: я имею в виду ненависть, ядерный аффект при тяжелых психопатологических состояниях, а именно при тяжелых расстройствах
    личности, перверсиях и функциональных психозах.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A4_F17_003
  label: Ненависть к
  area: A4
  family: F17
  definition: Ненависть происходит от ярости, первичного аффекта, вокруг которого группируется агрессивное влечение; в случае
    тяжелой психопатологии ненависть может полностью доминировать как в отношении к самому себе, так и к окружающим.
  clinical_observability: умеренный
  example_context: Примитивная ненависть на постоянно интенсивном уровне создает, однако, круговую реакцию, которая не только
    поддерживает, но и патологически усиливает саму ненависть.
- id: B_A4_F17_004
  label: Ненависть к уязвимости — аспект 3
  area: A4
  family: F17
  definition: Это развитие позволяет исследовать ненависть психоаналитически, но также бросает серьезный вызов аналитику,
    который должен привести соответствующую ей психопатологию к разрешению в переносе.
  clinical_observability: умеренный
  example_context: В ходе обсуждения ненависть к уязвимости пациент описывает переживания.
- id: B_A4_F17_005
  label: Ненависть к уязвимости — аспект 4
  area: A4
  family: F17
  definition: Ненависть Ненависть — это сложный агрессивный аффект.
  clinical_observability: умеренный
  example_context: После обсуждения ненависть к уязвимости пациент описывает переживания.
- id: B_A4_F17_006
  label: Ненависть к уязвимости — аспект 5
  area: A4
  family: F17
  definition: Ненависть также укоренена в характере, что выражается в мощных рационализациях и соответствующих искажениях
    деятельности Эго и Супер-Эго.
  clinical_observability: умеренный
  example_context: При обсуждения ненависть к уязвимости пациент описывает переживания.
- id: B_A4_F18_001
  label: Агрессия против привязанности
  area: A4
  family: F18
  definition: Кернберг АГРЕССИЯ ПРИ РАССТРОЙСТВАХ ЛИЧНОСТИ И ПЕРВЕРСИЯХ Перевод с английского и научная редакция А.Ф.
  clinical_observability: умеренный
  example_context: Принципиальная разница между невротиком (в противоположность более тяжелой психопатологии) состоит в том,
    что в последнем случае налицо более сложный сгусток эдиповых и преэдиповых проблем.
- id: B_A4_F18_002
  label: Агрессия
  area: A4
  family: F18
  definition: К 74 Агрессия при расстройствах личности и перверсиях/Пер.
  clinical_observability: умеренный
  example_context: При психопатологии тяжелого уровня механизмы расщепления позволяют противоположным аспектам интрапсихического
    конфликта оставаться по крайней мере частично осознанными в форме примитивных переносов.
- id: B_A4_F18_003
  label: Агрессия против
  area: A4
  family: F18
  definition: Выпуск произведения или его фрагментов без разрешения издательства считается противоправным и преследуется по
    закону.
  clinical_observability: умеренный
  example_context: Пациент снова стал демонстрировать “пассивное сопротивление”, отказываясь от свободных ассоциаций или от
    выслушивания интерпретаций.
- id: B_A4_F18_004
  label: Агрессия против привязанности — аспект 3
  area: A4
  family: F18
  definition: В этом контексте мое внимание сосредоточено на специфических искажениях переноса и контрпереноса, вызванных
    структурированной агрессией в форме хронической ненависти и защитами против этой ненависти.
  clinical_observability: умеренный
  example_context: После нескольких месяцев психотерапии благодаря явной нарциссической структуре ее личности и отсутствию
    противопоказаний я решил перейти к психоанализу как таковому — четыре сеанса в неделю.
- id: B_A4_F18_005
  label: Агрессия против привязанности — аспект 4
  area: A4
  family: F18
  definition: В противовес до сих пор весьма распространенному в психоанализе взгляду на аффекты просто как на процессы разрядки,
    я считаю их структурами, связывающими биологические инстинкты и психические влечения.
  clinical_observability: умеренный
  example_context: Причинение боли другому и идентификация с его эротическим удовольствием от боли есть эротический садизм
    — противоположная сторона эротического мазохизма.
- id: B_A4_F18_006
  label: Агрессия против привязанности — аспект 5
  area: A4
  family: F18
  definition: Попытка заменить теории влечений и аффектов на теорию привязанности или теорию объектных отношений, отвергающих
    концепцию влечений, ведет к упрощению психической жизни, подчеркивая только позитивные или либидинальные элементы привязанности
    и игнорируя бессознательную организацию агрессии.
  clinical_observability: умеренный
  example_context: Когда эротические желания пациента фокусируются исключительно на аналитике, аспект сопротивления становится
    вполне очевидным, а агрессивный компонент сексуальных побуждений — более выраженным.
- id: B_A4_F19_001
  label: Аффективная жестокость
  area: A4
  family: F19
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: При некоторых обстоятельствах жестокость их Супер-Эго может быть направлена на других людей в форме “благородного
    негодования” (см.
- id: B_A4_F19_002
  label: Аффективная
  area: A4
  family: F19
  definition: Нейропсихологическая теория предполагает, что аффективная память хранится в лимбической коре; эксперименты по
    прямой стимуляции мозга показывают, что возможна реактивация не только когнитивных аспектов прошлого опыта, но и его аффективных
    аспектов, в частности, субъективной, аффективной окраски этого опыта (Arnold, 1970а).
  clinical_observability: умеренный
