  label: Объектификация партнёра — аспект 5
  area: A5
  family: F8
  definition: Наблюдаемое клиническое проявление, связанное с областью «Объектификация партнёра» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения объектификация партнёра пациент описывает переживания.
- id: B_A5_F9_001
  label: Сексуализированное унижение
  area: A5
  family: F9
  definition: 'Лапланш и Понталис (Laplanche and Pontalis, 1973) дали наиболее краткое и, на мой взгляд, наиболее удачное
    определение мазохизма во всей психоаналитической литературе: “Сексуальная перверсия, при которой удовольствие связано
    со страданием или унижением, которому подвергается субъект”.'
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с сексуализированное унижение.
- id: B_A5_F9_002
  label: Сексуализированное
  area: A5
  family: F9
  definition: Важно провести различие между такими невозможными романами и мазохистской сексуальной перверсией, при которой
    объект любви приносит сексуальное удовлетворение вместе с физической болью, подчинением или унижением.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления сексуализированное унижение.
- id: B_A5_F9_003
  label: Сексуализированное унижение — аспект 2
  area: A5
  family: F9
  definition: Это была как бы примитивная, садистская, карикатурная версия учителя или жестокого, тиранического родителя,
    который наслаждался контролем и унижением непокорного ребенка.
  clinical_observability: умеренный
  example_context: Когда обсуждения сексуализированное унижение пациент описывает переживания.
- id: B_A5_F9_004
  label: Сексуализированное унижение — аспект 3
  area: A5
  family: F9
  definition: В конце концов после работы с этим страхом он стал способен исследовать свои фантазии о значении того, что считал
    унижением себя.
  clinical_observability: умеренный
  example_context: В ходе обсуждения сексуализированное унижение пациент описывает переживания.
- id: B_A5_F9_005
  label: Сексуализированное унижение — аспект 4
  area: A5
  family: F9
  definition: Я сказал, что она ощущает себя подвергающейся этой трехсторонней атаке, общей чертой которой является неустанное,
    враждебное, садистское передразнивание и унижение другого человека, иногда локализованное в ней и нападающее на меня,
    в другое время локализованное во мне и нападающее на нее, и в течение всего времени локализованное в ней в форме нападок
    на саму себя.
  clinical_observability: умеренный
  example_context: После обсуждения сексуализированное унижение пациент описывает переживания.
- id: B_A5_F9_006
  label: Сексуализированное унижение — аспект 5
  area: A5
  family: F9
  definition: Преодоление стыда — не то же самое, что унижение; желание унизить обычно включает третью сторону, свидетеля
    унижения, и подразумевает боґльшую степень агрессии, способной стать причиной разрыва отношений с данным сексуальным объектом.
  clinical_observability: умеренный
  example_context: При обсуждения сексуализированное унижение пациент описывает переживания.
- id: B_A5_F10_001
  label: Сексуализированный контроль
  area: A5
  family: F10
  definition: Все эти личностные расстройства обнаруживают хорошо интегрированную личностную идентичность, неспецифические
    проявления силы Эго (хорошая толерантность к тревоге, контроль импульсов и сублиматорная деятельность) и жесткое, но хорошо
    интегрированное Супер-Эго.
  clinical_observability: умеренный
  example_context: При этом снижался контроль за работой и ухудшалось качество обслуживания, что иногда приводило к политическим
    конфликтам между местными группами и чиновниками, занимавшимися психиатрией.
- id: B_A5_F10_002
  label: Сексуализированный
  area: A5
  family: F10
  definition: Это поведение часто представляет собой бессознательную попытку восстановить контроль за окружающими, путем пробуждения
    у них чувства вины — например, когда рвутся отношения с сексуальным партнером или когда что-то мешает реализации желаний
    пациента.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления сексуализированный контроль.
- id: B_A5_F10_003
  label: Сексуализированный контроль — аспект 2
  area: A5
  family: F10
  definition: Они теряют эмоциональный контроль только перед лицом тех, с кем находятся в интенсивном конфликте, особенно
    имеющем сексуальную или конкурентную природу.
  clinical_observability: умеренный
  example_context: Когда обсуждения сексуализированный контроль пациент описывает переживания.
- id: B_A5_F10_004
  label: Сексуализированный контроль — аспект 3
  area: A5
  family: F10
  definition: Совершить самоубийство, согласно фантазии таких пациентов, значит установить садистский контроль над окружающими
    или “покинуть” мир, который, по их мнению, они не в силах контролировать.
  clinical_observability: умеренный
  example_context: В ходе обсуждения сексуализированный контроль пациент описывает переживания.
- id: B_A5_F10_005
  label: Сексуализированный контроль — аспект 4
  area: A5
  family: F10
  definition: Длительное стационарное лечение в специализированных закрытых больницах или в тюремной системе, возможно, является
    эффективным в некоторых случаях, особенно если твердый и не поддающийся коррупции внешний контроль за режимом сочетается
    с возможностью групповой терапии в группах, составленных из пациентов-заключенных (Reid, 1981).
  clinical_observability: умеренный
  example_context: После обсуждения сексуализированный контроль пациент описывает переживания.
- id: B_A5_F10_006
  label: Сексуализированный контроль — аспект 5
  area: A5
  family: F10
  definition: Фантазируя, будто находится под защитой теплого и сильного мужчины, он защищает себя от сексуального соблазнения
    мной и от страха попасть под мой контроль — контроль садистской авторитетной фигуры.
  clinical_observability: умеренный
  example_context: При обсуждения сексуализированный контроль пациент описывает переживания.
- id: B_A5_F11_001
  label: Фантазии господства
  area: A5
  family: F11
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A5_F11_002
  label: Фантазии
  area: A5
  family: F11
  definition: Источники фантазии и экстремальные (пиковые) аффективные состояния Если в переносе происходит активация интенсивных
    аффективных состояний, то при этом вспоминаются соответствующие удовлетворяющие или фрустрирующие объектные отношения
    из прошлого, сопровождающиеся попытками их реактивации, если они были удовлетворяющими, или их избегания, если они были
    болезненными.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A5_F11_003
  label: Фантазии господства — аспект 2
  area: A5
  family: F11
  definition: Структура фантазии отражает, таким образом, одновременное существоание прошлого, настоящего и будущего, что
    характерно для Ид, предваряя осознание и признание объективных ограничений пространства-времени, характерных для дифференцированного
    Эго (Jaques, 1982).
  clinical_observability: умеренный
  example_context: Когда в поддерживающей терапии пациент предлагает терапевту примитивный материал регрессивной фантазии,
    терапевт не игнорирует это сообщение, но привязывает его к реальности.
- id: B_A5_F11_004
  label: Фантазии господства — аспект 3
  area: A5
  family: F11
  definition: От первичной интеграции примитивной аффективной памяти, связывающей “полностью хорошие” или “полностью плохие”
    пиковые аффективные состояния, ведут свое развитие специфические фантазии исполнения желаний, связывающие “Я” и объект,
    которые характерны для бессознательной фантазии.
  clinical_observability: умеренный
  example_context: При этом пациент гибко переходит от эмоций к интеллектуальному пониманию, от фантазии к реальности, от
    переноса к своей внешней жизни и так далее.
- id: B_A5_F11_005
  label: Фантазии господства — аспект 4
  area: A5
  family: F11
  definition: Аналогичным образом, преобразование болезненного опыта в символический образ недифференцированного “плохого
    Я — плохой матери” с очевидностью содержит в себе элемент фантазии, выходящей за рамки реалистического характера “хороших”
    Я- и объект-репрезентаций.
  clinical_observability: умеренный
  example_context: После обсуждения фантазии господства пациент описывает переживания.
- id: B_A5_F11_006
  label: Фантазии господства — аспект 5
  area: A5
  family: F11
  definition: Однако в клинической ситуации анализ реакций ярости — так же как и других интенсивных аффективных состояний
    — всегда открывает лежащие за ними сознательные и бессознательные фантазии, включающие специфические отношения между аспектом
    “Я” и аспектом значимого другого.
  clinical_observability: умеренный
  example_context: При обсуждения фантазии господства пациент описывает переживания.
- id: B_A5_F12_001
  label: Сексуальные компульсии
  area: A5
  family: F12
  definition: Частичные сексуальные влечения, с этой точки зрения, это более ограниченные, урезанные интеграции соответствующих
    аффективных состояний, а либидо как влечение является их иерархически высшей интеграцией, т.е.
  clinical_observability: умеренный
  example_context: Пациентка теперь могла вербализовать свое ощущение, что любые ее сексуальные чувства ко мне повлекут за
    собой немедленную активацию аналогичных чувств у меня и приведут к разрушительной оргии.
- id: B_A5_F12_002
  label: Сексуальные
  area: A5
  family: F12
  definition: Или, возможно, различные сексуальные патологии, включая перверсии на невротическом уровне организации личности,
    могут содержать в себе ненависть как относительно безобидный, эротизированный симптом.
  clinical_observability: умеренный
  example_context: При отсутствии таких разрывов сексуальные отношения становятся частью обыденности, а это может привести
    к накоплению агрессии в переживании слияния, что является угрозой отношениям в целом.
- id: B_A5_F12_003
  label: Сексуальные компульсии — аспект 2
  area: A5
  family: F12
  definition: В некоторых случаях, однако, бессознательные сексуальные конфликты тесно связаны с мазохистским поведением,
    так что пациенты проявляют самонаказывающее поведение именно в сексуальной области, в качестве отражения бессознательных
    запретов против эдиповых импульсов.
  clinical_observability: умеренный
  example_context: Когда они вступили в брак, их сексуальные отношения тут же стали ухудшаться.
- id: B_A5_F12_004
  label: Сексуальные компульсии — аспект 3
  area: A5
  family: F12
  definition: Сексуальная перверсия может включать символическое отыгрывание переживаний первичной сцены, таких как эдипов
    треугольник в форме menage a trois (любви втроем), при которой мазохистский субъект принужден наблюдать сексуальные отношения
    между объектом любви и соперником, в качестве условия для полового акта и удовлетворения.
  clinical_observability: умеренный
  example_context: В ходе обсуждения сексуальные компульсии пациент описывает переживания.
- id: B_A5_F12_005
  label: Сексуальные компульсии — аспект 4
  area: A5
  family: F12
  definition: Несколько раз его случайные сексуальные партнеры угрожали ему огнестрельным оружием и грабили.
  clinical_observability: умеренный
  example_context: После обсуждения сексуальные компульсии пациент описывает переживания.
- id: B_A5_F12_006
  label: Сексуальные компульсии — аспект 5
  area: A5
  family: F12
  definition: Эти пациенты также обнаруживают спутанность сексуальной идентичности, так что гомо- и гетеросексуальные взаимодействия
    становятся частью их половой жизни при ведущей организующей роли мазохистского сценария.
  clinical_observability: умеренный
  example_context: При обсуждения сексуальные компульсии пациент описывает переживания.
- id: B_A5_F13_001
  label: Диссоциация сексуальности
  area: A5
  family: F13
  definition: Его также интересуют вопросы агрессии, деструктивности и ненависти и, одновременно, любви и сексуальности в
    норме и патологии.
  clinical_observability: умеренный
  example_context: При обсуждении этих вопросов особое внимание уделяется гомосексуальности в силу того особого положения,
    которое она занимает в современной психоаналитической теории.
- id: B_A5_F13_002
  label: Диссоциация
  area: A5
  family: F13
  definition: Дуалистическая теория влечений — сексуальности и агрессивности (Freud, 1920) — представляет собой его окончательную
    классификацию влечений как глубинных источников бессознательного психического конфликта и образования психических структур.
  clinical_observability: умеренный
  example_context: В ходе лечения первоначальная диссоциация между грубой агрессией и самоагрессией, с одной стороны, и поверхностным
    дружелюбием, с другой, была постепенно преодолена.
- id: B_A5_F13_003
  label: Диссоциация сексуальности — аспект 2
  area: A5
  family: F13
  definition: Подобная диссоциация различных компонентов аффектов с защитными целями может производить впечатление, что субъективное
    переживание аффектов отделено от их когнитивных, поведенческих, коммуникативных аспектов, особенно на начальных стадиях
    лечения, когда сопротивление наиболее сильно.
  clinical_observability: умеренный
  example_context: При клинических перверсиях они могут также служить функции создания “неосексуальности” (Mc Dougall, 1985),
    или избегания эдиповой ситуации путем идеализации преэдиповых сексуальных предшественников.
- id: B_A5_F13_004
  label: Диссоциация сексуальности — аспект 3
  area: A5
  family: F13
  definition: Такая защитная диссоциация, похоже, иллюстрирует традиционную психологическую точку зрения, что аффект, восприятие,
    познание и действие — это отдельные функции Эго.
  clinical_observability: умеренный
  example_context: Пациенты с преобладанием такого вида психопатологии обычно способны влюбляться и устанавливать стабильные
    отношения в контексте некоторого сдерживания генитальной сексуальности.
- id: B_A5_F13_005
  label: Диссоциация сексуальности — аспект 4
  area: A5
  family: F13
  definition: Во-первых, он находит мазохистские элементы в бесчисленных формах сексуального поведения и видит рудименты мазохизма
    в инфантильной сексуальности.
  clinical_observability: умеренный
  example_context: После обсуждения диссоциация сексуальности пациент описывает переживания.
- id: B_A5_F13_006
  label: Диссоциация сексуальности — аспект 5
  area: A5
  family: F13
  definition: В сексуальной сфере способность переносить сохранение полиморфно- перверсной инфантильной сексуальности оставляет
    место для сексуального возбуждения с мазохистскими и садомазохистскими фантазиями и опытом.
  clinical_observability: умеренный
  example_context: При обсуждения диссоциация сексуальности пациент описывает переживания.
- id: B_A5_F14_001
  label: Избегание интимности
  area: A5
  family: F14
  definition: Для аналитика фобическое избегание признания реальности одного из аспектов своего поведения, замеченного пациентом
    и вызвавшего определенную реакцию с его стороны, является технической ошибкой.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с избегание интимности.
- id: B_A5_F14_002
  label: Избегание
  area: A5
  family: F14
  definition: Но такое избегание проблемы является, конечно же, неудовлетворительным.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления избегание интимности.
- id: B_A5_F14_003
  label: Избегание интимности — аспект 2
  area: A5
  family: F14
  definition: Твердое поддержание аналитиком технической нейтральности, избегание коммуникации с пациентом контрпереноса,
    избегание установления параметров техники, первоначально незапланированные для этого лечения, — все это может увеличить
    его внутреннюю свободу для фантазирования во время сеансов вместе с пациентом, так же как и за пределами сеансов.
  clinical_observability: умеренный
  example_context: Когда обсуждения избегание интимности пациент описывает переживания.
- id: B_A5_F14_004
  label: Избегание интимности — аспект 3
  area: A5
  family: F14
  definition: Я считаю, однако, что избегание Бионом анализа вопросов контрпереноса с тяжело регрессивными пациентами и указание,
    что концепция контрпереноса должна быть сохранена в ее узком значении и потому должна указывать на патологию терапевта,
    лишает анализ влияния всего поля контртрансферентных реакций.
  clinical_observability: умеренный
  example_context: В ходе обсуждения избегание интимности пациент описывает переживания.
- id: B_A5_F14_005
  label: Избегание интимности — аспект 4
  area: A5
  family: F14
  definition: Напротив, защитное разрушение или избегание объектных отношений и защитное размывание границ между “Я” и “не
    Я” с последующей потерей проверки реальности характерны для психоза, а не для нормального симбиоза.
  clinical_observability: умеренный
  example_context: После обсуждения избегание интимности пациент описывает переживания.
- id: B_A5_F14_006
  label: Избегание интимности — аспект 5
  area: A5
  family: F14
  definition: Общее в этих случаях — это распространяющееся разложение обычной человеческой интимности, зависимости, эмоциональной
    преданности и любви.
  clinical_observability: умеренный
  example_context: При обсуждения избегание интимности пациент описывает переживания.
- id: B_A5_F15_001
  label: Сексуализированная зависимость
  area: A5
  family: F15
  definition: Одна из наиболее постоянных особенностей переноса, в котором преобладают действия вовне, выражающие глубинную
    зависть, это необычная зависимость пациента от терапевта, проявляющаяся совместно с агрессией по отношению к терапевту
    — впечатляющая демонстрация “фиксации на травме”.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с сексуализированная зависимость.
- id: B_A5_F15_002
  label: Сексуализированная
  area: A5
  family: F15
  definition: 'Депрессивно-мазохистское расстройство личности характеризуется тремя особыми типами черт характера: (1) чертами,
    отражающими непреклонность Супер-Эго, (2) чертами, отражающими сверхзависимость от поддержки, любви и принятия со стороны
    других людей, (3) чертами, отражающими трудности в выражении агрессии.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления сексуализированная зависимость.
- id: B_A5_F15_003
  label: Сексуализированная зависимость — аспект 2
  area: A5
  family: F15
  definition: Черты, отражающие сверхзависимость от поддержки, любви и принятия со стороны окружающих, являются проявлением,
    как показывает психоаналитическое исследование, тенденции чувствовать чрезмерную вину перед другими людьми из- за бессознательной
    амбивалентности по отношению к любимым и необходимым объектам и быть гиперреакцией на фрустрацию, когда ожидания этих
    пациентов не оправдываются.
  clinical_observability: умеренный
  example_context: Когда обсуждения сексуализированная зависимость пациент описывает переживания.
- id: B_A5_F15_004
  label: Сексуализированная зависимость — аспект 3
  area: A5
  family: F15
  definition: Динамические особенности подобных пациентов включают тяжелые конфликты, как Эдиповы, так и преэдиповы, особенно
    внутреннюю зависимость от примитивных материнских образов, которые воспринимаются как садистские, нечестные и контролирующие.
  clinical_observability: умеренный
  example_context: В ходе обсуждения сексуализированная зависимость пациент описывает переживания.
- id: B_A5_F15_005
  label: Сексуализированная зависимость — аспект 4
  area: A5
  family: F15
  definition: Их зависимость от того, как другие люди их оценивают, сбалансирована четким ощущением того, каким социально
    признанным реальным требованиям они должны соответствовать, чтобы получать эту любовь и одобрение, а их детская, льнущая
    зависимость ограничена сексуальным контекстом.
  clinical_observability: умеренный
  example_context: После обсуждения сексуализированная зависимость пациент описывает переживания.
- id: B_A5_F15_006
  label: Сексуализированная зависимость — аспект 5
  area: A5
  family: F15
  definition: Другая характеристика, обычно приписываемая истерической личности, — чрезмерная зависимость.
  clinical_observability: умеренный
  example_context: При обсуждения сексуализированная зависимость пациент описывает переживания.
- id: B_A5_F16_001
  label: Сексуализированная месть
  area: A5
  family: F16
  definition: Желание быть уникальным, предпочитаемым, одержавшим победу, единственным и исключительным объектом любви сексуального
    партнера (что актуализирует победу над эдиповым соперником в каждом сексуальном акте) является составляющей частью другого
    желания — быть одновременно с двумя партнерами противоположного пола — как месть фрустрирующему, дразнящему, отказывающему
    эдипову родителю.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с сексуализированная месть.
- id: B_A5_F16_002
  label: Сексуализированная
  area: A5
  family: F16
  definition: 'Интенсивность эротизированного переноса у пациентов с истерической личностной структурой представляет классический
    пример трансферентной любви: защитная сексуализированная идеализация аналитика часто скрывает значительную бессознательную
    агрессию, корни которой лежат в эдиповом разочаровании и бессознательной эдиповой вине.'
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления сексуализированная месть.
- id: B_A5_F16_003
  label: Сексуализированная месть — аспект 2
  area: A5
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сексуализированная месть» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: Когда обсуждения сексуализированная месть пациент описывает переживания.
- id: B_A5_F16_004
  label: Сексуализированная месть — аспект 3
  area: A5
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сексуализированная месть» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: В ходе обсуждения сексуализированная месть пациент описывает переживания.
- id: B_A5_F16_005
  label: Сексуализированная месть — аспект 4
  area: A5
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сексуализированная месть» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: После обсуждения сексуализированная месть пациент описывает переживания.
- id: B_A5_F16_006
  label: Сексуализированная месть — аспект 5
  area: A5
  family: F16
  definition: Наблюдаемое клиническое проявление, связанное с областью «Сексуализированная месть» в контексте объектных отношений
    и защит (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения сексуализированная месть пациент описывает переживания.
- id: B_A5_F17_001
  label: Нарушение границ
  area: A5
  family: F17
  definition: он стал считать их врожденными предпосылками (границами и руслами развития) Эго.
  clinical_observability: умеренный
  example_context: При сексуальной страсти преодоление временных границ Я также происходит под знаком принятия обязательств
    на будущее по отношению к объекту любви как к идеалу, придающему жизни личный смысл.
- id: B_A5_F17_002
  label: Нарушение
  area: A5
  family: F17
  definition: Несомненно, что данное Якобсон (Jacobson, 1964) описание ранних уровней развития Супер-Эго и описание Фэйрберном
    трудностей, возникающих при интернализации плохих объектов, имеют поразительное сходство — если мы выйдем за границы семантических
    барьеров и существующих между ними базовых метапсихологических различий.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления нарушение границ.
- id: B_A5_F17_003
  label: Нарушение границ — аспект 2
  area: A5
  family: F17
  definition: Культуральные стереотипы в отношении гендерных ролей, распределение власти между полами и границы одобряемого
    и разрешаемого сексуального поведения имеют решающее значение для динамической организации патологических черт характера.
  clinical_observability: умеренный
  example_context: Когда обсуждения нарушение границ пациент описывает переживания.
- id: B_A5_F17_004
  label: Нарушение границ — аспект 3
  area: A5
  family: F17
  definition: Я также хотел ослабить размывание границ между “Я” и объектом, которое она, возможно, испытывала.
  clinical_observability: умеренный
  example_context: В ходе обсуждения нарушение границ пациент описывает переживания.
- id: B_A5_F17_005
  label: Нарушение границ — аспект 4
  area: A5
  family: F17
  definition: Если центральной проблемой с пограничными пациентами является активация примитивных, переполняющих частичных
    объектных отношений, которые постоянно меняют распределение ролей в переносе и требуют длительного времени для своего
    прослеживания вспять к инфантильной реальности, то проблемой психозов является расплывчатость границ между репрезентациями
    “Я” и объектов.
  clinical_observability: умеренный
  example_context: После обсуждения нарушение границ пациент описывает переживания.
- id: B_A5_F17_006
  label: Нарушение границ — аспект 5
  area: A5
  family: F17
  definition: Так что примитивное превращение ее страха потери границ “Я” в чувство, что физическая энергия изымается из ее
    тела (т.е.
  clinical_observability: умеренный
  example_context: При обсуждения нарушение границ пациент описывает переживания.
- id: B_A5_F18_001
  label: Путаница ролей
  area: A5
  family: F18
  definition: Эти функции включают сдвиг с интереса к телесным функциям на интерес к социальным функциям и разыгрыванию ролей.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с путаница ролей.
- id: B_A5_F18_002
  label: Путаница
  area: A5
  family: F18
  definition: Обычно пациент отыгрывает объектные отношения между преследователем и жертвой, чередуя свои идентификации с
    каждой из этих ролей и проецируя дополнительную роль на терапевта.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления путаница ролей.
- id: B_A5_F18_003
  label: Путаница ролей — аспект 2
  area: A5
  family: F18
  definition: Различие между их в целом приемлемыми социальными взаимоотношениями и специфическими объектными отношениями,
    связанными с сексуальностью, состоит в том, что они склонны демонстрировать инфантильное, регрессивное поведение только
    в ситуациях, которые имеют реальный или символический сексуальный характер и касаются людей, воспринимаемых ими как носителейиодительских
    ролей.
  clinical_observability: умеренный
  example_context: Когда обсуждения путаница ролей пациент описывает переживания.
- id: B_A5_F18_004
  label: Путаница ролей — аспект 3
  area: A5
  family: F18
  definition: Культуральные стереотипы в отношении гендерных ролей, распределение власти между полами и границы одобряемого
    и разрешаемого сексуального поведения имеют решающее значение для динамической организации патологических черт характера.
  clinical_observability: умеренный
  example_context: В ходе обсуждения путаница ролей пациент описывает переживания.
- id: B_A5_F18_005
  label: Путаница ролей — аспект 4
  area: A5
  family: F18
  definition: С течением времени она смогла понять, что эти серии отыгрываний были аспектом отношений с матерью, активирующихся
    со сменой ролей.
  clinical_observability: умеренный
  example_context: После обсуждения путаница ролей пациент описывает переживания.
- id: B_A5_F18_006
  label: Путаница ролей — аспект 5
  area: A5
  family: F18
  definition: Если центральной проблемой с пограничными пациентами является активация примитивных, переполняющих частичных
    объектных отношений, которые постоянно меняют распределение ролей в переносе и требуют длительного времени для своего
    прослеживания вспять к инфантильной реальности, то проблемой психозов является расплывчатость границ между репрезентациями
    “Я” и объектов.
  clinical_observability: умеренный
  example_context: При обсуждения путаница ролей пациент описывает переживания.
- id: B_A5_F19_001
  label: Перверсные сценарии отношений
  area: A5
  family: F19
  definition: Отто Кернберг также много сделал для внедрения теории объектных отношений Мелани Кляйн и других британских психоаналитиков
    в основанную на эго-психологии теорию и практику американского психоанализа.
  clinical_observability: умеренный
  example_context: После месяцев проработки этой парадигмы переноса появился новый аспект отношений г-жи А.
- id: B_A5_F19_002
  label: Перверсные
  area: A5
  family: F19
  definition: В третьей и четвертой частях книги я излагаю свою теорию эго- психологии — объектных отношений в ее приложении
    к клинической ситуации.
  clinical_observability: умеренный
  example_context: Пациент переживает перемену самосознания и своих внутренних отношений с окружающими и бывает удивлен характером
    своих переживаний — неожиданным для него и для его аналитика.
- id: B_A5_F19_003
  label: Перверсные сценарии
  area: A5
  family: F19
  definition: '*** За тот вклад, который они внесли в мои размышления о теории объектных отношений, я благодарен докторам
    Сельме Крамер, Райнеру Краузе, Джозефу и Анне-Мари Сандлер, Эрнсту и Гертруде Тихо, а также Джону Сазерленду.'
  clinical_observability: умеренный
  example_context: При наихудшем сценарии возникает удушающее чувство несвободы и преследования со стороны другого.
- id: B_A5_F19_004
  label: Перверсные сценарии отношений — аспект 3
  area: A5
  family: F19
  definition: Пытаясь прояснить взаимоотношения между аффектами и настроениями, Якобсон (Jacobson1957b) определяет настроения
    как временную фиксацию и генерализацию аффектов по отношению ко всему миру интернализованных объектных отношений, т.е.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A5_F19_005
  label: Перверсные сценарии отношений — аспект 4
  area: A5
  family: F19
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: Примером служит случай одной нарциссической женщины с долгой историей эксплуататорских отношений с властными
    мужчинами и ведущей жизнь, свидетельствующую об эгоцентризме и самовозвеличивании.
- id: B_A5_F19_006
  label: Перверсные сценарии отношений — аспект 5
  area: A5
  family: F19
  definition: Аффект и объект Я предполагаю, что раннее аффективное развитие основано на прямой фиксации ранних аффективно
    заряженных объектных отношений в форме аффективной памяти.
  clinical_observability: умеренный
  example_context: Терапевт создает гипотезу о природе примитивных, фантастических и диссоциированных объектных отношений,
    которые активизировались.
- id: B_A5_F20_001
  label: Стыд сексуальности
  area: A5
  family: F20
  definition: Его также интересуют вопросы агрессии, деструктивности и ненависти и, одновременно, любви и сексуальности в
    норме и патологии.
  clinical_observability: умеренный
  example_context: При обсуждении этих вопросов особое внимание уделяется гомосексуальности в силу того особого положения,
    которое она занимает в современной психоаналитической теории.
- id: B_A5_F20_002
  label: Стыд
  area: A5
  family: F20
  definition: Дуалистическая теория влечений — сексуальности и агрессивности (Freud, 1920) — представляет собой его окончательную
    классификацию влечений как глубинных источников бессознательного психического конфликта и образования психических структур.
  clinical_observability: умеренный
  example_context: При клинических перверсиях они могут также служить функции создания “неосексуальности” (Mc Dougall, 1985),
    или избегания эдиповой ситуации путем идеализации преэдиповых сексуальных предшественников.
- id: B_A5_F20_003
  label: Стыд сексуальности — аспект 2
  area: A5
  family: F20
  definition: Во-первых, он находит мазохистские элементы в бесчисленных формах сексуального поведения и видит рудименты мазохизма
    в инфантильной сексуальности.
  clinical_observability: умеренный
  example_context: Пациенты с преобладанием такого вида психопатологии обычно способны влюбляться и устанавливать стабильные
    отношения в контексте некоторого сдерживания генитальной сексуальности.
- id: B_A5_F20_004
  label: Стыд сексуальности — аспект 3
  area: A5
  family: F20
  definition: В сексуальной сфере способность переносить сохранение полиморфно- перверсной инфантильной сексуальности оставляет
    место для сексуального возбуждения с мазохистскими и садомазохистскими фантазиями и опытом.
  clinical_observability: умеренный
  example_context: В ходе обсуждения стыд сексуальности пациент описывает переживания.
- id: B_A5_F20_005
  label: Стыд сексуальности — аспект 4
  area: A5
  family: F20
  definition: Как будет замечено в главе 16, садомазохистский аспект инфантильной сексуальности играет важную роль в поддержании
    равновесия между либидинальными и агрессивными стремлениями, так как представляет собою примитивную форму синтеза любви
    и ненависти.
  clinical_observability: умеренный
  example_context: После обсуждения стыд сексуальности пациент описывает переживания.
- id: B_A5_F20_006
  label: Стыд сексуальности — аспект 5
  area: A5
  family: F20
  definition: Если говорить коротко, организация Эго, объектные отношения, развитие Супер-Эго, нарциссическая организация
    и степень интеграции полиморфной перверсной детской сексуальности являются кодетерминантами уровня и клинических особенностей
    мазохистской патологии.
  clinical_observability: умеренный
  example_context: При обсуждения стыд сексуальности пациент описывает переживания.
- id: B_A5_F21_001
  label: Идентичность и сексуальность
  area: A5
  family: F21
  definition: Все эти личностные расстройства обнаруживают хорошо интегрированную личностную идентичность, неспецифические
    проявления силы Эго (хорошая толерантность к тревоге, контроль импульсов и сублиматорная деятельность) и жесткое, но хорошо
    интегрированное Супер-Эго.
  clinical_observability: умеренный
  example_context: Пациентам с пограничной личностной организацией свойственна диффузная идентичность, но у нарциссической
    личности все осложняется еще одним феноменом.
- id: B_A5_F21_002
  label: Идентичность
  area: A5
  family: F21
  definition: Различие между их в целом приемлемыми социальными взаимоотношениями и специфическими объектными отношениями,
    связанными с сексуальностью, состоит в том, что они склонны демонстрировать инфантильное, регрессивное поведение только
    в ситуациях, которые имеют реальный или символический сексуальный характер и касаются людей, воспринимаемых ими как носителейиодительских
    ролей.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления идентичность и сексуальность.
- id: B_A5_F21_003
  label: Идентичность и
  area: A5
  family: F21
  definition: Женщины с истерической личностью обычно демонстрируют псевдогиперсексуальность в сочетании с сексуальной заторможенностью;
    они одновременно сексуально провокативны и фригидны.
  clinical_observability: умеренный
  example_context: Когда обсуждения идентичность и сексуальность пациент описывает переживания.
- id: B_A5_F21_004
  label: Идентичность и сексуальность — аспект 3
  area: A5
  family: F21
  definition: Сценическая личность у мужчин Сценические личности у мужчин обычно представлены размытой идентичностью, тяжелыми
    расстройствами объектных отношений и слабостью контроля за импульсами.
  clinical_observability: умеренный
  example_context: В ходе обсуждения идентичность и сексуальность пациент описывает переживания.
- id: B_A5_F21_005
  label: Идентичность и сексуальность — аспект 4
  area: A5
  family: F21
  definition: Кумулятивный эффект неспособности придерживаться личных, профессиональных, культурных и социальных ценностей,
    частые нарушения или неудачи в близких отношениях и размытая идентичность, типичные для личности таких пациентов, — все
    это может препятствовать обычному социальному научению и приводить к порочному кругу, ухудшающему их функционирование
    с годами.
  clinical_observability: умеренный
  example_context: После обсуждения идентичность и сексуальность пациент описывает переживания.
- id: B_A5_F21_006
  label: Идентичность и сексуальность — аспект 5
  area: A5
  family: F21
  definition: Структура Эго у этих пациентов организована вокруг вытеснения и характеризуется твердой Эго-идентичностью, что
    отражается в типичных проявлениях невротических переносов.
  clinical_observability: умеренный
  example_context: При обсуждения идентичность и сексуальность пациент описывает переживания.
- id: B_A5_F22_001
  label: Фантазийная сексуальная власть
  area: A5
  family: F22
  definition: И наоборот, реакции гнева на фрустрации в оральный период и борьба за власть в анальный период могут соединить
    созвучные агрессивные аффективные состояния, приводя таким образом к интеграции агрессивного влечения.
  clinical_observability: умеренный
  example_context: При осмыслении этих событий я получил большую поддержку от Клары, старшей медсестры моего отделения, которая
    рассказала мне, что Лусия всегда вела себя соблазняюще с мужчинам, обладающими властью.
- id: B_A5_F22_002
  label: Фантазийная
  area: A5
  family: F22
  definition: Еще более мягкая форма ненависти проявляется в страстном желании доминировать над объектом, обладать властью
    над ним, что тоже может включать в себя садистские компоненты, но при этом нападки на объект ограничены требованием подчинения,
    что подразумевает подтверждение свободы и автономии субъекта.
  clinical_observability: умеренный
  example_context: Когда же они поженились, слабая сексуальная возбудимость жены, которую он поначалу списывал на ее неопытность,
    стала вызывать у него все большее недовольство.
- id: B_A5_F22_003
  label: Фантазийная сексуальная
  area: A5
  family: F22
  definition: 'Лапланш и Понталис (Laplanche and Pontalis, 1973) дали наиболее краткое и, на мой взгляд, наиболее удачное
    определение мазохизма во всей психоаналитической литературе: “Сексуальная перверсия, при которой удовольствие связано
    со страданием или унижением, которому подвергается субъект”.'
  clinical_observability: умеренный
  example_context: Когда я представлял ему эти факты, он охотно признавал свою ложь, оправдывая свое поведение как нечто вполне
    логичное в мире ограниченных и жестких людей, пользующихся своей властью.
- id: B_A5_F22_004
  label: Фантазийная сексуальная власть — аспект 3
  area: A5
  family: F22
  definition: Мазохистское сексуальное поведение и перверсия Мазохизм как сексуальная перверсия характеризуется жестким, обязательным
    отыгрыванием мазохистского поведения для достижения сексуального возбуждения и оргазма (Freud, 1905; Laplanche and Pontalis,
    1913).
  clinical_observability: умеренный
  example_context: В ходе обсуждения фантазийная сексуальная власть пациент описывает переживания.
- id: B_A5_F22_005
  label: Фантазийная сексуальная власть — аспект 4
  area: A5
  family: F22
  definition: Сексуальная перверсия может включать символическое отыгрывание переживаний первичной сцены, таких как эдипов
    треугольник в форме menage a trois (любви втроем), при которой мазохистский субъект принужден наблюдать сексуальные отношения
    между объектом любви и соперником, в качестве условия для полового акта и удовлетворения.
  clinical_observability: умеренный
  example_context: После обсуждения фантазийная сексуальная власть пациент описывает переживания.
- id: B_A5_F22_006
  label: Фантазийная сексуальная власть — аспект 5
  area: A5
  family: F22
  definition: В подобных случаях сексуальная перверсия не укладывается в рамки “как бы” игры и отражает серьезную патологию
    объектных отношений.
  clinical_observability: умеренный
  example_context: При обсуждения фантазийная сексуальная власть пациент описывает переживания.
- id: B_A5_F23_001
  label: Защитная сексуализация
  area: A5
  family: F23
  definition: Такая защитная диссоциация, похоже, иллюстрирует традиционную психологическую точку зрения, что аффект, восприятие,
    познание и действие — это отдельные функции Эго.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с защитная сексуализация.
- id: B_A5_F23_002
  label: Защитная
  area: A5
  family: F23
  definition: Есть, испражняться, спать, заниматься сексом, чувствовать возбуждение, не будучи обнаруженным со стороны окружающего
    опасного, хотя и безличного мира — все это создает особый способ адаптации к жизни, даже если это адаптация волка, замаскировавшегося
    для жизни среди овец в реальном страхе перед также замаскировавшимися другими волками, против которых и возникает защитная
    “овечья шкура”.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления защитная сексуализация.
- id: B_A5_F23_003
  label: Защитная сексуализация — аспект 2
  area: A5
  family: F23
  definition: Действительно, защитная отстраненность аналитика, чувства нетерпения и скуки, которые в контрпереносе нередко
    сигнализируют об активации регрессивного переноса у инфантильных личностей, могут быть спутаны со сходными реакциями на
    нарциссическое сопротивление переносу.
  clinical_observability: умеренный
  example_context: Когда обсуждения защитная сексуализация пациент описывает переживания.
- id: B_A5_F23_004
  label: Защитная сексуализация — аспект 3
  area: A5
  family: F23
  definition: Проективная идентификация, таким образом, это примитивная защитная операция, но она не обязательно связана с
    психозом.
  clinical_observability: умеренный
  example_context: В ходе обсуждения защитная сексуализация пациент описывает переживания.
- id: B_A5_F23_005
  label: Защитная сексуализация — аспект 4
  area: A5
  family: F23
  definition: Самонаблюдение является всегда ключевым фокусом интерпретативной работы при пограничной организации личности,
    при которой защитная диссоциация “Я” представляет главное текущее сопротивление.
  clinical_observability: умеренный
