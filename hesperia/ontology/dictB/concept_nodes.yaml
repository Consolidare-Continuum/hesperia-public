  example_context: Когда обсуждения интерпретация пациент описывает переживания.
- id: B_A8_F14_004
  label: Интерпретация — аспект 3
  area: A8
  family: F14
  definition: Перенос и интерпретация переноса Главным вкладом теории объектных отношений в анализ переноса является расширение
    того поля, в рамках которого происходит исследование явлений переноса, так что становятся возможными понимание и интерпретация
    возрастающей по своей сложности трансферентной регрессии пациентов глубокого уровня психопатологии.
  clinical_observability: умеренный
  example_context: В ходе обсуждения интерпретация пациент описывает переживания.
- id: B_A8_F14_005
  label: Интерпретация — аспект 4
  area: A8
  family: F14
  definition: Моя интерпретация фокусируется на восприятии ею меня как своей критикующей матери, после чего она чувствует,
    что я помог ей, и выражает свое одобрение.
  clinical_observability: умеренный
  example_context: После обсуждения интерпретация пациент описывает переживания.
- id: B_A8_F14_006
  label: Интерпретация — аспект 5
  area: A8
  family: F14
  definition: Моя интерпретация обнажила отщепленный идеализированный аспект отношений пациентки с матерью, наполненных опасностью
