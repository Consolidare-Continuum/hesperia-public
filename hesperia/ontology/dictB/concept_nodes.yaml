  clinical_observability: умеренный
  example_context: При обсуждения интерпретация пациент описывает переживания.
- id: B_A8_F15_001
  label: Анализ переноса
  area: A8
  family: F15
  definition: Сделанные теоретические выводы, касающиеся агрессии и ненависти, автор применяет для создания новых технических
    подходов в работе с тяжелыми расстройствами личности в рамках психоанализа.
  clinical_observability: умеренный
  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A8_F15_002
  label: Анализ
  area: A8
  family: F15
  definition: Как известно, первоначально психоанализ создавался для лечения неврозов (хотя, с точки зрения нынешней классификации,
