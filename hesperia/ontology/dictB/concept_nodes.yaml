  label: Изменения отношений — аспект 2
  area: A10
  family: F17
  definition: В третьей и четвертой частях книги я излагаю свою теорию эго- психологии — объектных отношений в ее приложении
    к клинической ситуации.
  clinical_observability: умеренный
  example_context: Пациент переживает перемену самосознания и своих внутренних отношений с окружающими и бывает удивлен характером
    своих переживаний — неожиданным для него и для его аналитика.
- id: B_A10_F17_004
  label: Изменения отношений — аспект 3
  area: A10
  family: F17
  definition: '*** За тот вклад, который они внесли в мои размышления о теории объектных отношений, я благодарен докторам
    Сельме Крамер, Райнеру Краузе, Джозефу и Анне-Мари Сандлер, Эрнсту и Гертруде Тихо, а также Джону Сазерленду.'
  clinical_observability: умеренный
  example_context: Когда я выражал удивление по поводу этого изменения, г-жа С.
