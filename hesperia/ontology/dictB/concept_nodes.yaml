  example_context: При рассмотрении спектра психопатологии ярости я вначале остановлюсь на последствиях этого аффекта для
    контрпереноса.
- id: B_A8_F16_002
  label: Наблюдение
  area: A8
  family: F16
  definition: Эта диспозиция, или аффективное состояние, не обязательно является сознательной и может быть выведена из свободных
    ассоциаций пациента, его невербального поведения и общей атмосферы, создаваемой смесью переноса пациента и контрпереноса
    аналитика.
  clinical_observability: умеренный
  example_context: Пациент, стремящийся понять, “как аналитик это сделал”, приписывает ему интеллектуализацию или говорит,
