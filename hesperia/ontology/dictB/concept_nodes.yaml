  clinical_observability: умеренный
  example_context: При отсутствии таких разрывов сексуальные отношения становятся частью обыденности, а это может привести
    к накоплению агрессии в переживании слияния, что является угрозой отношениям в целом.
- id: B_A8_F8_001
  label: Оценка нарциссизма
  area: A8
  family: F8
  definition: Кернберга очень интересуют вопросы патологического нарциссизма, который иногда, как мне кажется, превращается
