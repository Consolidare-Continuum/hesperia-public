  example_context: При обсуждения наблюдение контрпереноса пациент описывает переживания.
- id: B_A8_F17_001
  label: Диагностические гипотезы
  area: A8
  family: F17
  definition: С этими ограничениями диагностические критерии сценического расстройства личности, выделенные в DSM-III-R, адекватно
