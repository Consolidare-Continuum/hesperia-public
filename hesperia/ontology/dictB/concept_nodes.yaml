  clinical_observability: умеренный
  example_context: Когда обсуждения импульсы привязанности пациент описывает переживания.
- id: B_A1_F11_004
  label: Импульсы привязанности — аспект 3
  area: A1
  family: F11
  definition: 'Рассмотренные случаи объединяют: 1) сильные, примитивные агрессивные импульсы, 2) тяжелую патологию объектных
    отношений, 3) преобладание доэдиповых конфликтов и целей в сексуальном мазохистском сценарии и 4) недостаточную интеграцию
