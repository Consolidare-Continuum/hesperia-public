    (Кернберг).
  clinical_observability: умеренный
  example_context: При обсуждения сочувствие пациент описывает переживания.
- id: B_A7_F3_001
  label: Признание субъективности другого
  area: A7
  family: F3
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: При наихудшем сценарии возникает удушающее чувство несвободы и преследования со стороны другого.
- id: B_A7_F3_002
  label: Признание
  area: A7
  family: F3
  definition: И действительно, когда, говоря с клинической точки зрения, мы указываем на защитное использование одного влечения
    против другого, мы на самом деле говорим о защитной функции одного аффекта по отношению к другому.
  clinical_observability: умеренный
  example_context: Терапевт оставил ей и социальному работнику координаты другого психиатра, к которому в случае чего можно
    было обратиться в его отсутствие.
- id: B_A7_F3_003
  label: Признание субъективности
  area: A7
  family: F3
  definition: Структура фантазии отражает, таким образом, одновременное существоание прошлого, настоящего и будущего, что
    характерно для Ид, предваряя осознание и признание объективных ограничений пространства-времени, характерных для дифференцированного
    Эго (Jaques, 1982).
  clinical_observability: умеренный
  example_context: Пациент должен начать психоанализ у другого аналитика.
- id: B_A7_F3_004
  label: Признание субъективности другого — аспект 3
  area: A7
  family: F3
  definition: Имплицитно этот вопрос направлен против идеи ранней субъективности, раннего интрапсихического опыта до начала
    развития речи и ранней активации интрапсихических мотивационных систем.
  clinical_observability: умеренный
  example_context: Когда пациент позволяет “держать себя”, когда он может положиться на другого человека, это значит, что
    он “отпускает себя”, сознавая, что любое взаимоотношение несовершенно и рискованно.
- id: B_A7_F3_005
  label: Признание субъективности другого — аспект 4
  area: A7
  family: F3
  definition: Эта ранняя фаза имеет существенные для ее характеристики черты субъективности и не может рассматриваться как
    эквивалент стадии, на которой проявляются ранние способности к перекрестной дифференцировке моделей, которая, как подразумевается,
    соответствует врожденным способностям, оптимально наблюдаемым в экспериментальных условиях слабого или модулированного
    аффекта.
  clinical_observability: умеренный
  example_context: После обсуждения признание субъективности другого пациент описывает переживания.
- id: B_A7_F3_006
  label: Признание субъективности другого — аспект 5
  area: A7
  family: F3
  definition: Однако в клинической ситуации анализ реакций ярости — так же как и других интенсивных аффективных состояний
    — всегда открывает лежащие за ними сознательные и бессознательные фантазии, включающие специфические отношения между аспектом
    “Я” и аспектом значимого другого.
  clinical_observability: умеренный
  example_context: При обсуждения признание субъективности другого пациент описывает переживания.
- id: B_A7_F4_001
  label: Эмоциональная взаимность
  area: A7
  family: F4
  definition: Различие между нормальной и мазохистской влюбленностями заключается именно в том, что мазохистские личности
    чувствуют непреодолимое притяжение к тем объектам, которые не отвечают взаимностью.
  clinical_observability: умеренный
  example_context: При нормальных условиях объект любви, не отвечающий взаимностью на любовь субъекта, оставляется им посредством
    процесса оплакивания.
- id: B_A7_F4_002
  label: Эмоциональная
  area: A7
  family: F4
  definition: Действительно, мазохистскую влюбленность характеризует бессознательный выбор такого объекта, который явно не
    способен или не хочет ответить взаимностью.
  clinical_observability: умеренный
  example_context: После смерти ребенка она впервые смогла установить отношения с мужчиной, в которых были и взаимность, и
    преданность.
- id: B_A7_F4_003
  label: Эмоциональная взаимность — аспект 2
  area: A7
  family: F4
  definition: Пожертвовать собой и всеми своими интересами для кого-либо, кто не отвечает взаимностью (как это драматически
    иллюстрирует новелла Генриха Манна и фильм “Голубой ангел”), значит, по-видимому, обладать депрессивно- мазохистским расстройством
    личности.
  clinical_observability: умеренный
  example_context: Когда обсуждения эмоциональная взаимность пациент описывает переживания.
- id: B_A7_F4_004
  label: Эмоциональная взаимность — аспект 3
  area: A7
  family: F4
  definition: Истерическая личность у женщин Главная характеристика этих женщин — эмоциональная лабильность.
  clinical_observability: умеренный
  example_context: В ходе обсуждения эмоциональная взаимность пациент описывает переживания.
- id: B_A7_F4_005
  label: Эмоциональная взаимность — аспект 4
  area: A7
  family: F4
  definition: Другие атрибуты, подразумевающие недостаточную способность к эмоциональной вовлеченности вкупе с недостатком
    моральных функций также не характерны для этого расстройства личности — например, эмоциональная поверхностность, ложные
    аффекты, лживость и pseudologia fantastica, упоминаемые в более ранней литературе.
  clinical_observability: умеренный
  example_context: После обсуждения эмоциональная взаимность пациент описывает переживания.
- id: B_A7_F4_006
  label: Эмоциональная взаимность — аспект 5
  area: A7
  family: F4
  definition: Типичными симптомами нарциссической личности в области патологической любви к себе являются чрезмерные внимание
    к себе и центрированность на себе; грандиозность и различные производные эксгибиционизма, позиция превосходства, безрассудство
    и сверхамбициозность; сверхзависимость от восхищения; эмоциональная пустота; приступы чрезмерной беззащитности, чередующиеся
    с грандиозностью.
  clinical_observability: умеренный
  example_context: При обсуждения эмоциональная взаимность пациент описывает переживания.
- id: B_A7_F5_001
  label: Способность к близости
  area: A7
  family: F5
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A7_F5_002
  label: Способность
  area: A7
  family: F5
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациент ненавидит также (поскольку он ей завидует) творческую способность терапевта, выражающуюся в попытках
    понять пациента и передать ему свое понимание.
- id: B_A7_F5_003
  label: Способность к
  area: A7
  family: F5
  definition: Из-за этого страдает и способность самого аналитика к эмпатическому пониманию пациента.
  clinical_observability: умеренный
  example_context: Природа доэдиповых влияний на способность к сексуальной любви являлась предметом важных психоаналитических
    исследований.
- id: B_A7_F5_004
  label: Способность к близости — аспект 3
  area: A7
  family: F5
  definition: В дополнение к этому, у младенца существует удивительно ранняя способность к когнитивной дифференцировке, которая
    предполагает наличие потенциала и для дифференциации аффектов.
  clinical_observability: умеренный
  example_context: При небольших отклонениях пациенты проявляют ограниченную способность к мимолетным увлечениям.
- id: B_A7_F5_005
  label: Способность к близости — аспект 4
  area: A7
  family: F5
  definition: Ненависть и неспособность выносить общение с объектом защищают пациента от того, что может в ином случае проявиться
    как сочетание жестоких нападок на объект, параноидных страхов перед ним и направленной на самого себя агрессии при идентификации
    с объектом.
  clinical_observability: умеренный
  example_context: При долгом участии (от 6 месяцев до 1 года) в такой полиморфной перверзивной деятельности их способность
    к сексуальной близости (и, по этой же причине, всякая близость) прекращается (Бартель, 1971).
- id: B_A7_F5_006
  label: Способность к близости — аспект 5
  area: A7
  family: F5
  definition: С клинической точки зрения, перенос характеризуется высокомерием, любопытством и псевдотупостью (неспособностью
    понимать то, что говорит терапевт), описанными Бионом (1957а), что иллюстрируют выраженные в форме действия вовне зависть
    пациента к терапевту, разрушение смысла и садизм.
  clinical_observability: умеренный
  example_context: Примитивные диссоциативные механизмы могут сдерживать перверсии в рамках стабильного равновесия пары, которой
    удается достичь чрезвычайной близости при доминирующей роли агрессии.
- id: B_A7_F6_001
  label: Доверие в отношениях
  area: A7
  family: F6
  definition: По мере накопления клинического опыта и развития теоретических концепций о ранних отношениях ребенка и матери,
    переносе/контрпереносе, объектных отношениях, аналитической ситуации и т.п.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A7_F6_002
  label: Доверие
  area: A7
  family: F6
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Последовал длительный период анализа, когда мы исследовали ее фантазии и страхи в развивающихся отношениях
    с К.
- id: B_A7_F6_003
  label: Доверие в
  area: A7
  family: F6
  definition: Нам необходимо найти такую мотивационную организацию, которая позволит обосновать всю сложную интеграцию аффективного
    развития во взаимоотношениях с родительскими фигурами.
  clinical_observability: умеренный
  example_context: Пациентка двадцати с небольшим лет была “в чудесных отношениях” со своим психотерапевтом в госпитале, с
    которым обсуждала свои детские переживания.
- id: B_A7_F6_004
  label: Доверие в отношениях — аспект 3
  area: A7
  family: F6
  definition: Это аффективное состояние включает интернализованные объектные отношения, имеющие в своей основе конкретную
    репрезентацию “Я”, находящуюся в отношениях с конкретной репрезентацией объекта под влиянием конкретного аффекта.
  clinical_observability: умеренный
  example_context: В ходе обсуждения доверие в отношениях пациент описывает переживания.
- id: B_A7_F6_005
  label: Доверие в отношениях — аспект 4
  area: A7
  family: F6
  definition: Оно представляет собой интрапсихическую структуру высшего порядка, природа которой подтверждается в поведении,
    выражается в формировании характера и в человеческой глубине и моральной определенности в отношениях с другими людьми.
  clinical_observability: умеренный
  example_context: После обсуждения доверие в отношениях пациент описывает переживания.
- id: B_A7_F6_006
  label: Доверие в отношениях — аспект 5
  area: A7
  family: F6
  definition: Подоплекой этой потребности в разрушении реальности и общения в близких отношениях является, по моему мнению,
    бессознательная и сознательная зависть к объекту, особенно к такому объекту, который сам внутренне не охвачен подобной
    ненавистью.
  clinical_observability: умеренный
  example_context: При обсуждения доверие в отношениях пациент описывает переживания.
- id: B_A7_F7_001
  label: Надёжная привязанность
  area: A7
  family: F7
  definition: Сильная привязанность к фрустрирующей матери является главным источником превращения ярости в ненависть.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с надёжная привязанность.
- id: B_A7_F7_002
  label: Надёжная
  area: A7
  family: F7
  definition: Наиболее тяжелая психопатологическая привязанность была описана у младенцев, поведение матерей которых сочетало
    в себе отвержение, насилие, хаос и дразнящую сверхстимуляцию наряду с хронической фрустрацией (Fraiberg, 1983; Galenson,
    1986).
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления надёжная привязанность.
- id: B_A7_F7_003
  label: Надёжная привязанность — аспект 2
  area: A7
  family: F7
  definition: Фиксация на специфических ненавистных объектах может наблюдаться вместе с целым спектром психопатологии и иллюстрирует,
    иногда почти в карикатурной форме, привязанность к врагу или преследователю.
  clinical_observability: умеренный
  example_context: Когда обсуждения надёжная привязанность пациент описывает переживания.
- id: B_A7_F7_004
  label: Надёжная привязанность — аспект 3
  area: A7
  family: F7
  definition: Мазохистская привязанность к недоступному объекту любви может также проявляться у пациентов с истерической структурой
    личности.
  clinical_observability: умеренный
  example_context: В ходе обсуждения надёжная привязанность пациент описывает переживания.
- id: B_A7_F7_005
  label: Надёжная привязанность — аспект 4
  area: A7
  family: F7
  definition: Идеализированный образ самого себя и эго-синтонная садистская, самообслуживающая идеология рационализируют антисоциальное
    поведение и могут сосуществовать со способностью испытывать привязанность к своим товарищам.
  clinical_observability: умеренный
  example_context: После обсуждения надёжная привязанность пациент описывает переживания.
- id: B_A7_F7_006
  label: Надёжная привязанность — аспект 5
  area: A7
  family: F7
  definition: Он считает, что, принимая во внимание сильную привязанность младенца к матери и симбиотические отношения с ней,
    ранняя идентификация младенцев обоих полов носит фемининный характер.
  clinical_observability: умеренный
  example_context: При обсуждения надёжная привязанность пациент описывает переживания.
- id: B_A7_F8_001
  label: Стабильность отношений
  area: A7
  family: F8
  definition: Отто Кернберг также много сделал для внедрения теории объектных отношений Мелани Кляйн и других британских психоаналитиков
    в основанную на эго-психологии теорию и практику американского психоанализа.
  clinical_observability: умеренный
  example_context: После месяцев проработки этой парадигмы переноса появился новый аспект отношений г-жи А.
- id: B_A7_F8_002
  label: Стабильность
  area: A7
  family: F8
  definition: В третьей и четвертой частях книги я излагаю свою теорию эго- психологии — объектных отношений в ее приложении
    к клинической ситуации.
  clinical_observability: умеренный
  example_context: Пациент переживает перемену самосознания и своих внутренних отношений с окружающими и бывает удивлен характером
    своих переживаний — неожиданным для него и для его аналитика.
- id: B_A7_F8_003
  label: Стабильность отношений — аспект 2
  area: A7
  family: F8
  definition: '*** За тот вклад, который они внесли в мои размышления о теории объектных отношений, я благодарен докторам
    Сельме Крамер, Райнеру Краузе, Джозефу и Анне-Мари Сандлер, Эрнсту и Гертруде Тихо, а также Джону Сазерленду.'
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A7_F8_004
  label: Стабильность отношений — аспект 3
  area: A7
  family: F8
  definition: Пытаясь прояснить взаимоотношения между аффектами и настроениями, Якобсон (Jacobson1957b) определяет настроения
    как временную фиксацию и генерализацию аффектов по отношению ко всему миру интернализованных объектных отношений, т.е.
  clinical_observability: умеренный
  example_context: Примером служит случай одной нарциссической женщины с долгой историей эксплуататорских отношений с властными
    мужчинами и ведущей жизнь, свидетельствующую об эгоцентризме и самовозвеличивании.
- id: B_A7_F8_005
  label: Стабильность отношений — аспект 4
  area: A7
  family: F8
  definition: генерализацию аффективного состояния на все репрезентации “Я” и объектов индивида на ограниченный промежуток
    времени; настроения, таким образом, являются обширными, хотя и относительно слабыми аффективными состояниями, которые
    окрашивают на некоторое время весь мир интернализованных объектных отношений.
  clinical_observability: умеренный
  example_context: Терапевт создает гипотезу о природе примитивных, фантастических и диссоциированных объектных отношений,
    которые активизировались.
- id: B_A7_F8_006
  label: Стабильность отношений — аспект 5
  area: A7
  family: F8
  definition: Аффект и объект Я предполагаю, что раннее аффективное развитие основано на прямой фиксации ранних аффективно
    заряженных объектных отношений в форме аффективной памяти.
  clinical_observability: умеренный
  example_context: Последний тип взаимоотношений активизирует конфликтные “фантастические” (как в смысле фантазии, так и в
    смысле “нереалистичные”) объектные отношения.
- id: B_A7_F9_001
  label: Выражение нежности
  area: A7
  family: F9
  definition: Это убеждение находит свое выражение в том внимании, которое я уделяю необходимости интегрировать систему диагностики,
    основанной на описании поведения, с психодинамическим подходом, сосредоточенным на формировании психических структур.
  clinical_observability: умеренный
  example_context: После этого следует более прямое выражение позитивных эдипальных фантазий обо мне.
- id: B_A7_F9_002
  label: Выражение
  area: A7
  family: F9
  definition: Выражение лица является частью общего коммуникативного паттерна, отличающего разные аффекты.
  clinical_observability: умеренный
  example_context: При соблюдении этих условий в терапии периодически будет развертываться свободное и открытое выражение
    трансферентной любви, как эдиповой, так и доэдиповой.
- id: B_A7_F9_003
  label: Выражение нежности — аспект 2
  area: A7
  family: F9
  definition: Можно спорить, является ли созревание и развитие аффектов выражением лежащих под ними влечений, но если все
    функции и проявления влечений могут быть включены в функции и проявления развивающихся аффектов, становится трудно отстаивать
    концепцию о независимых влечениях, лежащих в основе организации аффектов.
  clinical_observability: умеренный
  example_context: Примечательно, что импотенция у нарциссических мужчин с жесткими запретами, со страхом перед женщинами,
    может являться непосредственным выражением этого страха.
- id: B_A7_F9_004
  label: Выражение нежности — аспект 3
  area: A7
  family: F9
  definition: Реципрокные ролевые отношения “Я” и объекта, оформленные аффектом, обычно находят свое выражение в конкретной
    фантазии или желании.
  clinical_observability: умеренный
  example_context: В ходе обсуждения выражение нежности пациент описывает переживания.
- id: B_A7_F9_005
  label: Выражение нежности — аспект 4
  area: A7
  family: F9
  definition: Эти вожделения, находящие выражение в форме конкретных бессознательных желаний, составляют мотивационный репертуар
    Ид.
  clinical_observability: умеренный
  example_context: После обсуждения выражение нежности пациент описывает переживания.
- id: B_A7_F9_006
  label: Выражение нежности — аспект 5
  area: A7
  family: F9
  definition: Мы могли бы сказать, что бессознательное вожделение находит выражение в конкретных желаниях.
  clinical_observability: умеренный
  example_context: При обсуждения выражение нежности пациент описывает переживания.
- id: B_A7_F10_001
  label: Забота о другом
  area: A7
  family: F10
  definition: Согласно Фрейду (Freud, 1905), частичные влечения (оральное, анальное, вуайеристское, садистское и т.д.) психологически
    интегрируются в ходе развития, но физиологически не связаны друг с другом.
  clinical_observability: умеренный
  example_context: Когда мою пациентку перевели к другому врачу, я почувствовал эмоциональную отстраненность как от Лусии,
    так и от доктора А.
- id: B_A7_F10_002
  label: Забота
  area: A7
  family: F10
  definition: И действительно, когда, говоря с клинической точки зрения, мы указываем на защитное использование одного влечения
    против другого, мы на самом деле говорим о защитной функции одного аффекта по отношению к другому.
  clinical_observability: умеренный
  example_context: Причинение боли другому и идентификация с его эротическим удовольствием от боли есть эротический садизм
    — противоположная сторона эротического мазохизма.
- id: B_A7_F10_003
  label: Забота о
  area: A7
  family: F10
  definition: 'На другом полюсе самодеструктивные и самопоражающие последствия пограничной и психотической психопатологии
    также уже не заслуживают термина мазохизм: в таких случаях там есть самодеструктивные аспекты, но вряд ли существует хоть
    какая-то эротизация боли и еще меньше — моральный мазохизм.'
  clinical_observability: умеренный
  example_context: 'Приведу пример: пациент обратился к терапевту из-за того, что жена ушла к другому.'
- id: B_A7_F10_004
  label: Забота о другом — аспект 3
  area: A7
  family: F10
  definition: На одном из сеансов, когда я обсуждал с ней страх сексуальной близости с ее другом, г-жа Б., внезапно приняла
    тревожный и подозрительный вид и спросила, почему я сделал рукой определенный жест.
  clinical_observability: умеренный
  example_context: При этом родственники нередко уверяют, что пациент будет получать терапию в другом месте, а затем просто
    предоставляют пациенту возможность покончить с собой.
- id: B_A7_F10_005
  label: Забота о другом — аспект 4
  area: A7
  family: F10
  definition: Сделанный мной акцент на наши несовместимые друг с другом реальности и на то, что различает и разделяет нас,
    представлял собой попытку дать ей знать о том, что я воспринимаю ее переживание как, видимо, психотическое, а также и
    о моей терпимости (“контейнировании”) к этому различию.
  clinical_observability: умеренный
  example_context: После обсуждения забота о другом пациент описывает переживания.
- id: B_A7_F10_006
  label: Забота о другом — аспект 5
  area: A7
  family: F10
  definition: 'Я сказал, что понимаю: она видит меня сейчас как бы копией своей матери, и если это так, то меня особенно поражает
    то, что я стал похож на ее мать, как раз когда я попытался помочь ей в том, чтобы меньше опасаться сексуальной близости
    со своим другом.'
  clinical_observability: умеренный
  example_context: При обсуждения забота о другом пациент описывает переживания.
- id: B_A7_F11_001
  label: Интеграция нежности и эротизма
  area: A7
  family: F11
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: Когда у пациента нарушена интеграция идентичности, тогда часто бывает трудно воссоздать ясную картину его
    жизни.
- id: B_A7_F11_002
  label: Интеграция
  area: A7
  family: F11
  definition: Я также считаю, что бессознательная организация и интеграция аффективно обусловленного раннего опыта подразумевает
    более высокий уровень мотивационной организации, чем тот, что представлен аффективными состояниями как таковыми.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления интеграция нежности и эротизма.
- id: B_A7_F11_003
  label: Интеграция нежности
  area: A7
  family: F11
  definition: 'В более благоприятных условиях интеграция абсолютно хороших и абсолютно плохих интернализованных объектных
    отношений может все же произойти и возникнет константность объекта, ведущая к интеграции структур Эго и Супер-Эго и установлению
    барьера вытеснения, отделяющего Эго от Ид: трехчленная структура получает свою консолидацию.'
  clinical_observability: умеренный
  example_context: Когда обсуждения интеграция нежности и эротизма пациент описывает переживания.
- id: B_A7_F11_004
  label: Интеграция нежности и эротизма — аспект 3
  area: A7
  family: F11
  definition: Обычно только на продвинутых стадиях лечения пациентов с тяжелой психопатологией может иметь место интеграция
    идеализированного и преследующего интернализованных объектных отношений, при соответствующем переключении параноидного
    переноса на депрессивный — т.е.
  clinical_observability: умеренный
  example_context: В ходе обсуждения интеграция нежности и эротизма пациент описывает переживания.
- id: B_A7_F11_005
  label: Интеграция нежности и эротизма — аспект 4
  area: A7
  family: F11
  definition: По сути дела, эти пациенты находятся под властью наиболее ранних садистких предшественников Супер-Эго, которые
    не нейтрализуются впоследствии идеализированными предшественниками Супер-Эго; следовательно, блокируется интеграция Супер-Эго,
    и более реалистические интроекты Супер- Эго эдипова периода в основном недоступны.
  clinical_observability: умеренный
  example_context: После обсуждения интеграция нежности и эротизма пациент описывает переживания.
- id: B_A7_F11_006
  label: Интеграция нежности и эротизма — аспект 5
  area: A7
  family: F11
  definition: Диссоциация или интеграция этих строительных блоков отражается в характере пациентов, их межличностных отношениях
    и развитии переноса.
  clinical_observability: умеренный
  example_context: При обсуждения интеграция нежности и эротизма пациент описывает переживания.
- id: B_A7_F12_001
  label: Эмоциональная уязвимость
  area: A7
  family: F12
  definition: Они показывают аномальную уязвимость к разочарованию в других людях, заставляющую их делать многое из того,
    что им не нравится, чтобы обрести симпатию и любовь.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с эмоциональная уязвимость.
- id: B_A7_F12_002
  label: Эмоциональная
  area: A7
  family: F12
  definition: Истерическая личность у женщин Главная характеристика этих женщин — эмоциональная лабильность.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления эмоциональная уязвимость.
- id: B_A7_F12_003
  label: Эмоциональная уязвимость — аспект 2
  area: A7
  family: F12
  definition: Другие атрибуты, подразумевающие недостаточную способность к эмоциональной вовлеченности вкупе с недостатком
    моральных функций также не характерны для этого расстройства личности — например, эмоциональная поверхностность, ложные
    аффекты, лживость и pseudologia fantastica, упоминаемые в более ранней литературе.
  clinical_observability: умеренный
  example_context: Когда обсуждения эмоциональная уязвимость пациент описывает переживания.
- id: B_A7_F12_004
  label: Эмоциональная уязвимость — аспект 3
  area: A7
  family: F12
  definition: Типичными симптомами нарциссической личности в области патологической любви к себе являются чрезмерные внимание
    к себе и центрированность на себе; грандиозность и различные производные эксгибиционизма, позиция превосходства, безрассудство
    и сверхамбициозность; сверхзависимость от восхищения; эмоциональная пустота; приступы чрезмерной беззащитности, чередующиеся
    с грандиозностью.
  clinical_observability: умеренный
  example_context: В ходе обсуждения эмоциональная уязвимость пациент описывает переживания.
- id: B_A7_F12_005
  label: Эмоциональная уязвимость — аспект 4
  area: A7
  family: F12
  definition: На практике мой подход требует в начале каждой сессии воздерживаться от интервенции до тех пор, пока вербальные
    коммуникации пациента и его невербальное поведение, общая эмоциональная атмосфера и мой контрперенос не наведут меня на
    доминирующую аффективную тему.
  clinical_observability: умеренный
  example_context: После обсуждения эмоциональная уязвимость пациент описывает переживания.
- id: B_A7_F12_006
  label: Эмоциональная уязвимость — аспект 5
  area: A7
  family: F12
  definition: Временами эмоциональная диссоциация аналитика от ситуации, его временный “отказ” от аналитических переживаний
    могут выступить как дистанцирующее средство, обеззараживающее терапевтические отношения, но ценой потенциального разрушения
    лечения либо временного или постоянного ухода примитивных переносов в “подполье”.
  clinical_observability: умеренный
  example_context: При обсуждения эмоциональная уязвимость пациент описывает переживания.
- id: B_A7_F13_001
  label: Принятие амбивалентности
  area: A7
  family: F13
  definition: Раньше (Kernberg, 1991b) я уже описывал агрессивный компонент, входящий в сексуальное возбуждение — агрессивный
    компонент проникновения и принятия в себя — как принятие агрессии на службу любви, использующее эрогенный потенциал переживания
    боли как важнейший вклад в удовлетворяющее слияние с другим в сексуальном возбуждении и оргазме.
  clinical_observability: умеренный
  example_context: Принятие мной комплементарной идентификации в своем контрпереносе было не таким регрессивным проявлением
    с моей стороны, как менее реалистическая контридентификация, упомянутая в связи с г-жой Л.
- id: B_A7_F13_002
  label: Принятие
  area: A7
  family: F13
  definition: Черты, отражающие сверхзависимость от поддержки, любви и принятия со стороны окружающих, являются проявлением,
    как показывает психоаналитическое исследование, тенденции чувствовать чрезмерную вину перед другими людьми из- за бессознательной
    амбивалентности по отношению к любимым и необходимым объектам и быть гиперреакцией на фрустрацию, когда ожидания этих
    пациентов не оправдываются.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления принятие амбивалентности.
- id: B_A7_F13_003
  label: Принятие амбивалентности — аспект 2
  area: A7
  family: F13
  definition: Такие пациенты ощущают вину из-за интенсивной амбивалентности по отношению к любимым и необходимым объектам
    и сразу же переживают фрустрацию, если их тяга к зависимости не удовлетворяется.
  clinical_observability: умеренный
  example_context: Когда обсуждения принятие амбивалентности пациент описывает переживания.
- id: B_A7_F13_004
  label: Принятие амбивалентности — аспект 3
  area: A7
  family: F13
  definition: Альтернативным путем является принятие фальшивого, циничного способа общения, полностью отрицающего важность
    объектных отношений, превращение в невинного наблюдателя, а не идентификация с жестоким тираном или мазохистское подчинение
    ему.
  clinical_observability: умеренный
  example_context: В ходе обсуждения принятие амбивалентности пациент описывает переживания.
- id: B_A7_F13_005
  label: Принятие амбивалентности — аспект 4
  area: A7
  family: F13
  definition: У таких пациентов переносимость амбивалентности, характерная для невротических высокоуровневых объектных отношений,
    заменяется защитной дезинтеграцией репрезентаций “Я” и объектов на либидинально и агрессивно заряженные частичные объектные
    отношения.
  clinical_observability: умеренный
  example_context: После обсуждения принятие амбивалентности пациент описывает переживания.
- id: B_A7_F13_006
  label: Принятие амбивалентности — аспект 5
  area: A7
  family: F13
  definition: Анализ вошел в период оценки и проработки эдиповых конфликтов и амбивалентности в отношениях с обоими родителями.
  clinical_observability: умеренный
  example_context: При обсуждения принятие амбивалентности пациент описывает переживания.
- id: B_A7_F14_001
  label: Разрешение конфликтов
  area: A7
  family: F14
  definition: Лишь тогда терапевт может обратиться к анализу невротических, “Эдиповых”, конфликтов пациента и интерпретациям
    там-и- тогда — касающимся текущей жизни пациента и его прошлого — и более твердому соблюдению технической нейтральности.
  clinical_observability: умеренный
  example_context: Пациент с пограничной организацией личности, наоборот, демонстрирует преобладание преэдиповых конфликтов
    и психических репрезентаций преэдиповых конфликтов, смешанных с репрезентациями эдиповой фазы.
- id: B_A7_F14_002
  label: Разрешение
  area: A7
  family: F14
  definition: Учитывая всеобщую распространенность мазохистского поведения и конфликтов, не всегда просто понять, когда мазохизм
    является патологией.
  clinical_observability: умеренный
  example_context: Пациент развелся со своей женой и женился на “другой женщине” — этот шаг также знаменовал разрешение его
    сексуального блока.
- id: B_A7_F14_003
  label: Разрешение конфликтов — аспект 2
  area: A7
  family: F14
  definition: Обычно соответствующая ему бессознательная динамика группируется вокруг чрезмерного давления со стороны Супер-Эго,
    исходящего из инфантильных, особенно эдиповых конфликтов, и может выражать себя в бессознательной защитной регрессии к
    преэдиповой динамике и общему мазохистскому поведению, которые в значительной степени дистанцированны от инфантильных
    сексуальных конфликтов.
  clinical_observability: умеренный
  example_context: Когда происходит такое разрешение примитивного переноса, целостность эмоциональной сферы показывает, что
    производные влечений стали более интегрированными и дифференцированными.
- id: B_A7_F14_004
  label: Разрешение конфликтов — аспект 3
  area: A7
  family: F14
  definition: Типичная бессознательная динамика концентрируется вокруг эдиповых конфликтов, включая потребность в отрицании
    кастрационной тревоги и смягчении сурового Супер-Эго, чтобы получить сексуальное удовлетворение, имеющее инцестуозное
    значение.
  clinical_observability: умеренный
  example_context: Когда пациент с семьей участвуют в семейной терапии, их терапевт должен получить у семьи и у пациента разрешение
    делиться своими наблюдениями с индивидуальным психотерапевтом пациента.
- id: B_A7_F14_005
  label: Разрешение конфликтов — аспект 4
  area: A7
  family: F14
  definition: 'Рассмотренные случаи объединяют: 1) сильные, примитивные агрессивные импульсы, 2) тяжелую патологию объектных
    отношений, 3) преобладание доэдиповых конфликтов и целей в сексуальном мазохистском сценарии и 4) недостаточную интеграцию
    функций Супер-Эго.'
  clinical_observability: умеренный
  example_context: Когда в результате тяжелых ранних конфликтов агрессии у нарциссической личности образуются чрезмерно садистические
    предшественники Супер-Эго, остатки нейтрализованных функций Супер-Эго не действуют.
- id: B_A7_F14_006
  label: Разрешение конфликтов — аспект 5
  area: A7
  family: F14
  definition: 'Тесная связь между эротическим мазохизмом и агрессией как в садомазохистских фантазиях, так и в поведении,
    и ключевая функция агрессии в определении тяжести мазохизма указывают на базовую динамику инстинктивных конфликтов на
    всех уровнях психопатологии: взаимодействие и использование либидинальных и агрессивных импульсов.'
  clinical_observability: умеренный
  example_context: При обсуждения разрешение конфликтов пациент описывает переживания.
- id: B_A7_F15_001
  label: Открытость чувств
  area: A7
  family: F15
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Пациенты данной категории сталкиваются с трудностями в выражении агрессии и склонны чувствовать депрессию
    в условиях, которые в норме вызывают злость или ярость.
- id: B_A7_F15_002
  label: Открытость
  area: A7
  family: F15
  definition: Для этих более сложных феноменов я оставляю термин эмоции и чувства.
  clinical_observability: умеренный
  example_context: Пациентка была, кажется, удовлетворена моими замечаниями и сказала, что сейчас чувствует себя хорошо.
- id: B_A7_F15_003
  label: Открытость чувств — аспект 2
  area: A7
  family: F15
  definition: Далее, интенсивная первичная аффективная заряженность матери для младенца на стадии практики процесса сепарации-индивидуации
    может позднее связаться с сексуально окрашенным притяжением к ней, исходящим из активации генитальных чувств на эдиповой
    стадии развития.
  clinical_observability: умеренный
  example_context: После того, как жена увела детей, он с облегчением почувствовал себя в одиночестве, хотя и испытывал вину
    за то, что не проводит с ними достаточно много времени.
- id: B_A7_F15_004
  label: Открытость чувств — аспект 3
  area: A7
  family: F15
  definition: Субъективное переживание себя, вместе с его частными аспектами, самосознанием и саморефлексией, ощущением структурного
    единства и непрерывности во времени, чувством ответственности за свои действия, представляет собой нечто большее, чем
    субъективную фантазию.
  clinical_observability: умеренный
  example_context: После более продолжительного рассмотрения, однако, я обнаружил чувство пустоты и спутанность, которые заставили
    меня пересмотреть первоначальное мнение.
- id: B_A7_F15_005
  label: Открытость чувств — аспект 4
  area: A7
  family: F15
  definition: На еще более поздней стадии развития реакции ярости могут выполнять функцию последнего усилия по восстановлению
    чувства автономии перед лицом ситуаций сильной фрустрации, бессознательно воспринимаемых как угрожающая активация абсолютно
    плохих, преследующих объектных отношений.
  clinical_observability: умеренный
  example_context: Когда мою пациентку перевели к другому врачу, я почувствовал эмоциональную отстраненность как от Лусии,
    так и от доктора А.
- id: B_A7_F15_006
  label: Открытость чувств — аспект 5
  area: A7
  family: F15
  definition: Такая зависть осложнена потребностью пациента разрушить собственное осознание этой зависти, чтобы не почувствовать
    весь ужас бешеной зависти, которую он испытывает к тому, что ему дорого и ценно в объекте.
  clinical_observability: умеренный
  example_context: После долгого обсуждения я уступил, признав собственные ограничения и действительно почувствовав себя гибким
    и зрелым, поступая так.
- id: B_A7_F16_001
  label: Верность отношениям
  area: A7
  family: F16
  definition: В самом деле, преобразование аффектов в процессе развития, их интеграция с интернализованными объектными отношениями,
    их явное подразделение в процессе развития на аффекты, связанные с удовольствием, составляющие либидинальный ряд, и аффекты,
    связанные с болью, составляющие агрессивный ряд, — все указывает на огромное богатство и сложность их когнитивных и аффективных
    элементов.
  clinical_observability: умеренный
  example_context: При комплементарной идентификации пациент и аналитик время от времени отыгрывают репрезентации “Я” и объекта,
    соответствующие определенным интернализованным объектным отношениям.
- id: B_A7_F16_002
  label: Верность
  area: A7
  family: F16
  definition: Когнитивные элементы влечений, пишет Якобсон, представлены когнитивными взаимоотношениями между репрезентациями
    “Я” и объектов и между “Я” и действительными объектами.
  clinical_observability: умеренный
  example_context: При отсутствии таких разрывов сексуальные отношения становятся частью обыденности, а это может привести
    к накоплению агрессии в переживании слияния, что является угрозой отношениям в целом.
- id: B_A7_F16_003
  label: Верность отношениям — аспект 2
  area: A7
  family: F16
  definition: Сандлер (Sandler and Rosenblatt, 1962; Sandler and Sandler, 1978) приходит к аналогичному выводу относительно
    тесной связи между аффектами и интернализованными объектными отношениями.
  clinical_observability: умеренный
  example_context: При злокачественном разрушении источников помощи используется, в частности, тот факт, что всякая интерпретация
    гипотетична и ее достоверность проверяется по бессознательной реакции пациента.
- id: B_A7_F16_004
  label: Верность отношениям — аспект 3
  area: A7
  family: F16
  definition: Имеющее характер мести разрушение этого плохого объекта направлено на магическое восстановление абсолютно хорошего,
    но процесс мести ведет к разрушению самой способности “Я” к отношениям с объектом.
  clinical_observability: умеренный
  example_context: Терапевтическое сообщество также несет в себе угрозу традиционным отношениям пациента и доктора и традиционным
    взаимоотношениям сотрудников, каждый из которых специализируется в своей области.
- id: B_A7_F16_005
  label: Верность отношениям — аспект 4
  area: A7
  family: F16
  definition: В отличие от импульсивного, высокомерного и обесценивающего поведения на уровне нарциссического функционирования
    личности садомазохистская личность, находящаяся на явном пограничном уровне, имеет гораздо большую способность к аффективно
    заряженным и глубоким отношениям с окружающими; она зависима и льнет, в отличие от отстраненной нарциссической личности.
  clinical_observability: умеренный
  example_context: После обсуждения верность отношениям пациент описывает переживания.
- id: B_A7_F16_006
  label: Верность отношениям — аспект 5
  area: A7
  family: F16
  definition: Описание сексуального мазохизма, данное Захер-Мазохом в “Венере в мехах” (откуда и идет название “мазохизм”;
    1881), соответствует отношениям писателя с его первой женой (а затем и со второй) и иллюстрирует типичные первертные практики
    в контексте стабильных отношений с любимым объектом.
  clinical_observability: умеренный
  example_context: При обсуждения верность отношениям пациент описывает переживания.
- id: B_A7_F17_001
  label: Совместная идентичность
  area: A7
  family: F17
  definition: Все эти личностные расстройства обнаруживают хорошо интегрированную личностную идентичность, неспецифические
    проявления силы Эго (хорошая толерантность к тревоге, контроль импульсов и сублиматорная деятельность) и жесткое, но хорошо
    интегрированное Супер-Эго.
  clinical_observability: умеренный
  example_context: Пациентам с пограничной личностной организацией свойственна диффузная идентичность, но у нарциссической
    личности все осложняется еще одним феноменом.
- id: B_A7_F17_002
  label: Совместная
  area: A7
  family: F17
  definition: Сценическая личность у мужчин Сценические личности у мужчин обычно представлены размытой идентичностью, тяжелыми
    расстройствами объектных отношений и слабостью контроля за импульсами.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления совместная идентичность.
- id: B_A7_F17_003
  label: Совместная идентичность — аспект 2
  area: A7
  family: F17
  definition: Кумулятивный эффект неспособности придерживаться личных, профессиональных, культурных и социальных ценностей,
    частые нарушения или неудачи в близких отношениях и размытая идентичность, типичные для личности таких пациентов, — все
    это может препятствовать обычному социальному научению и приводить к порочному кругу, ухудшающему их функционирование
    с годами.
  clinical_observability: умеренный
  example_context: Когда обсуждения совместная идентичность пациент описывает переживания.
- id: B_A7_F17_004
  label: Совместная идентичность — аспект 3
  area: A7
  family: F17
  definition: Структура Эго у этих пациентов организована вокруг вытеснения и характеризуется твердой Эго-идентичностью, что
    отражается в типичных проявлениях невротических переносов.
  clinical_observability: умеренный
  example_context: В ходе обсуждения совместная идентичность пациент описывает переживания.
- id: B_A7_F17_005
  label: Совместная идентичность — аспект 4
  area: A7
  family: F17
  definition: Я понимаю подобное поведение как знак того, что наша совместная работа активировала ее бессознательную фантазию,
    что я, как ее отец, сексуально соблазняю ее (что, в свою очередь, проистекает из ее проекции на меня своих скрытых позитивных
    эдипальных желаний).
  clinical_observability: умеренный
  example_context: После обсуждения совместная идентичность пациент описывает переживания.
- id: B_A7_F17_006
  label: Совместная идентичность — аспект 5
  area: A7
  family: F17
  definition: Диффузная идентичность снижает их способность к эмпатии с окружающими и способность к реалистической оценке
    и предсказанию собственного поведения и поведения других людей.
  clinical_observability: умеренный
  example_context: При обсуждения совместная идентичность пациент описывает переживания.
- id: B_A7_F18_001
  label: Устойчивость пары
  area: A7
  family: F18
  definition: Затем его банда под угрозой оружия заставляет все пары раздеться и танцевать на разбитом стекле, и он эякулирует
    с большим удовольствием.
  clinical_observability: умеренный
  example_context: При страстной любви оргастические ощущения достигают максимума, и здесь мы можем исследовать значимость
    таких переживаний для индивидуума и для пары.
- id: B_A7_F18_002
  label: Устойчивость
  area: A7
  family: F18
  definition: Мужчины будут стыдиться этой неудачи и унижения, и, танцуя друг с другом, пары будут стыдиться, что держат друг
    друга в руках.
  clinical_observability: умеренный
  example_context: Примитивные диссоциативные механизмы могут сдерживать перверсии в рамках стабильного равновесия пары, которой
    удается достичь чрезвычайной близости при доминирующей роли агрессии.
- id: B_A7_F18_003
  label: Устойчивость пары — аспект 2
  area: A7
  family: F18
  definition: То, что он держал танцующие пары под прицелом, напомнило ему о сне, который был у него несколько недель назад.
  clinical_observability: умеренный
  example_context: Когда обсуждения устойчивость пары пациент описывает переживания.
- id: B_A7_F18_004
  label: Устойчивость пары — аспект 3
  area: A7
  family: F18
  definition: взрослению Супер-Эго, чтобы инфантильная моральность превратилась во взрослые этические ценности и чувство ответственности
    и моральной преданности, которые подкрепляют эмоциональную преданность пары друг другу.
  clinical_observability: умеренный
  example_context: В ходе обсуждения устойчивость пары пациент описывает переживания.
- id: B_A7_F18_005
  label: Устойчивость пары — аспект 4
  area: A7
  family: F18
  definition: Отыгрывание гомосексуальных фантазий, так же как и агрессивных дериватов преэдиповых отношений, тоже оказывает
    влияние на в способности пары к временному освобождению сексуальной активности от ригидной связи с целостными объектными
    отношениями, так что участники могут относиться друг к другу как к “сексуальным объектам”.
  clinical_observability: умеренный
  example_context: После обсуждения устойчивость пары пациент описывает переживания.
- id: B_A7_F18_006
  label: Устойчивость пары — аспект 5
  area: A7
  family: F18
  definition: Сексуальная свобода пары в любви выражает в одном из своих аспектов полиморфную перверсную фантазию, временно
    освобождающую обоих участников от их особого объектного отношения — хотя их общая сексуальная вовлеченность по-прежнему
    находится в рамках данного объектного отношения.
  clinical_observability: умеренный
  example_context: При обсуждения устойчивость пары пациент описывает переживания.
- id: B_A7_F19_001
  label: Способность прощать
  area: A7
  family: F19
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A7_F19_002
  label: Способность
  area: A7
  family: F19
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациент ненавидит также (поскольку он ей завидует) творческую способность терапевта, выражающуюся в попытках
    понять пациента и передать ему свое понимание.
- id: B_A7_F19_003
  label: Способность прощать — аспект 2
  area: A7
  family: F19
  definition: Из-за этого страдает и способность самого аналитика к эмпатическому пониманию пациента.
  clinical_observability: умеренный
  example_context: Природа доэдиповых влияний на способность к сексуальной любви являлась предметом важных психоаналитических
    исследований.
- id: B_A7_F19_004
  label: Способность прощать — аспект 3
  area: A7
  family: F19
  definition: В дополнение к этому, у младенца существует удивительно ранняя способность к когнитивной дифференцировке, которая
    предполагает наличие потенциала и для дифференциации аффектов.
  clinical_observability: умеренный
  example_context: При небольших отклонениях пациенты проявляют ограниченную способность к мимолетным увлечениям.
- id: B_A7_F19_005
  label: Способность прощать — аспект 4
  area: A7
  family: F19
  definition: Ненависть и неспособность выносить общение с объектом защищают пациента от того, что может в ином случае проявиться
    как сочетание жестоких нападок на объект, параноидных страхов перед ним и направленной на самого себя агрессии при идентификации
    с объектом.
  clinical_observability: умеренный
  example_context: При долгом участии (от 6 месяцев до 1 года) в такой полиморфной перверзивной деятельности их способность
    к сексуальной близости (и, по этой же причине, всякая близость) прекращается (Бартель, 1971).
- id: B_A7_F19_006
  label: Способность прощать — аспект 5
  area: A7
  family: F19
  definition: С клинической точки зрения, перенос характеризуется высокомерием, любопытством и псевдотупостью (неспособностью
    понимать то, что говорит терапевт), описанными Бионом (1957а), что иллюстрируют выраженные в форме действия вовне зависть
    пациента к терапевту, разрушение смысла и садизм.
  clinical_observability: умеренный
  example_context: Примитивная природа переноса пограничного пациента развивает у стремящегося чувствовать эмпатию терапевта
    способность осознавать собственные примитивные эмоциональные реакции.
- id: B_A7_F20_001
  label: Благодарность
  area: A7
  family: F20
  definition: В отличие от нарциссической личности, которая сверхзависима от внешнего восхищения, но не отвечает на это любовью
    и благодарностью, депрессивно-мазохистская личность обычно способна на глубокую ответную любовь и благодарность.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с благодарность.
- id: B_A7_F20_002
  label: Благодарность — аспект 1
  area: A7
  family: F20
  definition: БЛАГОДАРНОСТЬ ПЕРВЫМ, КТО ОБРАТИЛ МОЕ ВНИМАНИЕ НА РАБОТЫ ГЕНРИ ДИКСА, БЫЛ ДЖОН Д.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления благодарность.
- id: B_A7_F20_003
  label: Благодарность — аспект 2
  area: A7
  family: F20
  definition: В то же время у него было острое чувство собственной индивидуальности, смешанное со смирением и благодарностью
    за такую возможность прочувствовать это произведение искусства.
  clinical_observability: умеренный
  example_context: Когда обсуждения благодарность пациент описывает переживания.
- id: B_A7_F20_004
  label: Благодарность — аспект 3
  area: A7
  family: F20
  definition: Теперь он был в состоянии выразить свою благодарность в форме физической близости с ней, чувствуя ее тело (теперь
    репрезентирующее ее целиком, а не как частичный объект) по-новому.
  clinical_observability: умеренный
  example_context: В ходе обсуждения благодарность пациент описывает переживания.
- id: B_A7_F20_005
  label: Благодарность — аспект 4
  area: A7
  family: F20
  definition: Эти пациенты, однако, не способны достичь такого уровня идеализации, присущей чувству влюбленности, когда идеализируются
    женская генитальность и определенная женщина, а благодарность за ее любовь и забота о ней как о человеке перерастают в
    способность поддерживать более стабильные отношения.
  clinical_observability: умеренный
  example_context: После обсуждения благодарность пациент описывает переживания.
- id: B_A7_F20_006
  label: Благодарность — аспект 5
  area: A7
  family: F20
  definition: 'Она чувствовала бесконечную благодарность за то, что он подарил ей свою любовь и свой пенис: она была благодарна
    ему за то, что могла так полноценно наслаждаться его пенисом, и однажды во время копуляции представила, что она обнимает
    пенис огромных размеров, обвиваясь вокруг него с чувством опьянения и ощущением, что кружится вокруг центра вселенной.'
  clinical_observability: умеренный
  example_context: При обсуждения благодарность пациент описывает переживания.
- id: B_A7_F21_001
  label: Оплакивание утраты
  area: A7
  family: F21
  definition: Прерывание анализа в таких условиях защищает его от страха агрессивного возмездия со стороны аналитика и подкрепляет,
    в фантазии, его чувство всемогущества, его защиты против чувства вины по поводу своей агрессии, а также недостаточное
    оплакивание им потери объекта.
  clinical_observability: умеренный
  example_context: Пациент демонстрирует проявления, связанные с оплакивание утраты.
- id: B_A7_F21_002
  label: Оплакивание
  area: A7
  family: F21
  definition: По предположению Джосселин (1971), родители, лишающие своих детей возможности переживать печаль из-за утраты
    объектов любви, вносят свой вклад в атрофию их способности любить.
  clinical_observability: умеренный
  example_context: Терапевт отмечает в материале сессии проявления оплакивание утраты.
- id: B_A7_F21_003
  label: Оплакивание утраты — аспект 2
  area: A7
  family: F21
  definition: Однако аналитическое разрешение переноса делает трансферентную любовь резко отличной от невротической с ее отреагированием,
    при которой отсутствие взаимности усиливает привязанность, вместо того чтобы позволить ее оплакивание и разрешение.
  clinical_observability: умеренный
  example_context: Когда обсуждения оплакивание утраты пациент описывает переживания.
- id: B_A7_F21_004
  label: Оплакивание утраты — аспект 3
  area: A7
  family: F21
  definition: Ее эмоциональное оплакивание матери перешло в стойкое враждебное отношение к мачехе, на которой отец женился
    через год после смерти первой жены.
  clinical_observability: умеренный
  example_context: В ходе обсуждения оплакивание утраты пациент описывает переживания.
- id: B_A7_F21_005
  label: Оплакивание утраты — аспект 4
  area: A7
  family: F21
  definition: Иными словами, удовлетворительные любовные отношения во внешней реальности также помогли проработке в переносе
    процесса оплакивания отношений со мной, воспроизводившего оплакивание прежних отношений и установление новых в амбивалентных
    отношениях с отцом.
  clinical_observability: умеренный
  example_context: После обсуждения оплакивание утраты пациент описывает переживания.
- id: B_A7_F21_006
  label: Оплакивание утраты — аспект 5
  area: A7
  family: F21
  definition: Идеализация, чувство утраты и агрессия выступают как части его усилий приблизиться к ней.
  clinical_observability: умеренный
  example_context: При обсуждения оплакивание утраты пациент описывает переживания.
- id: B_A7_F22_001
  label: Ответственность за другого
  area: A7
  family: F22
  definition: Но хотя я благодарю всех моих коллег за стимуляцию, предложения и критику, я несу персональную ответственность
    за все формулировки данной книги.
  clinical_observability: умеренный
  example_context: При наихудшем сценарии возникает удушающее чувство несвободы и преследования со стороны другого.
- id: B_A7_F22_002
  label: Ответственность
  area: A7
  family: F22
  definition: Другими словами, какое бы производное влечение ни было диагностировано в клинической ситуации — например, сексуальный
    или агрессивный импульс — пациент в любом случае переживает в этот момент образ или репрезентацию “Я” в отношениях с образом
    или репрезентацией другого человека (“объекта”) под воздействием соответствующего сексуального или агрессивного аффекта.
  clinical_observability: умеренный
  example_context: Терапевт оставил ей и социальному работнику координаты другого психиатра, к которому в случае чего можно
    было обратиться в его отсутствие.
- id: B_A7_F22_003
  label: Ответственность за
  area: A7
  family: F22
  definition: И действительно, когда, говоря с клинической точки зрения, мы указываем на защитное использование одного влечения
    против другого, мы на самом деле говорим о защитной функции одного аффекта по отношению к другому.
  clinical_observability: умеренный
  example_context: Пациент должен начать психоанализ у другого аналитика.
- id: B_A7_F22_004
  label: Ответственность за другого — аспект 3
  area: A7
  family: F22
  definition: Однако в клинической ситуации анализ реакций ярости — так же как и других интенсивных аффективных состояний
    — всегда открывает лежащие за ними сознательные и бессознательные фантазии, включающие специфические отношения между аспектом
    “Я” и аспектом значимого другого.
  clinical_observability: умеренный
  example_context: Пациент должен принять на себя ответственность за текущую жизненную ситуацию и за свои планы на отдаленное
    будущее.
- id: B_A7_F22_005
  label: Ответственность за другого — аспект 4
  area: A7
  family: F22
  definition: 'Излюбленной формой мастурбационного удовлетворения другого пациента служило следующее: он забредал в местный
    ручей, такой грязный, что приходилось стоять по колено в грязи, и мастурбировал в воду.'
  clinical_observability: умеренный
  example_context: Когда пациент позволяет “держать себя”, когда он может положиться на другого человека, это значит, что
    он “отпускает себя”, сознавая, что любое взаимоотношение несовершенно и рискованно.
- id: B_A7_F22_006
  label: Ответственность за другого — аспект 5
  area: A7
  family: F22
  definition: Иными словами, они ценят физическую красоту, силу, богатство и восхищение со стороны окружающих, а не способности,
    достижения, ответственность и связь с идеалами.
  clinical_observability: умеренный
  example_context: При обсуждения ответственность за другого пациент описывает переживания.
- id: B_A7_F23_001
  label: Принятие зависимости
  area: A7
  family: F23
  definition: Раньше (Kernberg, 1991b) я уже описывал агрессивный компонент, входящий в сексуальное возбуждение — агрессивный
    компонент проникновения и принятия в себя — как принятие агрессии на службу любви, использующее эрогенный потенциал переживания
    боли как важнейший вклад в удовлетворяющее слияние с другим в сексуальном возбуждении и оргазме.
  clinical_observability: умеренный
  example_context: Принятие мной комплементарной идентификации в своем контрпереносе было не таким регрессивным проявлением
    с моей стороны, как менее реалистическая контридентификация, упомянутая в связи с г-жой Л.
- id: B_A7_F23_002
  label: Принятие
  area: A7
  family: F23
  definition: С клинической точки зрения, эти пациенты иллюстрируют самодеструктивность, находящуюся в зависимости от интенсивности
    примитивной агрессии, примитивизации всех интрапсихических структур, недостаточного развития Супер-Эго и использования
    либидинальных и эротических стремлений на службе агрессии.
  clinical_observability: умеренный
  example_context: При этом женщина ищет гомосексуальных отношений, на которые она смогла бы проецировать свои собственные
    потребности в зависимости.
- id: B_A7_F23_003
  label: Принятие зависимости — аспект 2
  area: A7
  family: F23
  definition: Из своей диффузной деструктивности они черпают ощущение власти, торжествующее ощущение независимости и отсутствие
    потребности в других людях; клинически это проявляется в неприкрытых попытках разрушения любви и привязанности, благодарности
    и сострадания у самих себя и у окружающих.
  clinical_observability: умеренный
  example_context: Терапевтический подход Не так уж сложно диагностировать тупиковую ситуацию, создавшуюся на основе устойчивой
    защиты против зависимости.
- id: B_A7_F23_004
  label: Принятие зависимости — аспект 3
  area: A7
  family: F23
  definition: Эта экстраверсия проявляется в легкости социальных контактов и окрашена тенденцией к эксгибиционизму и чрезмерной
    зависимости от окружающих.
  clinical_observability: умеренный
  example_context: В ходе обсуждения принятие зависимости пациент описывает переживания.
- id: B_A7_F23_005
  label: Принятие зависимости — аспект 4
  area: A7
  family: F23
  definition: Один из паттернов характеризуется качеством псевдогипермаскулинности, театральным преувеличением принятого в
    культуре маскулинного поведения, обычно с акцентом на независимости, и установку на доминирование и превосходство над
    женщинами в сочетании с детской надутостью, если эти ожидания не сбываются.
  clinical_observability: умеренный
  example_context: После обсуждения принятие зависимости пациент описывает переживания.
- id: B_A7_F23_006
  label: Принятие зависимости — аспект 5
  area: A7
  family: F23
  definition: Сценическая личность может использовать сексуальное поведение глубоко и неадекватно для проявления своих потребностей
    в эксгибиционизме и зависимости, у нее меньше сексуальных торможений, и она гораздо чаще склонна к промискуитету по сравнению
    с истерической личностью.
  clinical_observability: умеренный
  example_context: При обсуждения принятие зависимости пациент описывает переживания.
- id: B_A7_F24_001
  label: Интегрированная способность любить
  area: A7
  family: F24
  definition: способность отличать внутреннюю реальность (мысли, чувства, желания) от внешней и реалистически оценивать мотивацию
    поведения, как собственную, так и других людей.
  clinical_observability: умеренный
  example_context: Примитивная ненависть также принимает форму стремления разрушить способность ко вступлению в удовлетворяющие
    отношения с окружающими и возможность научиться чему-либо ценному в этих отношениях (см.
- id: B_A7_F24_002
  label: Интегрированная
  area: A7
  family: F24
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Пациент ненавидит также (поскольку он ей завидует) творческую способность терапевта, выражающуюся в попытках
    понять пациента и передать ему свое понимание.
- id: B_A7_F24_003
  label: Интегрированная способность
  area: A7
  family: F24
  definition: Из-за этого страдает и способность самого аналитика к эмпатическому пониманию пациента.
  clinical_observability: умеренный
  example_context: Природа доэдиповых влияний на способность к сексуальной любви являлась предметом важных психоаналитических
    исследований.
- id: B_A7_F24_004
  label: Интегрированная способность любить — аспект 3
  area: A7
  family: F24
  definition: В дополнение к этому, у младенца существует удивительно ранняя способность к когнитивной дифференцировке, которая
    предполагает наличие потенциала и для дифференциации аффектов.
  clinical_observability: умеренный
  example_context: При небольших отклонениях пациенты проявляют ограниченную способность к мимолетным увлечениям.
- id: B_A7_F24_005
  label: Интегрированная способность любить — аспект 4
  area: A7
  family: F24
  definition: Ненависть и неспособность выносить общение с объектом защищают пациента от того, что может в ином случае проявиться
    как сочетание жестоких нападок на объект, параноидных страхов перед ним и направленной на самого себя агрессии при идентификации
    с объектом.
  clinical_observability: умеренный
  example_context: При долгом участии (от 6 месяцев до 1 года) в такой полиморфной перверзивной деятельности их способность
    к сексуальной близости (и, по этой же причине, всякая близость) прекращается (Бартель, 1971).
- id: B_A7_F24_006
  label: Интегрированная способность любить — аспект 5
  area: A7
  family: F24
  definition: С клинической точки зрения, перенос характеризуется высокомерием, любопытством и псевдотупостью (неспособностью
    понимать то, что говорит терапевт), описанными Бионом (1957а), что иллюстрируют выраженные в форме действия вовне зависть
    пациента к терапевту, разрушение смысла и садизм.
  clinical_observability: умеренный
  example_context: При наиболее тяжелых случаях нарциссизма индивидуум не способен влюбиться — это патогномонический признак
    патологического нарциссизма.
- id: B_A8_F1_001
  label: Оценка тестирования реальности
  area: A8
  family: F1
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Когда любовь взаимна, самооценка любящих повышается.
- id: B_A8_F1_002
  label: Оценка
  area: A8
  family: F1
  definition: Я глубоко благодарен докторам Джону Кларкину и Харольду Кенигсбергу, содиректорам проекта, докторам Энн Аппельбаум,
    Стивену Бауэру, Артуру Карру, Лизе Горник, Лоренсу Рокланду, Майклу Зельцеру и Франку Йомансу, моим коллегам в этом предприятии,
    чья критическая оценка полученного нашей группой клинического опыта определила мой подход к особенно трудным проблемам
    техники.
  clinical_observability: умеренный
  example_context: Пациенты с психотической организацией личности (для которых характерна, в первую очередь, потеря проверки
    реальности) обычно используют проективную идентификацию как преобладающую защиту.
- id: B_A8_F1_003
  label: Оценка тестирования
  area: A8
  family: F1
  definition: 'Со временем образование символов и аффективная организация реальности станут характерны и для этого поверхностного
    слоя восприятия, преобразуя врожденную организацию восприятия в информацию, которой можно манипулировать с помощью символов:
    таким образом, “сознательное мышление”, источник вторичных процессов мышления, возникает на поверхности этого глубинного
    слоя.'
  clinical_observability: умеренный
  example_context: Примитивная идеализация создает оторванные от реальности образы доброты и всемогущества.
- id: B_A8_F1_004
  label: Оценка тестирования реальности — аспект 3
  area: A8
  family: F1
  definition: Подоплекой этой потребности в разрушении реальности и общения в близких отношениях является, по моему мнению,
    бессознательная и сознательная зависть к объекту, особенно к такому объекту, который сам внутренне не охвачен подобной
    ненавистью.
  clinical_observability: умеренный
  example_context: Когда в поддерживающей терапии пациент предлагает терапевту примитивный материал регрессивной фантазии,
    терапевт не игнорирует это сообщение, но привязывает его к реальности.
- id: B_A8_F1_005
  label: Оценка тестирования реальности — аспект 4
  area: A8
  family: F1
  definition: Сейчас я только хотел бы подчеркнуть необходимость открытого признания перед пациентом, убежденном в параноидном
    искажении реальности, что терапевт видит реальность совершенно иначе, но с уважением относится к временной несовместимости
    своего восприятия и восприятия пациента.
  clinical_observability: умеренный
  example_context: Терапевт, делясь своим пониманием нужд пациента и пониманием внешней реальности, дает пациенту возможность
    искать новое решение проблемы, хотя не оказывает прямой помощи.
- id: B_A8_F1_006
  label: Оценка тестирования реальности — аспект 5
  area: A8
  family: F1
  definition: Реальная оценка такой возможности и реалистическое структурирование ситуации лечения для защиты пациента, терапевта
    и других людей от чрезмерных и опасных потенциально необратимых последствий агрессивных действий вовне являются предварительным
    условием успешной работы в данной области.
  clinical_observability: умеренный
  example_context: При этом пациент гибко переходит от эмоций к интеллектуальному пониманию, от фантазии к реальности, от
    переноса к своей внешней жизни и так далее.
- id: B_A8_F2_001
  label: Оценка идентичности
  area: A8
  family: F2
  definition: Я исследую взаимоотношения между размытостью идентичности, способностью к проверке реальности и тупиковыми ситуациями
    в лечении на примерах всего спектра расстройств личности — от невротических, затем пограничных и, наконец, психотических
    организаций личности.
  clinical_observability: умеренный
  example_context: Когда любовь взаимна, самооценка любящих повышается.
- id: B_A8_F2_002
  label: Оценка
  area: A8
  family: F2
  definition: Я глубоко благодарен докторам Джону Кларкину и Харольду Кенигсбергу, содиректорам проекта, докторам Энн Аппельбаум,
    Стивену Бауэру, Артуру Карру, Лизе Горник, Лоренсу Рокланду, Майклу Зельцеру и Франку Йомансу, моим коллегам в этом предприятии,
    чья критическая оценка полученного нашей группой клинического опыта определила мой подход к особенно трудным проблемам
    техники.
  clinical_observability: умеренный
  example_context: Пациенты с пограничной организацией личности также имеют недостаточно интегрированную Я-концепцию, синдром
    диффузной идентичности.
- id: B_A8_F2_003
  label: Оценка идентичности — аспект 2
  area: A8
  family: F2
  definition: По этой причине интерсубъективность, независимо от того, включается ли она в переживание себя или отвергается
    посредством проективных механизмов, является неотьемлемой частью развития нормальной идентичности.
  clinical_observability: умеренный
  example_context: После этого можно исследовать пациента на наличие синдрома диффузной идентичности.
- id: B_A8_F2_004
  label: Оценка идентичности — аспект 3
  area: A8
  family: F2
  definition: эмпатии с тем, что пациент не может в себе выносить и активирует посредством проективной идентификации — узнает
