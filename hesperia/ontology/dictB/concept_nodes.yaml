  clinical_observability: умеренный
  example_context: После обсуждения потребность в зависимости пациент описывает переживания.
- id: B_A1_F10_006
  label: Потребность в зависимости — аспект 5
  area: A1
  family: F10
  definition: Мазохистское поведение может включать потребность в переживании физической боли, эмоционального страдания, самоуничижения
    или унижения.
  clinical_observability: умеренный
  example_context: При обсуждения потребность в зависимости пациент описывает переживания.
- id: B_A1_F11_001
  label: Импульсы привязанности
  area: A1
  family: F11
  definition: Попытка заменить теории влечений и аффектов на теорию привязанности или теорию объектных отношений, отвергающих
    концепцию влечений, ведет к упрощению психической жизни, подчеркивая только позитивные или либидинальные элементы привязанности
