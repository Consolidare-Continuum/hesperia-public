# HESPERIA — product vs internal capability flags (Task 4).
# Override with env: HESPERIA_EXPOSE_TRIZ=0|1, HESPERIA_PRODUCT_SURFACE=0|1, etc.

public:
  analyze: true
  compare: true
  batch: true
  interpret: true

internal:
  dynamics: true
  triz: true
  calibration: true
  # DLCR structural sidecar on analysis_service — env HESPERIA_DLCR_STRUCTURAL still required.
  # Enabled so TFP Class B lane (:18881) can attach full dict_*_tfp* stack; default core omits env.
  dlcr: true

# What may appear on external HTTP/CLI surfaces (product build).
exposed:
  dynamics: false
  triz: false
  calibration: false
  dlcr: false
  # When HESPERIA_PRODUCT_SURFACE=0 (dev), /version is on if true. Strict product surface hides /version unless HESPERIA_EXPOSE_VERSION=1.
  version_endpoint: true
