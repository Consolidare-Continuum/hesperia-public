# product_surface:
#   none        — not shipped as product capability
#   internal    — used inside sealed pipelines; not a public plugin contract
#   optional    — may be exposed behind explicit API/CLI flags

extensions:
  dynamics:
    status: canonical_extension
    product_surface: internal
    python_package: hesperia.extensions.dynamics
  triz:
    status: canonical_extension
    product_surface: optional
    python_package: hesperia.extensions.triz
  clinical_tfp:
    status: experimental
    product_surface: none
    python_package: research.clinical_tfp
    note: "TFP / clinical test collateral — not baseline Engine Dynamics product."
  fpf_bridge:
    status: canonical_extension
    product_surface: internal
    python_package: sphere.fpf_bridge
    note: "Layer 11 LLM reasoning bridge. Used inside mode='llm' product_interpret path; not a public plugin contract itself."
  agentic_bridge:
    status: experimental
    product_surface: none
    python_package: runtime.agentic_bridge
    note: "fpf_bridge_v7_3 draft — read-only + validation tools for an external agent (Cursor). Flag-gated off; ratification pending."
  hesperia_dev_test:
    status: experimental
    product_surface: none
    team_use: approved
    approved_by: Ethan
    approved_at: 2026-07-26
    python_package: tools.hesperia_dev_test
    note: "APPROVED INTO USE (Ethan 2026-07-26 / ETHAN-HDT-01) as canonical team/dev Class B diagnostic battery — not a product surface. Read-only synthetic-token (letters/digits/booleans/diacritics/indices, no real dictionary words) against sealed /analyze and /product/interpret — structural invariants, per-layer FPF-BUII timing, indexed alphabet-activation map, FPF math consistency via tools/fpf_hand_roll_harness.py. Never touches core/, sphere/ internals, sealed assets, or core/engine/module_aliases.py. Findings (diacritic silent truncate, /analyze double pass, flat alphabet/FPF gaps) → Grace grind triage, not silent sealed edits."
