[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short -m "not tfp and not dev_test_soak"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    tfp: TFP practical / clinical research tests (not core engine); run with: pytest -m tfp
    output_views: Django output_views surface (primary: cd output_views && python3 manage.py test apps.pages)
    dev_test: hesperia-dev-test semantics-free structural/FPF/Bench-0 gold battery (bench0_latin lane, fast, in-process, runs by default); select with: pytest -m dev_test
    dev_test_soak: hesperia-dev-test full-corpus soak (digit/bool/index/diacritic lanes, observational, not gold-checked); opt-in only, run with: pytest -m dev_test_soak
